<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn vragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../lib/style.css">
</head>
<body>
<div class="wrap">
  <div id="chrome"></div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script type="module">
import { esc, icon, ICON_TRASH, loadBank, deleteBankItem, loadSavedQuizzes, saveQuizToDevice,
         navMenuHTML, applyPoolToQuestion } from '../../lib/quiz-core.js';
import { rowText, wireScroll, openQuestionSimulate, openQuestionReveal } from '../../lib/editor-ui.js';

const el = document.getElementById('app');
const $ = s => document.querySelector(s);
const S = { scroll:0, addFor:null, msg:'' };
document.getElementById('chrome').innerHTML = navMenuHTML('questions', '../../');

function delItem(i){ if(confirm('Vraag verwijderen?')){ deleteBankItem(i); if(S.addFor===i)S.addFor=null; render(); } }

/* doelronde binnen de quiz: film/liedje naar hun eigen ronde, de rest naar "Eigen vragen". */
function roundNameFor(it){ return it.bucket==='films'?'Films':it.bucket==='liedjes'?'Liedjes':it.bucket==='puzzels'?'Wie of wat is dit?':'Eigen vragen'; }

/* voeg de gekozen vraag toe aan een bestaande of nieuwe quiz en sla op */
function addToQuiz(i){
  const it=loadBank()[i]; if(!it) return;
  const sel=$('#aq-sel'); let name = sel ? sel.value : '';
  if(!name){ const inp=$('#aq-new'); name=(inp&&inp.value.trim())||''; if(!name){ S.msg='Geef de nieuwe quiz een naam.'; render(); return; } }
  const quiz = loadSavedQuizzes()[name] || { name, rounds:[] };
  quiz.name = name; quiz.rounds = quiz.rounds || [];
  const rn = roundNameFor(it);
  let round = quiz.rounds.find(r=>r.name===rn);
  if(!round){ round={ name:rn, intro:'', questions:[] }; quiz.rounds.push(round); }
  round.questions.push(JSON.parse(JSON.stringify(it.q)));
  S.msg = saveQuizToDevice(name, quiz) ? `Toegevoegd aan “${name}”.` : 'Toevoegen mislukt (opslag vol?).';
  S.addFor=null; render();
}

function modalHTML(){
  const it=loadBank()[S.addFor]; if(!it) return '';
  const names=Object.keys(loadSavedQuizzes());
  return `<div class="modal" id="aq-modal"><div class="modalcard stack" style="gap:12px">
    <b style="font-size:17px">Aan welke quiz toevoegen?</b>
    <p class="muted ellip" style="margin:0;font-size:13px">${rowText(it.q)}</p>
    <select id="aq-sel" class="sinput">${names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}<option value="" ${names.length?'':'selected'}>+ Nieuwe quiz…</option></select>
    <input id="aq-new" class="sinput" placeholder="Naam van de nieuwe quiz" style="display:none">
    <div class="row" style="gap:6px"><button class="btn grow" id="aq-add">Toevoegen</button><button class="btn ghost" id="aq-cancel">Annuleer</button></div>
  </div></div>`;
}

function render(){
  const bank=loadBank();
  bank.forEach(it=>applyPoolToQuestion(it.q));   // lijst-vragen tonen de live pool (display only; opslag verandert pas bij opnieuw opslaan)
  const rows = bank.length ? bank.map((it,i)=>`<div class="listrow">
      <span class="ellip f14">${rowText(it.q)}</span>
      <button class="mini" data-reveal="${i}" title="voorvertoning — volledige vraag met alle hints" aria-label="voorvertoning">${icon('eye',15)}</button>
      <button class="mini" data-sim="${i}" title="simuleren — speel de vraag na" aria-label="simuleren">${icon('play',15)}</button>
      <button class="btn ghost xs" data-addq="${i}" title="aan een quiz toevoegen">${icon('plus',14)}quiz</button>
      <a class="btn ghost xs nolink center" href="new/?edit=${i}">Wijzig</a>
      <button class="mini danger" data-del="${i}" title="verwijderen" aria-label="verwijderen">${ICON_TRASH}</button></div>`).join('')
    : `<p class="muted m0">Nog geen losse vragen. Maak er een — je kunt ze daarna in elke quiz hergebruiken.</p>`;
  el.innerHTML = `<div class="center stack titleblock"><h1 class="h-lg">Mijn vragen</h1><p class="muted m0">Je persoonlijke vragenbank op dit apparaat.</p></div>
    <div class="row" style="gap:6px">
      <a class="btn grow center nolink" href="new/?type=custom">${icon('plus',16)}Custom</a>
      <a class="btn grow center nolink" href="new/?type=film">${icon('film',16)}Film</a>
      <a class="btn grow center nolink" href="new/?type=song">${icon('music',16)}Liedje</a>
      <a class="btn grow center nolink" href="new/?type=puzzle">${icon('eye',16)}Puzzel</a>
    </div>
    <div class="stack edscroll" id="ed-scroll" style="gap:6px">${rows}</div>
    ${S.msg?`<p class="muted feedback txt-ok">${esc(S.msg)}</p>`:''}
    <p class="muted center hint">Gebruik deze vragen via “+ Vraag toevoegen” bij <a href="../quizzes/">je quizzen</a>, of voeg ze hier direct toe met “+ quiz”.</p>
    ${S.addFor!=null?modalHTML():''}`;
  wireScroll($, S);
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delItem(+b.dataset.del));
  el.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{ const it=loadBank()[+b.dataset.reveal]; if(it){ applyPoolToQuestion(it.q); openQuestionReveal(it.q, '../../'); } });
  el.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{ const it=loadBank()[+b.dataset.sim]; if(it){ applyPoolToQuestion(it.q); openQuestionSimulate(it.q, '../../'); } });
  el.querySelectorAll('[data-addq]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.addq; S.addFor = S.addFor===i?null:i; S.msg=''; render(); });
  if(S.addFor!=null){
    const sel=$('#aq-sel'), inp=$('#aq-new');
    if(sel && inp){ const upd=()=>{ inp.style.display = sel.value==='' ? '' : 'none'; }; sel.onchange=upd; upd(); }
    const add=$('#aq-add'); if(add) add.onclick=()=>addToQuiz(S.addFor);
    const cancel=$('#aq-cancel'); if(cancel) cancel.onclick=()=>{ S.addFor=null; render(); };
    const modal=$('#aq-modal'); if(modal) modal.onclick=e=>{ if(e.target===modal){ S.addFor=null; render(); } };
  }
}
render();
</script>
</body>
</html>
