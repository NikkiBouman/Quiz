<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nieuwe vraag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../lib/style.css">
</head>
<body>
<div class="wrap">
  <div id="chrome"></div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script type="module">
import { esc, loadBank, addToBank, saveBank, pickFromQuestion, customPickFromQuestion, setMediaRoot } from '../../../lib/quiz-core.js';
setMediaRoot('../../../');   // puzzel-thumbnails in de bouwer vanaf deze diepe pagina laten kloppen
import { customFormHTML, readCustomPick, wireCustomForm,
         filmFormHTML, songFormHTML, makeMediaActions, readMediaPick, wireMediaForms, wireScroll,
         puzzleFormHTML, makePuzzleActions, wirePuzzleForms,
         editorTopbarHTML } from '../../../lib/editor-ui.js';

const el = document.getElementById('app');
const $ = s => document.querySelector(s);

/* welk type / welke bewerk-index? komt uit de URL (/new/?type=custom|film|song of ?edit=3) */
const params = new URLSearchParams(location.search);
const editIndex = params.has('edit') ? +params.get('edit') : null;
const typeParam = params.get('type');
const editing = editIndex!=null;
const toList = ()=>{ location.href = '../'; };

const S = { view:'custom', err:'', scroll:0, editIndex, customPick:null,
  filmQuery:'', filmResults:[], filmBusy:false, filmPick:null,
  songQuery:'', songResults:[], songBusy:false, songPick:null,
  puzzleRounds:null, puzzleBusy:false, puzzlePick:null };
const actions = makeMediaActions(S, render);
const pactions = makePuzzleActions(S, render);
let mbSync = null;   // sync van de bouwer (voor de top-bar Opslaan)

/* beginstand: een bestaande vraag bewerken, of een vers formulier van het gevraagde type.
   Alle niet-film/liedje-vragen (ook oude meerkeuze/open) openen in de custom-bouwer. */
function initForm(){
  if(editing){
    const it=loadBank()[editIndex]; if(!it){ toList(); return; }
    const q=it.q;
    if(it.bucket==='films'){ S.filmPick=pickFromQuestion(q); S.view='film'; }
    else if(it.bucket==='liedjes'){ S.songPick=pickFromQuestion(q); S.view='song'; }
    else if(it.bucket==='puzzels'){ S.puzzlePick=pickFromQuestion(q); S.view='puzzle'; }
    else { S.customPick=customPickFromQuestion(q); S.view='custom'; }
  } else {
    const t = typeParam==='film'||typeParam==='song'||typeParam==='puzzle' ? typeParam : 'custom';   // oude ?type=mc/open → custom
    S.view = t;
    if(t==='puzzle') pactions.loadPuzzleCatalog();
  }
}

/* opslaan in de bank (nieuw of, bij ?edit, vervangen) → terug naar de lijst */
function bankAdd(bucket, label, q){
  const item={ bucket, label, q: JSON.parse(JSON.stringify(q)) };
  if(editing){ const b=loadBank(); if(b[editIndex]){ b[editIndex]=item; saveBank(b); } }
  else addToBank(item);
  toList();
}
function addCustom(){ const r=readCustomPick(S); if(r.error){ S.err=r.error; render(); return; } bankAdd('custom', r.label, r.q); }
function addMedia(){ const r=readMediaPick(S); if(r.error){ S.err=r.error; render(); return; } bankAdd(r.kind==='puzzle'?'puzzels':r.isFilm?'films':'liedjes', r.label, r.q); }
/* de top-bar 'Opslaan' kiest de juiste actie; bij de bouwer eerst de DOM terug-syncen */
function saveCurrent(){
  if(mbSync) mbSync();
  if(S.view==='custom') addCustom();
  else addMedia();
}

function render(){
  const builder = (S.view==='film'&&S.filmPick) || (S.view==='song'&&S.songPick) || (S.view==='puzzle'&&S.puzzlePick);   // brede twee-koloms-bouwer
  const w=document.querySelector('.wrap'); if(w) w.classList.toggle('builderwide', !!builder);
  const inner =
    S.view==='film'   ? filmFormHTML(S, { editing, hideAdd:true, backId:'b-formback' }) :
    S.view==='song'   ? songFormHTML(S, { editing, hideAdd:true, backId:'b-formback' }) :
    S.view==='puzzle' ? puzzleFormHTML(S, { editing, hideAdd:true, backId:'b-formback' }) :
                        customFormHTML(S, { editing, hideAdd:true });
  el.innerHTML = `${inner}${S.err?`<p class="err feedback">${esc(S.err)}</p>`:''}`;
  wire();
}
function wire(){
  wireScroll($, S);
  if(S.view==='film' || S.view==='song'){
    mbSync = wireMediaForms(el, S, render, actions, { onAdd:addMedia, onBack:toList, backId:'b-formback' });
  } else if(S.view==='puzzle'){
    mbSync = wirePuzzleForms(el, S, render, pactions, { onAdd:addMedia, onBack:toList, backId:'b-formback' });
  } else {
    mbSync = wireCustomForm(el, S, render, {});
  }
}

initForm();
document.getElementById('chrome').innerHTML = editorTopbarHTML({ saveLabel: editing?'Bijwerken':'Opslaan' });
$('#b-topback').onclick = toList;
$('#b-save').onclick = saveCurrent;
render();
</script>
</body>
</html>
