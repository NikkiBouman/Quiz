    <div class="card"><b>Spelers (${others.length})</b><div class="chips" style="margin-top:10px">${others.map(n=>`<span class="pill ${n===app.name?'ok':''}">${esc(n)}</span>`).join('')}</div></div>`;
}
function answerAreaHTML(r){
  if(r.optionsMode==='list'){
    return `<div class="answers">${r.options.map((o,i)=>`<button class="ans ${app.sel===i?'sel':''}" data-i="${i}" data-c="${i}"><span class="shape" aria-hidden="true">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  if(r.optionsMode==='text'){
    return `<div class="searchwrap">
      <input id="t-input" class="sinput" type="text" placeholder="Typ je antwoord…" value="${esc(app.textAns||'')}" maxlength="60" autocomplete="off">
    </div>`;
  }
  const ph = r.optionsMode==='tmdb' ? 'Zoek een film…' : r.optionsMode==='deezer' ? 'Zoek een nummer…' : 'Zoek in de lijst…';
  return `<div class="searchwrap">
    <input id="s-input" class="sinput" type="text" placeholder="${ph}" value="${esc(app.searchText||'')}" autocomplete="off" autocapitalize="off">
    <div id="sout"></div></div>`;
}
function searchOutHTML(){
  // ingeklapt na een keuze: toon alleen het gekozen antwoord
  if(!app.searchOpen){
    return app.searchPick
      ? `<div class="picked">Gekozen: <b>${esc(app.searchPick.label)}</b> <span class="muted" style="font-size:12px">— tik in het veld om te wijzigen</span></div>`
      : '';
  }
  const busy = app.searchBusy ? '<p class="muted" style="margin:6px 0 0;font-size:13px">Zoeken…</p>' : '';
  const results = (app.searchResults||[]).map(x=>`<button class="sresult ${app.searchPick&&String(app.searchPick.id)===String(x.id)?'sel':''}" data-id="${esc(String(x.id))}" data-label="${esc(x.label)}">${x.thumb?`<img src="${esc(x.thumb)}" alt="">`:''}<span>${esc(x.label)}</span></button>`).join('');
  const picked = app.searchPick ? `<div class="picked">Gekozen: <b>${esc(app.searchPick.label)}</b></div>` : '';
  return busy + `<div class="sresults">${results}</div>` + picked;
}
function wireSearchResults(){
  el.querySelectorAll('.sresult').forEach(b=> b.onclick=()=>{
    const id=b.dataset.id, n=Number(id);
    app.searchPick = { id:(id!==''&&!isNaN(n))?n:id, label:b.dataset.label };
    app.searchOpen = false;            // na keuze inklappen
    renderPlayer();
  });
}
function refreshSearchOut(){ const out=el.querySelector('#sout'); if(out){ out.innerHTML=searchOutHTML(); wireSearchResults(); } }
function wireAnswerArea(r){
  if(r.optionsMode==='list'){
    el.querySelectorAll('.ans').forEach(b=> b.onclick=()=>{ app.sel=parseInt(b.dataset.i,10); renderPlayer(); });
    return;
  }
  if(r.optionsMode==='text'){
    const ti=$('#t-input');
    if(ti){
      ti.oninput=()=>{ app.textAns=ti.value; const b=$('#b-submit'); if(b) b.disabled = !ti.value.trim(); };
      ti.focus(); const L=ti.value.length; try{ ti.setSelectionRange(L,L); }catch(e){}
    }
    return;
  }
  if(r.optionsMode==='listsearch'){
    const inp=$('#s-input');
    const all = ()=> (r.options||[]).map((o,i)=>({id:i,label:o}));
    if(inp){
      inp.onfocus=()=>{ if(!app.searchOpen){ app.searchOpen=true; if(!app.searchResults.length) app.searchResults=all(); refreshSearchOut(); } };
      inp.oninput=()=>{
        app.searchText=inp.value; app.searchOpen=true;
        const ql=inp.value.trim().toLowerCase();
        app.searchResults = all().filter(x=> !ql || x.label.toLowerCase().includes(ql)).slice(0,40);
        app.searchBusy=false; refreshSearchOut();
      };
      if(app.searchOpen){ inp.focus(); const L=inp.value.length; try{ inp.setSelectionRange(L,L); }catch(e){} }
    }
    refreshSearchOut();
    return;
  }
  const inp = $('#s-input');
  if(inp){
    inp.onfocus = ()=>{ if(!app.searchOpen){ app.searchOpen=true; refreshSearchOut(); } };
    inp.oninput = ()=>{
      app.searchText = inp.value;
      app.searchOpen = true;
      clearTimeout(app._sTimer);
      const q = inp.value.trim();
      if(q.length<2){ app.searchResults=[]; app.searchBusy=false; refreshSearchOut(); return; }
      app._sTimer = setTimeout(async ()=>{
        app.searchBusy=true; refreshSearchOut();
        const res = await searchOptions(r.optionsMode, q);
        app.searchBusy=false; app.searchResults=res; refreshSearchOut();
      }, 300);
    };
    if(app.searchOpen){ inp.focus(); const L=inp.value.length; try{ inp.setSelectionRange(L,L); }catch(e){} }
  }
  refreshSearchOut();
}
function pRoundLbl(){
  const g=app.game; if(!g) return '';
  const rc=g.rc;
  return rc ? `${esc(rc.name||('Ronde '+(rc.ri+1)))} · vraag ${rc.qIn+1}/${rc.qCount}` : `${pRoundLbl()}`;
}
function playerRoundIntro(){
  const g=app.game; const rc=g.rc||{}; const ri=rc.ri??0;
  const did = app.readyRounds && app.readyRounds[ri];
  el.innerHTML = `
    <div class="center stack" style="gap:14px;flex:1;justify-content:center">
      <div class="qmeta">Nieuwe ronde ${ri+1}${rc.roundCount?' / '+rc.roundCount:''}</div>
      <h1 style="font-size:clamp(30px,8vw,48px)">${esc(rc.name||('Ronde '+(ri+1)))}</h1>
      ${rc.intro?`<p class="introtext">${esc(rc.intro)}</p>`:''}
      ${did
        ? `<p class="muted">Je bent er klaar voor ✓ — wachten op de host <span class="waiting-dots"></span></p>`
        : `<button class="btn big" id="b-ready">Ik snap het 👍</button>`}
    </div>`;
  const rb=$('#b-ready'); if(rb) rb.onclick=playerReady;
}
function playerReady(){
  const g=app.game; const ri=(g.rc&&g.rc.ri)||0;
  app.readyRounds[ri]=true;
  set(readyRef(app.code, app.pid, ri), true);
  renderPlayer();
}
function playerQuestion(){
  const g = app.game;
  const r = g.current;
  // nieuwe ronde → staat resetten
  if(app.searchRound!==g.round){
    app.searchRound=g.round; app.searchText=''; app.searchResults=[]; app.searchPick=null;
    app.searchBusy=false; app.sel=null; app.searchOpen=false; app.myStage=null; app.textAns='';
    app.reguess=false; app.forFun=false; app.confirmPass=false;
    app.wrongGuesses[g.round]=[]; app.lastSubmitLabel=null;
  }

  // gepast?
  if(app.passed[g.round]) return playerPassed();

  // ---- INZET: stap 1 — inzetten ----
  if(r.betting && g.betStep==='bet'){
    if(app.bet[g.round]==null){
      const base = r.points ?? 100;
      const spot = `<div class="spotlight"><div class="qmeta">${base} punten × je inzet</div><div class="qtext">${esc(r.question||'')}</div></div>`;
      const bets = (r.betMultipliers||[]).map((m,i)=>`<button class="betopt" data-bet="${i}"><span>Hint ${i+1}</span><span class="mult">×${m}</span></button>`).join('');
      el.innerHTML = `
        <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill">inzet</span></div>
        ${spot}
        ${metaHTML(r)}
        <div class="pointsbig">Deze vraag is <b>${base}</b> punten waard <span>× je inzet</span></div>
        <div class="card stack" style="gap:8px">
          <b>Hints die je gaat krijgen</b>
          ${hintLabelsHTML(r)}
        </div>
        <div class="card stack" style="gap:10px">
          <b>Bij welke hint denk je het uiterlijk te weten?</b>
          <p class="muted" style="margin:0;font-size:13px">Zet in op wanneer jij denkt het antwoord te weten. Hoe meer risico je neemt, hoe hoger de beloning. Maar let op: heb je het niet uiterlijk bij die hint goed? Dan krijg je 0 punten voor deze vraag!</p>
          <div class="bets">${bets}</div>
        </div>
        ${passBtnHTML}${passModalHTML()}`;
      el.querySelectorAll('[data-bet]').forEach(b=> b.onclick=()=> playerBet(parseInt(b.dataset.bet,10)));
      wirePass();
      return;
    }
    const m=(r.betMultipliers||[])[app.bet[g.round]];
    return playerHold('betwait', `Je inzet: hint ${app.bet[g.round]+1} (×${m}) — wachten tot iedereen heeft ingezet`);
  }
  // ---- INZET: stap 2 — inzetten van iedereen tonen ----
  if(r.betting && g.betStep==='reveal'){
    const entries = Object.keys(g.names||{}).map(pid=>({ name:g.names[pid], bet:(g.bets&&g.bets[pid]!=null)?g.bets[pid]:null }));
    el.innerHTML = `
      <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill ok">inzetten</span></div>
      <div class="spotlight"><div class="qmeta">${esc(r.question||'')}</div><div class="qtext" style="font-size:22px">De inzetten</div></div>
      ${betOverviewHTML(entries, r.betMultipliers)}
      <p class="footnote">Wachten tot de host de vraag start <span class="waiting-dots"></span></p>`;
    return;
  }

  // ---- SPELEN: al iets ingestuurd? ----
  if(app.submittedRound===g.round){
    if(!r.staged) return playerWaiting();
    const advanced = (g.stage||0) > (app.myStage||0);
    if(!advanced){
      if(!g.checked) return playerHold('hold');                 // wacht op 'controleer antwoorden'
      const verdict = g.judged ? g.judged[app.pid] : undefined;
      if(verdict===true) return playerHold('correct', winNote(r,g));
      const pi = pointsInfo(r, false, app.myStage, app.bet[g.round], g.stage);
      return pi.kind==='bust' ? playerHold('bust') : playerHold('wronghint');
    }
    // nieuwe hint: goed = vergrendeld blijven, fout = opnieuw raden
    const verdict = g.judged ? g.judged[app.pid] : undefined;
    if(verdict===true) return playerHold('correct', winNote(r,g));
    // fout + nieuwe hint → opnieuw raden; pas 'voor de lol' als de hint voorbij je inzet is
    const bet = app.bet[g.round];
    const busted = r.betting && bet!=null && (g.stage > bet);
    if(app.lastSubmitLabel){ app.wrongGuesses[g.round]=app.wrongGuesses[g.round]||[]; app.wrongGuesses[g.round].push(app.lastSubmitLabel); app.lastSubmitLabel=null; }
    app.submittedRound=-1; app.sel=null; app.searchPick=null; app.searchText=''; app.textAns='';
    app.searchResults=[]; app.searchOpen=false; app.reguess=true; app.forFun=busted;
  }

  // ---- antwoord-UI ----
  let spot, pill;
  if(r.staged){
    if(r.betting){
      const bi = app.bet[g.round];
      const m = bi!=null ? (r.betMultipliers||[])[bi] : null;
      const betTxt = bi!=null ? `inzet uiterlijk hint ${bi+1} (×${m})` : 'geen inzet';
      spot = `<div class="spotlight"><div class="qmeta">${esc(r.question||'')} · ${betTxt}</div>${playerStagesHTML(r)}</div>`;
      pill = bi!=null ? `×${m}` : 'voor de lol';
    } else {
      spot = `<div class="spotlight"><div class="qmeta">${esc(r.question||'')} · nu ${r.points} punten</div>${playerStagesHTML(r)}</div>`;
      pill = `${r.points} punten`;
    }
  } else {
    spot = `<div class="spotlight">${imgHTML(r.image)}<div class="qtext">${esc(r.question)}</div></div>`;
    pill = `${r.points} punten`;
  }
  const wrongs = (app.wrongGuesses&&app.wrongGuesses[g.round])||[];
  const funBanner = app.forFun
    ? `<div class="card funbanner"><b>Je speelt voor de lol 🎈</b> <span class="muted">Je inzet is verlopen, dit levert geen punten meer op — maar raad gerust mee!</span></div>`
    : (wrongs.length ? `<div class="wronglist"><span class="wl-h">Foute gokken:</span> ${wrongs.map(w=>`<span class="wl-chip">${esc(w)}</span>`).join('')}</div>` : '');
  const lockReady = r.optionsMode==='list' ? app.sel!=null : r.optionsMode==='text' ? !!(app.textAns&&app.textAns.trim()) : app.searchPick!=null;
  const btn = r.staged ? 'Antwoord vergrendelen' : 'Antwoord bevestigen';
  el.innerHTML = `
    <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill">${pill}</span></div>
    ${spot}
    ${metaHTML(r)}
    ${funBanner}
    ${answerAreaHTML(r)}
    <button class="btn big" id="b-submit" ${lockReady?'':'disabled'}>${btn}</button>
    ${passBtnHTML}${passModalHTML()}`;
  wireAnswerArea(r);
  $('#b-submit').onclick = playerSubmit;
  wirePass();
}
function winNote(r,g){
  const pi = pointsInfo(r, true, app.myStage, app.bet[g.round], g.stage);
  return pi.kind==='win' ? `${pi.text} punten — wachten op de host` : 'Maar 0 punten (te laat voor je inzet) — voor de lol meegespeeld';
}
function playerPassed(){
  const g=app.game;
  el.innerHTML = `<div class="center stack"><div class="qmeta">${pRoundLbl()}</div>
    <h1>Je hebt gepast ⤴</h1><p class="muted">Wachten op de volgende ronde <span class="waiting-dots"></span></p></div>`;
}
function playerWaiting(){
  const g=app.game;
  el.innerHTML = `<div class="center stack"><div class="qmeta">${pRoundLbl()}</div>
    <h1>Antwoord binnen ✓</h1><p class="muted">Wachten op de rest <span class="waiting-dots"></span></p>
    <span class="pill" style="align-self:center">${g.answeredCount}/${g.totalPlayers} geantwoord</span></div>`;
}
function playerHold(kind, note){
  const g=app.game;
  let head, sub, color='';
  if(kind==='correct'){ head='Goed geraden! ✓'; color='var(--groen)'; sub=note||'Wachten op de host'; }
  else if(kind==='wronghint'){ head='Helaas, fout'; color='var(--rood)'; sub='Wacht op de volgende hint.'; }
  else if(kind==='bust'){ head='Helaas, fout'; color='var(--rood)'; sub='0 punten — je inzet is verlopen. Je mag straks nog voor de lol meeraden.'; }
  else if(kind==='betwait'){ head='Je inzet staat ✓'; sub=note||'Wachten tot iedereen heeft gewed'; }
  else { head='Antwoord binnen ✓'; sub='Wachten op de controle'; }
  const hStyle = color?` style="color:${color}"`:'';
  el.innerHTML = `<div class="center stack"><div class="qmeta">${pRoundLbl()}</div>
    <h1${hStyle}>${head}</h1><p class="muted">${esc(sub)} <span class="waiting-dots"></span></p></div>`;
}
function allGuessesHTML(){
  const g=app.game; const res=g.results||{}; const names=g.names||{};
  const ids=Object.keys(res).filter(pid=> res[pid] && res[pid].answer!=null && !res[pid].passed);
  if(!ids.length) return '';
  ids.sort((a,b)=> (res[b].correct?1:0)-(res[a].correct?1:0));
  const rows=ids.map(pid=>{
    const rr=res[pid]; const me=pid===app.pid?' me':'';
    return `<div class="reviewrow${me}"><span class="rnm">${esc(names[pid]||'?')}</span>
      <span class="rguess">${esc(rr.label||'—')}</span>
      <span class="stbadge ${rr.correct?'good':'bad'}">${rr.correct?'goed ✓':'fout ✗'}</span></div>`;
  }).join('');
  return `<div class="card stack" style="gap:8px"><b>Alle gokken</b>${rows}</div>`;
}
function playerReveal(){
  const g=app.game, c=g.current, res = g.results && g.results[app.pid];
  const correct = res && res.correct;
  const correctLabel = c.answerLabel || (c.optionsMode==='list' && c.options ? c.options[c.answer] : '') || '';
  let body;
  if(c.optionsMode==='list'){
    const myAns = res ? res.answer : null;
    body = `<div class="answers">${(c.options||[]).map((o,i)=>{ let cls='dim'; if(i===c.answer)cls='correct'; else if(i===myAns)cls='wrong';
      return `<div class="ans ${cls}" data-c="${i}" aria-hidden="true"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></div>`;}).join('')}</div>`;
  } else {
    body = `<div class="card stack"><div>Juiste antwoord: <b>${esc(correctLabel)}</b></div>${res&&res.label?`<div class="muted">Jouw gok: ${esc(res.label)}</div>`:''}</div>${allGuessesHTML()}`;
  }
  const banner = res ? (correct ? `<h1 style="color:var(--groen)">Goed! +${res.gained}</h1>` : `<h1 style="color:var(--rood)">Helaas, fout</h1>`)
    : `<h1 class="muted">Geen antwoord ingestuurd</h1>`;
  el.innerHTML = `<div class="center stack">${banner}</div>${body}${playerLeaderboardHTML()}
    <p class="footnote">Wachten op de host voor de volgende vraag <span class="waiting-dots"></span></p>`;
}
function playerFinal(){
  const g=app.game;
  const rows = Object.keys(g.names).map(pid=>({pid,name:g.names[pid],score:g.scores[pid]||0})).sort((a,b)=>b.score-a.score);
  const myRank = rows.findIndex(r=>r.pid===app.pid)+1;
  el.innerHTML = `<div class="center stack"><div class="qmeta">Eindstand</div>
    <h1>${myRank===1?'🥇 Je hebt gewonnen!':'Je werd #'+myRank}</h1></div>${playerLeaderboardHTML()}
    <p class="footnote">Bedankt voor het meespelen.</p>`;
}
function playerLeaderboardHTML(){
  const g=app.game;
  const rows = Object.keys(g.names).map(pid=>({pid,name:g.names[pid],score:g.scores[pid]||0,
    gain: g.results && g.results[pid] ? g.results[pid].gained : 0})).sort((a,b)=>b.score-a.score);
  return `<div class="card lb">${rows.map((p,i)=>`<div class="lbrow ${p.pid===app.pid?'me':''}">
    <span class="rank">${i+1}</span><span class="nm">${esc(p.name)}</span>
    ${p.gain>0?`<span class="gain">+${p.gain}</span>`:''}<span class="sc">${p.score}</span></div>`).join('')}</div>`;
}

/* ============================================================ */
function ctrlLinkFor(code, token){
  return location.origin + location.pathname + '?judge=' + encodeURIComponent(code) + '&t=' + encodeURIComponent(token);
}
async function boot(){
  const params = new URLSearchParams(location.search);
  const jc = params.get('judge');
  if(jc){
    el.innerHTML = `<div class="center stack"><div class="qmeta">Jurylid</div><h1>Verbinden…</h1></div>`;
    let r='err';
    try{ r = await controllerJoin(jc, params.get('t')||''); }catch(e){ r='err'; }
    if(r!=='ok'){
      const msg = r==='nogame' ? 'Geen spel gevonden met die code.'
                : r==='badtoken' ? 'Deze jurylid-link is ongeldig of verlopen. Vraag de host om een nieuwe link.'
                : 'Verbinden mislukt — check de internetverbinding.';
      el.innerHTML = `<div class="center stack"><div class="qmeta">Jurylid</div><h1>Niet gelukt</h1>
        <p class="muted">${esc(msg)}</p><button class="btn ghost" id="b-home">Naar startscherm</button></div>`;
      const hb=$('#b-home'); if(hb) hb.onclick=()=>{ history.replaceState(null,'',location.pathname); renderHome(); };
    }
    return;
  }
  renderHome();
}
boot();
</script>
