<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn vragen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="tb-round" href="index.html" style="text-decoration:none">← Spel</a>
    <span class="tb-actions"><a class="btn ghost" href="quizzes.html" style="font-size:13px;padding:8px 12px;text-decoration:none">Mijn quizzen</a></span>
  </div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script type="module">
import * as core from './lib/quiz-core.js';
import { enableDragSort } from './lib/drag.js';
const { esc, qLabel, qTypeLabel, answerText, ICON_TRASH, ICON_GRIP, loadBank, addToBank, saveBank, deleteBankItem, tmdbSearch, movieCast, deezerSearch, popularMoviesHTML, defaultBetMults } = core;

const el = document.getElementById('app');
const $ = s => document.querySelector(s);
const S = { view:'list', err:'', msg:'', scroll:0, editIndex:null, mcDraft:null, openDraft:null, filmQuery:'', filmResults:[], filmBusy:false, filmPick:null, songQuery:'', songResults:[], songBusy:false, songPick:null };
/* lijst-regel: antwoord eerst, dan type + vraagtekst */
function rowText(q){
  const ans=answerText(q), title=ans||qLabel(q), extra=(ans&&q.question)?' · '+q.question:'';
  return `${esc(title)} <span class="muted" style="font-size:11px">· ${esc(qTypeLabel(q))}${esc(extra)}</span>`;
}

function applyMediaToQ(q,url,type){ url=(url||'').trim(); if(!url)return; if(type==='video')q.video=url; else if(type==='audio')q.audio=url; else q.image=url; }
/* opslaan: nieuw toevoegen, of (bij wijzigen) de bestaande vraag vervangen */
function bankAdd(bucket,label,q){
  const item={ bucket, label, q: JSON.parse(JSON.stringify(q)) };
  if(S.editIndex!=null){ const b=loadBank(); if(b[S.editIndex]){ b[S.editIndex]=item; saveBank(b); } S.editIndex=null; S.msg='Vraag bijgewerkt.'; }
  else { addToBank(item); S.msg='Vraag opgeslagen in je bank.'; }
  S.view='list'; render();
}
/* een bestaande bankvraag in het juiste formulier laden om te wijzigen */
function editItem(i){
  const it=loadBank()[i]; if(!it) return; const q=it.q;
  S.editIndex=i; S.err=''; S.msg='';
  const mt = q.video?'video':q.audio?'audio':'image', media=(q.image||q.video||q.audio||'');
  if(it.bucket==='films'){
    S.filmPick={ tmdbId:q.answer, label:q.answerLabel||'', cast:(q.stages||[]).map(s=>({img:s.image, name:'', checked:true})) };
    S.view='film';
  } else if(it.bucket==='liedjes'){
    const mode=q.options===':deezer'?':deezer':':text';
    const label = mode===':deezer' ? (q.answerLabel||'') : (q.answer||'');
    S.songPick={ deezerId:mode===':deezer'?q.answer:null, label, preview:q.audio||'', prompt:q.question||'Welk nummer is dit?', start:q.clipStart??0, end:q.clipEnd??'', mode };
    S.view='song';
  } else if(q.options===':text'){
    S.openDraft={ question:q.question||'', media, mediaType:mt, answer:q.answer||'', accept:(q.accept||[]).join(', ') };
    S.view='open';
  } else {
    const ai=q.answer!=null?q.answer:0;
    S.mcDraft={ question:q.question||'', media, mediaType:mt, correct:(q.options||[])[ai]||'', distractors:(q.options||[]).filter((_,idx)=>idx!==ai) };
    S.view='mc';
  }
  render();
}

/* meerkeuze */
function readMc(){ const d=S.mcDraft||(S.mcDraft={}); const g=id=>{const e=$('#'+id);return e?e.value:undefined;}; if($('#mc-q')!=null){ d.question=g('mc-q'); d.media=g('mc-media'); d.mediaType=g('mc-mtype'); d.correct=g('mc-correct'); d.distractors=[0,1,2,3,4].map(i=>g('mc-d'+i)).map(x=>x==null?'':x);} return d; }
function addMc(){
  const d=readMc(); const correct=(d.correct||'').trim(); const dist=(d.distractors||[]).map(x=>(x||'').trim()).filter(Boolean);
  if(!correct){ S.err='Vul het juiste antwoord in.'; render(); return; }
  if(!dist.length){ S.err='Vul minstens één foute optie in (of gebruik "Open vraag").'; render(); return; }
  const q={ question:(d.question||'').trim(), options:[correct,...dist], answer:0, shuffle:true };
  applyMediaToQ(q,d.media,d.mediaType);
  if(!q.question && !q.image && !q.video && !q.audio){ S.err='Geef een vraag of een medialink op.'; render(); return; }
  S.mcDraft=null; S.err=''; bankAdd('eigen', (q.question||correct), q);
}
/* open */
function readOpen(){ const d=S.openDraft||(S.openDraft={}); const g=id=>{const e=$('#'+id);return e?e.value:undefined;}; if($('#op-q')!=null){ d.question=g('op-q'); d.media=g('op-media'); d.mediaType=g('op-mtype'); d.answer=g('op-ans'); d.accept=g('op-accept'); } return d; }
function addOpen(){
  const d=readOpen(); const ans=(d.answer||'').trim();
  if(!ans){ S.err='Vul het juiste antwoord in.'; render(); return; }
  const accept=(d.accept||'').split(',').map(x=>x.trim()).filter(Boolean);
  const q={ question:(d.question||'').trim(), options:':text', answer:ans, accept };
  applyMediaToQ(q,d.media,d.mediaType);
  if(!q.question && !q.image && !q.video && !q.audio){ S.err='Geef een vraag of een medialink op.'; render(); return; }
  S.openDraft=null; S.err=''; bankAdd('eigen', (q.question||ans), q);
}
/* film */
async function filmSearch(){ const e=$('#film-q'); const q=e?e.value.trim():''; S.filmQuery=q; if(!q){ S.filmResults=[]; render(); return; } S.filmBusy=true; render(); try{ S.filmResults=await tmdbSearch(q); }catch(err){ S.filmResults=[]; S.err='Zoeken mislukt: '+err.message; } S.filmBusy=false; render(); }
async function filmPick(id,label){ S.filmBusy=true; S.filmResults=[]; S.filmQuery=''; render(); const cast=await movieCast(id,5); S.filmPick={ tmdbId:id, label, cast: cast.slice().reverse().map(c=>({...c, checked:true})) }; S.filmBusy=false; render(); }   // minst bekende bovenaan (eerst getoond)
function filmToggle(i){ const p=S.filmPick; if(!p)return; p.cast[i].checked=!p.cast[i].checked; render(); }
function reorderCast(order){ const p=S.filmPick; if(!p)return; p.cast = order.map(i=>p.cast[i]); render(); }
function addFilm(){
  const p=S.filmPick; if(!p){ S.err='Kies eerst een film.'; render(); return; }
  const sel=p.cast.filter(c=>c.checked); if(sel.length<2){ S.err='Kies minstens 2 acteurs.'; render(); return; }
  const mults=defaultBetMults(sel.length);
  const q={ question:'In welke film spelen deze acteurs?', options:':tmdb', answer:Number(p.tmdbId)||p.tmdbId, answerLabel:p.label, points:100, stages: sel.map((c,i)=>({ image:c.img, betMultiplier:mults[i] })) };
  S.filmPick=null; S.err=''; bankAdd('films', p.label, q);
}
/* liedje: zoek via Deezer → preview-fragment (~30s) → kies een clip-venster */
async function songSearch(){ const e=$('#song-q'); const q=e?e.value.trim():''; S.songQuery=q; if(!q){ S.songResults=[]; render(); return; } S.songBusy=true; render(); try{ S.songResults=await deezerSearch(q); }catch(err){ S.songResults=[]; S.err='Zoeken mislukt: '+err.message; } S.songBusy=false; render(); }
function songPickTrack(i){ const t=S.songResults[i]; if(!t)return; if(!t.preview){ S.err='Geen fragment beschikbaar voor dit nummer.'; render(); return; } S.songPick={ deezerId:t.id, label:t.label, preview:t.preview, prompt:'Welk nummer is dit?', start:0, end:15, mode:':deezer' }; S.songResults=[]; S.songQuery=''; S.err=''; render(); }
function addSong(){
  const p=S.songPick; if(!p){ S.err='Kies eerst een nummer.'; render(); return; }
  const g=id=>{ const e=$('#'+id); return e?e.value:''; };
  const start=Math.max(0, parseFloat(g('song-start'))||0);
  let end=parseFloat(g('song-end')); if(isNaN(end)) end=null;
  if(end!=null && end<=start){ S.err='“tot” moet ná “van” liggen.'; render(); return; }
  const mode=g('song-mode')||':deezer';
  const prompt=(g('song-prompt')||'').trim() || 'Welk nummer is dit?';
  const q = mode===':text'
    ? { question:prompt, options:':text', answer:p.label, audio:p.preview, clipStart:start }
    : { question:prompt, options:':deezer', answer:Number(p.deezerId)||p.deezerId, answerLabel:p.label, audio:p.preview, clipStart:start };
  if(end!=null) q.clipEnd=end;
  S.songPick=null; S.err=''; bankAdd('liedjes', p.label, q);
}
function delItem(i){ if(confirm('Vraag verwijderen?')){ deleteBankItem(i); render(); } }

/* ---------- HTML ---------- */
function mediaRowHTML(pfx,d){ d=d||{}; return `<input id="${pfx}-media" class="sinput" placeholder="Medialink (optioneel): https://…" value="${esc(d.media||'')}">
  <select id="${pfx}-mtype" class="sinput">${['image','video','audio'].map(t=>`<option value="${t}" ${d.mediaType===t?'selected':''}>${t==='image'?'afbeelding':t==='video'?'video':'audio'}</option>`).join('')}</select>`; }
function listHTML(){
  const bank=loadBank();
  const rows = bank.length ? bank.map((it,i)=>`<div class="row" style="gap:6px;align-items:center;background:var(--surface-2);border-radius:10px;padding:9px 11px">
      <span style="flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${rowText(it.q)}</span>
      <button class="mini" data-edit="${i}">Wijzig</button>
      <button class="mini danger" data-del="${i}" title="verwijderen">${ICON_TRASH}</button></div>`).join('')
    : `<p class="muted" style="margin:0">Nog geen losse vragen. Maak er een — je kunt ze daarna in elke quiz hergebruiken.</p>`;
  return `<div class="center stack" style="gap:2px;margin-bottom:6px"><h1 style="font-size:clamp(28px,7vw,44px)">Mijn vragen</h1><p class="muted" style="margin:0">Je persoonlijke vragenbank op dit apparaat.</p></div>
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn grow" id="b-mc">+ Meerkeuze</button><button class="btn grow" id="b-open">+ Open vraag</button><button class="btn grow" id="b-film">+ Film (acteurs)</button><button class="btn grow" id="b-song">+ Liedje</button></div>
    <div class="stack" id="ed-scroll" style="gap:6px">${rows}</div>
    <p class="muted center" style="font-size:12px">Gebruik deze vragen via “+ Vraag toevoegen” bij <a href="quizzes.html">je quizzen</a>.</p>`;
}
function mcFormHTML(){ const d=S.mcDraft||{}; return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">${S.editIndex!=null?'Meerkeuze wijzigen':'Meerkeuzevraag'}</h1></div>
  <div class="stack" id="ed-scroll" style="gap:8px">
    <input id="mc-q" class="sinput" placeholder="De vraag (mag leeg bij alleen een medialink)" value="${esc(d.question||'')}">
    ${mediaRowHTML('mc',d)}
    <label class="lbl">Juiste antwoord</label><input id="mc-correct" class="sinput" placeholder="Het juiste antwoord" value="${esc(d.correct||'')}">
    <label class="lbl">Foute opties (minstens 1)</label>
    ${[0,1,2,3,4].map(i=>`<input id="mc-d${i}" class="sinput" placeholder="Foute optie ${i+1}" value="${esc((d.distractors&&d.distractors[i])||'')}">`).join('')}
    <p class="muted" style="font-size:12px;margin:0">De volgorde wordt willekeurig in de quiz.</p>
  </div>
  <div class="row"><button class="btn grow" id="b-mc-add">${S.editIndex!=null?'Bijwerken':'Opslaan'}</button><button class="btn ghost" id="b-back">Terug</button></div>`; }
function openFormHTML(){ const d=S.openDraft||{}; return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">${S.editIndex!=null?'Open vraag wijzigen':'Open vraag'}</h1></div>
  <div class="stack" id="ed-scroll" style="gap:8px">
    <input id="op-q" class="sinput" placeholder="De vraag (mag leeg bij alleen een medialink)" value="${esc(d.question||'')}">
    ${mediaRowHTML('op',d)}
    <label class="lbl">Juiste antwoord</label><input id="op-ans" class="sinput" placeholder="Het juiste antwoord" value="${esc(d.answer||'')}">
    <label class="lbl">Ook goed (komma-gescheiden, optioneel)</label><input id="op-accept" class="sinput" placeholder="bv. variant 1, variant 2" value="${esc(d.accept||'')}">
  </div>
  <div class="row"><button class="btn grow" id="b-op-add">${S.editIndex!=null?'Bijwerken':'Opslaan'}</button><button class="btn ghost" id="b-back">Terug</button></div>`; }
function filmFormHTML(){
  if(S.filmPick){ const p=S.filmPick;
    const cast=p.cast.map((c,i)=>`<div class="row" data-idx="${i}" style="gap:8px;align-items:center;padding:3px 0"><span class="grip" title="Sleep om te herordenen">${ICON_GRIP}</span><span class="cnum" style="flex:none">${i+1}</span><input type="checkbox" data-actor="${i}" ${c.checked?'checked':''}><img src="${esc(c.img)}" alt="" style="width:38px;height:38px;border-radius:8px;object-fit:cover"><span style="flex:1;font-size:14px">${esc(c.name)}</span></div>`).join('');
    return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">${S.editIndex!=null?'Film wijzigen':'Film'}: ${esc(p.label)}</h1></div>
      <p class="muted" style="font-size:13px;margin:0">Volgorde: <b>1 bovenaan = eerst getoond</b> (lastigst), de ster onderaan. Vink aan en sleep ze in de juiste volgorde.</p>
      <div class="stack" id="ed-scroll" style="gap:2px">${cast || '<p class="muted">Geen acteurfoto’s gevonden (Worker gedeployd?).</p>'}</div>
      <div class="row"><button class="btn grow" id="b-film-add">${S.editIndex!=null?'Bijwerken':'Opslaan'}</button><button class="btn ghost" id="b-film-reset">Andere film</button></div>`;
  }
  const res=S.filmResults||[];
  return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Film (acteurs raden)</h1></div>
    <div class="row" style="gap:6px"><input id="film-q" class="sinput" placeholder="Zoek een film…" value="${esc(S.filmQuery||'')}" style="flex:1"><button class="btn" id="b-film-search">Zoek</button></div>
    ${S.filmBusy?'<p class="muted center" style="margin:0">Bezig…</p>':''}
    <div class="stack" id="ed-scroll" style="gap:4px">${res.map(m=>`<button class="btn ghost" data-film="${esc(m.id)}|${esc(m.label)}" style="display:flex;align-items:center;text-align:left;font-size:14px">${m.thumb?`<img src="${esc(m.thumb)}" style="width:28px;height:40px;object-fit:cover;border-radius:4px;margin-right:8px">`:''}${esc(m.label)}</button>`).join('')}</div>
    ${popularMoviesHTML()}
    <div class="row"><button class="btn ghost" id="b-back">Terug</button></div>`;
}
function songFormHTML(){
  if(S.songPick){ const p=S.songPick;
    return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">${S.editIndex!=null?'Liedje wijzigen':'Liedje'}: ${esc(p.label)}</h1></div>
      <p class="muted" style="font-size:13px;margin:0">Luister het ~30s-fragment en kies welk stukje de spelers horen. Het fragment speelt <b>alleen op het hostscherm</b>.</p>
      <audio controls preload="none" src="${esc(p.preview)}" style="width:100%"></audio>
      <div class="stack" id="ed-scroll" style="gap:8px">
        <input id="song-prompt" class="sinput" placeholder="De vraag" value="${esc(p.prompt||'Welk nummer is dit?')}">
        <label class="lbl">Welk stukje van het fragment spelen?</label>
        <div class="row" style="gap:8px;align-items:center">
          <span class="muted">van</span><input type="number" id="song-start" class="sinput" min="0" max="30" step="1" value="${p.start??0}" style="width:80px">
          <span class="muted">tot</span><input type="number" id="song-end" class="sinput" min="0" max="30" step="1" value="${p.end??''}" style="width:80px">
          <span class="muted">seconde (leeg = einde)</span>
        </div>
        <label class="lbl">Hoe antwoorden de spelers?</label>
        <select id="song-mode" class="sinput">
          <option value=":deezer" ${p.mode!==':text'?'selected':''}>Spelers zoeken het nummer in Deezer</option>
          <option value=":text" ${p.mode===':text'?'selected':''}>Open antwoord (jij beoordeelt)</option>
        </select>
      </div>
      <div class="row"><button class="btn grow" id="b-song-add">${S.editIndex!=null?'Bijwerken':'Opslaan'}</button><button class="btn ghost" id="b-song-reset">Ander nummer</button></div>`;
  }
  const res=S.songResults||[];
  return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Liedje (fragment afspelen)</h1></div>
    <div class="row" style="gap:6px"><input id="song-q" class="sinput" placeholder="Zoek een nummer…" value="${esc(S.songQuery||'')}" style="flex:1"><button class="btn" id="b-song-search">Zoek</button></div>
    ${S.songBusy?'<p class="muted center" style="margin:0">Bezig…</p>':''}
    <div class="stack" id="ed-scroll" style="gap:4px">${res.map((t,i)=>`<button class="btn ghost" data-song="${i}" style="display:flex;align-items:center;text-align:left;font-size:14px">${t.thumb?`<img src="${esc(t.thumb)}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;margin-right:8px">`:''}${esc(t.label)}${t.preview?'':' — <span class="muted">geen fragment</span>'}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="b-back">Terug</button></div>`;
}
function render(){
  const v=S.view;
  const inner = v==='mc'?mcFormHTML() : v==='open'?openFormHTML() : v==='film'?filmFormHTML() : v==='song'?songFormHTML() : listHTML();
  el.innerHTML = `${inner}
    ${S.err?`<p class="err" style="margin:4px 0 0">${esc(S.err)}</p>`:''}
    ${S.msg?`<p class="muted" style="margin:4px 0 0;color:var(--groen)">${esc(S.msg)}</p>`:''}`;
  wire();
}
function wire(){
  const sc=$('#ed-scroll'); if(sc){ sc.style.overflow='auto'; sc.style.maxHeight='56vh'; sc.scrollTop=S.scroll||0; sc.onscroll=()=>{ S.scroll=sc.scrollTop; }; }
  const v=S.view;
  if(v==='list'){
    // verse vraag maken: drafts + editIndex wissen
    const go=v2=>()=>{ S.mcDraft=null; S.openDraft=null; S.filmPick=null; S.songPick=null; S.editIndex=null; S.view=v2; S.err=''; S.msg=''; render(); };
    const m=$('#b-mc'); if(m)m.onclick=go('mc');
    const o=$('#b-open'); if(o)o.onclick=go('open');
    const f=$('#b-film'); if(f)f.onclick=go('film');
    const sg=$('#b-song'); if(sg)sg.onclick=go('song');
    el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editItem(+b.dataset.edit));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delItem(+b.dataset.del));
    return;
  }
  const cancel=()=>{ S.mcDraft=null; S.openDraft=null; S.filmPick=null; S.songPick=null; S.editIndex=null; S.view='list'; S.err=''; render(); };
  if(v==='mc'){ const a=$('#b-mc-add'); if(a)a.onclick=addMc; const b=$('#b-back'); if(b)b.onclick=cancel; return; }
  if(v==='open'){ const a=$('#b-op-add'); if(a)a.onclick=addOpen; const b=$('#b-back'); if(b)b.onclick=cancel; return; }
  if(v==='film'){
    const s=$('#b-film-search'); if(s)s.onclick=filmSearch;
    const fq=$('#film-q'); if(fq)fq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); filmSearch(); } };
    el.querySelectorAll('[data-film]').forEach(b=>b.onclick=()=>{ const val=b.dataset.film; const i=val.indexOf('|'); filmPick(val.slice(0,i), val.slice(i+1)); });
    el.querySelectorAll('.pmovie').forEach(b=>b.onclick=()=>filmPick(b.dataset.pid, b.dataset.plabel));
    el.querySelectorAll('[data-actor]').forEach(cb=>cb.onchange=()=>filmToggle(+cb.dataset.actor));
    if(S.filmPick) enableDragSort($('#ed-scroll'), { handle:'.grip', onDrop:reorderCast });
    const add=$('#b-film-add'); if(add)add.onclick=addFilm;
    const rs=$('#b-film-reset'); if(rs)rs.onclick=()=>{ S.filmPick=null; S.err=''; render(); };
    const b=$('#b-back'); if(b)b.onclick=cancel;
    return;
  }
  if(v==='song'){
    const s=$('#b-song-search'); if(s)s.onclick=songSearch;
    const sq=$('#song-q'); if(sq)sq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); songSearch(); } };
    el.querySelectorAll('[data-song]').forEach(b=>b.onclick=()=>songPickTrack(+b.dataset.song));
    const add=$('#b-song-add'); if(add)add.onclick=addSong;
    const rs=$('#b-song-reset'); if(rs)rs.onclick=()=>{ S.songPick=null; S.err=''; render(); };
    const b=$('#b-back'); if(b)b.onclick=cancel;
    return;
  }
}
render();
</script>
</body>
</html>
