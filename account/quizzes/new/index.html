<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz maken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../lib/style.css">
</head>
<body>
<div class="wrap">
  <div id="chrome"></div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script type="module">
import { esc, icon, itemLabel, ICON_TRASH, ICON_GRIP, loadCatalog, buildQuestion,
         loadSavedQuizzes, saveQuizToDevice, deleteSavedQuiz, loadBank, addToBank, saveBank,
         flattenQuiz, resolvePoolQuestions, setMediaRoot,
         pickFromQuestion, customPickFromQuestion } from '../../../lib/quiz-core.js';
setMediaRoot('../../../');   // puzzel-thumbnails in de bouwer vanaf deze diepe pagina laten kloppen
import { enableDragSort } from '../../../lib/drag.js';
import { rowText, customFormHTML, readCustomPick, wireCustomForm,
         filmFormHTML, songFormHTML, makeMediaActions, readMediaPick, wireMediaForms, wireScroll,
         puzzleFormHTML, makePuzzleActions, wirePuzzleForms,
         editorTopbarHTML, openQuestionSimulate, openQuestionReveal } from '../../../lib/editor-ui.js';

const el = document.getElementById('app');
const $ = s => document.querySelector(s);
const toList = ()=>{ location.href = '../'; };
const S = {
  view:'edit', catalog:null, busy:false, err:'', msg:'', scroll:0,
  draft:null, editingName:null, sel:{}, bankSel:{}, libFolder:null,
  editingQ:null, targetRound:null,
  customPick:null,
  filmQuery:'', filmResults:[], filmBusy:false, filmPick:null,
  songQuery:'', songResults:[], songBusy:false, songPick:null,
  puzzleRounds:null, puzzleBusy:false, puzzlePick:null,
};
const actions = makeMediaActions(S, render);
const pactions = makePuzzleActions(S, render);

/* knop-label + icoon per kant-en-klare ronde-map (anders valt de round.json-naam terug). */
const LIB_META = { bandle:{label:'Bandle', icon:'music'}, puzzle:{label:'Puzzel', icon:'puzzle'} };
const libMeta = rd => LIB_META[rd.folder] || { label:rd.name, icon:'help' };

/* ---------- helpers ---------- */
function syncName(){ const e=$('#q-name'); if(e && S.draft) S.draft.name=e.value; }
/* lees naam + rondenaam/uitleg uit de DOM terug in de draft (vóór een re-render/opslaan) */
function syncEdit(){
  syncName();
  if(!S.draft) return;
  el.querySelectorAll('.r-name').forEach(inp=>{ const r=S.draft.rounds[+inp.dataset.ri]; if(r) r.name=inp.value; });
  el.querySelectorAll('.r-intro').forEach(t=>{ const r=S.draft.rounds[+t.dataset.ri]; if(r) r.intro=t.value; });
  el.querySelectorAll('.q-pts').forEach(inp=>{ const r=S.draft.rounds[+inp.dataset.ri], q=r&&r.questions[+inp.dataset.qi]; if(q){ const v=parseInt(inp.value,10); q.points = (isNaN(v)||v<0) ? 100 : v; } });
}
function ensureRound(d, name, intro){ let r=d.rounds.find(x=>x.name===name); if(!r){ r={name,intro:intro||'',questions:[]}; d.rounds.push(r); } return r; }
function libSelCount(folder){ const s=S.sel[folder]||{}; return Object.keys(s).filter(k=>s[k]).length; }
function bankSelCount(){ return Object.keys(S.bankSel).filter(k=>S.bankSel[k]).length; }
function qCount(d){ return ((d&&d.rounds)||[]).reduce((n,r)=>n+(r.questions?r.questions.length:0),0); }
function pushToDraft(round, bucket, label, q){
  round.questions.push(q);
  addToBank({ bucket, label, q: JSON.parse(JSON.stringify(q)) });
}
function betOf(q){ return q.bet!=null ? !!q.bet : (Array.isArray(q.stages) && q.stages.some(s=>s.betMultiplier!=null)); }

/* doelronde-kiezer: kies een bestaande ronde van de quiz of maak een nieuwe. */
function roundPickerHTML(pfx, defName){
  const rounds=(S.draft&&S.draft.rounds)||[];
  const pre = S.targetRound != null ? rounds[S.targetRound] : null;
  const opts = rounds.map(r=>`<option value="${esc(r.name)}" ${pre&&r===pre?'selected':''}>${esc(r.name)} (${r.questions.length})</option>`).join('');
  return `<label class="lbl">In welke ronde?</label>
    <select id="${pfx}-round" class="sinput">${opts}<option value="" ${pre?'':'selected'}>+ Nieuwe ronde…</option></select>
    <input id="${pfx}-newround" class="sinput" placeholder="Naam van de nieuwe ronde" value="${esc(defName||'')}">`;
}
function wireRoundPicker(pfx){
  const sel=$('#'+pfx+'-round'), inp=$('#'+pfx+'-newround');
  if(!sel||!inp) return;
  const upd=()=>{ inp.style.display = sel.value==='' ? '' : 'none'; };
  sel.onchange=upd; upd();
}
function targetRoundFor(pfx, fallbackName, fallbackIntro){
  const sel=$('#'+pfx+'-round');
  let name = sel ? sel.value : '';
  if(!name){ const inp=$('#'+pfx+'-newround'); name = (inp && inp.value.trim()) || fallbackName; }
  return ensureRound(S.draft, name, fallbackIntro);
}

/* ---------- init / acties ---------- */
async function boot(){
  S.busy=true; render();
  try{ if(!S.catalog) S.catalog = await loadCatalog(); }catch(e){ S.err='Bibliotheek laden mislukt: '+e.message; }
  S.busy=false;
  const editName=new URLSearchParams(location.search).get('edit');
  if(editName){
    const q=loadSavedQuizzes()[editName];
    if(q){ const f=flattenQuiz(q);
      S.draft={ name:q.name||editName, rounds: f.rounds.map(rr=>({ name:rr.name||'Ronde', intro:rr.intro||'', questions: f.questions.slice(rr.start,rr.end).map(x=>JSON.parse(JSON.stringify(x))) })) };
      resolvePoolQuestions(S.draft);   // lijst-vragen verversen tegen de live pools (auto-update)
      S.editingName=editName;
    } else { S.err='Quiz niet gevonden.'; S.draft={name:'',rounds:[]}; }
  } else { S.draft={name:'',rounds:[]}; S.editingName=null; }
  S.view='edit'; render();
}
function saveDraft(){
  syncEdit(); const d=S.draft; if(!d) return;
  const nm=(d.name||'').trim();
  if(!nm){ S.err='Geef je quiz een naam.'; S.view='edit'; render(); return; }
  d.rounds=(d.rounds||[]).filter(r=>r.questions&&r.questions.length);
  if(!qCount(d)){ S.err='Voeg minstens één vraag toe.'; S.view='edit'; render(); return; }
  d.name=nm;
  if(S.editingName && S.editingName!==nm) deleteSavedQuiz(S.editingName);
  if(!saveQuizToDevice(nm, JSON.parse(JSON.stringify(d)))){ S.err='Opslaan mislukt (opslag vol?).'; S.view='edit'; render(); return; }
  toList();
}
function gotoAdd(ri){ syncEdit(); S.sel={}; S.bankSel={}; S.view='add'; S.err=''; S.msg=''; S.targetRound=ri!=null?ri:null; render(); }
function toggleItem(f,k){ if(!S.sel[f])S.sel[f]={}; S.sel[f][k]=!S.sel[f][k]; render(); }
function toggleRound(f){ const rd=(S.catalog||[]).find(r=>r.folder===f); if(!rd)return; const keys=Object.keys(rd.items); const sel=S.sel[f]||(S.sel[f]={}); const all=keys.every(k=>sel[k]); keys.forEach(k=>sel[k]=!all); render(); }
function toggleBank(i){ S.bankSel[i]=!S.bankSel[i]; render(); }
async function addSelections(){
  if(!S.draft) return;
  const bank=loadBank();
  const bankPicked=Object.keys(S.bankSel).filter(i=>S.bankSel[i]&&bank[+i]);
  let bankRoundName=null;
  if(bankPicked.length){
    const sel=$('#bank-round'); const nm=sel?sel.value:'';
    bankRoundName = nm || (($('#bank-newround')&&$('#bank-newround').value.trim()) || 'Eigen vragen');
  }
  /* lees lib-ronde-kiezer vóór re-render (DOM verdwijnt daarna) */
  const libSelEl=$('#lib-round'), libNewEl=$('#lib-newround');
  let libRoundName = libSelEl ? libSelEl.value : null;
  if(libRoundName==='' && libNewEl) libRoundName = libNewEl.value.trim() || null;
  S.busy=true; render(); let added=0;
  try{
    for(const rd of (S.catalog||[])){
      const picked=Object.keys(rd.items).filter(k=> S.sel[rd.folder]&&S.sel[rd.folder][k]);
      if(!picked.length) continue;
      const round=ensureRound(S.draft, libRoundName||rd.name, rd.intro);
      for(const k of picked){ round.questions.push(await buildQuestion(rd,k,rd.items[k])); added++; }
    }
    if(bankPicked.length){
      const round=ensureRound(S.draft, bankRoundName, '');
      bankPicked.forEach(i=>{ round.questions.push(JSON.parse(JSON.stringify(bank[+i].q))); added++; });
    }
  }catch(e){ S.err='Toevoegen mislukt: '+e.message; }
  S.sel={}; S.bankSel={}; S.busy=false; S.view='edit'; S.targetRound=null; S.msg=added?`${added} vraag/vragen toegevoegd.`:''; render();
}
function reorderRounds(order){ syncEdit(); const d=S.draft; if(!d)return; d.rounds = order.map(i=>d.rounds[i]); render(); }
function reorderQ(ri,order){ syncEdit(); const r=S.draft&&S.draft.rounds[ri]; if(!r)return; r.questions = order.map(i=>r.questions[i]); render(); }
function delQ(ri,qi){ const d=S.draft, r=d&&d.rounds[ri]; if(!r)return; r.questions.splice(qi,1); if(!r.questions.length) d.rounds.splice(ri,1); render(); }
function qForCompare(q){ const c=JSON.parse(JSON.stringify(q)); delete c.points; delete c.bet; return JSON.stringify(c); }
function editQ(ri,qi){
  syncEdit();
  const q=S.draft&&S.draft.rounds[ri]&&S.draft.rounds[ri].questions[qi]; if(!q) return;
  const src=q.source||{};
  const bank=loadBank(), cmp=qForCompare(q);
  const bankIdx=bank.findIndex(it=>qForCompare(it.q)===cmp);
  S.editingQ={ri,qi,bankIdx}; S.err=''; S.msg='';
  if(src.kind==='puzzle'){ S.puzzlePick=pickFromQuestion(q); S.view='puzzle'; }
  else if(src.kind==='tmdb'||q.options===':tmdb'){ S.filmPick=pickFromQuestion(q); S.view='film'; }
  else if(src.kind==='deezer'){ S.songPick=pickFromQuestion(q); S.view='song'; }
  else { S.customPick=customPickFromQuestion(q); S.view='custom'; }
  render();
}
function applyUpdate(newQ, bucket, label){
  const {ri,qi,bankIdx}=S.editingQ;
  const old=S.draft.rounds[ri]&&S.draft.rounds[ri].questions[qi];
  if(old){ newQ.points=old.points; if(old.bet!=null) newQ.bet=old.bet; S.draft.rounds[ri].questions[qi]=newQ; }
  if(bankIdx>=0){ const b=loadBank(); if(b[bankIdx]){ b[bankIdx]={ bucket, label, q:JSON.parse(JSON.stringify(newQ)) }; saveBank(b); } }
  S.editingQ=null; S.err=''; S.view='edit';
  S.msg=bankIdx>=0?'Vraag bijgewerkt (ook in Mijn vragen).':'Vraag bijgewerkt.';
}
function updateCustom(){ const r=readCustomPick(S); if(r.error){ S.err=r.error; render(); return; }
  applyUpdate(r.q,'custom',r.label); S.customPick=null; render(); }
function updateMedia(){ const r=readMediaPick(S); if(r.error){ S.err=r.error; render(); return; }
  const isPz=r.kind==='puzzle';
  applyUpdate(r.q, isPz?'puzzels':r.isFilm?'films':'liedjes', r.label);
  S.filmPick=null; S.songPick=null; S.puzzlePick=null; render(); }
function toggleQBet(ri,qi){ syncEdit(); const q=S.draft&&S.draft.rounds[ri]&&S.draft.rounds[ri].questions[qi]; if(!q)return; q.bet=!betOf(q); render(); }
function toggleRoundBet(ri,on){ syncEdit(); const r=S.draft&&S.draft.rounds[ri]; if(!r)return; r.questions.forEach(q=>{ if(Array.isArray(q.stages)) q.bet=on; }); render(); }

/* maken → aan de gekozen ronde toevoegen (validatie + opbouw zit in editor-ui.js) */
function addCustom(){ const r=readCustomPick(S); if(r.error){ S.err=r.error; render(); return; } const round=targetRoundFor('cb','Eigen vragen',''); pushToDraft(round,'custom',r.label,r.q); S.customPick=null; S.err=''; S.view='edit'; S.targetRound=null; S.msg=`Vraag toegevoegd aan "${round.name}".`; render(); }
function addMedia(){ const r=readMediaPick(S); if(r.error){ S.err=r.error; render(); return; }
  const isPz=r.kind==='puzzle';
  const round=targetRoundFor('mb', isPz?'Wie of wat is dit?':r.isFilm?'Films':'Liedjes', isPz?'Raad de figuur. Bij elke hint zie je een stukje meer.':r.isFilm?'Raad de film.':'Raad het nummer aan het fragment.');
  pushToDraft(round, isPz?'puzzels':r.isFilm?'films':'liedjes', r.label, r.q);
  S.filmPick=null; S.songPick=null; S.puzzlePick=null;
  S.err=''; S.view='edit'; S.targetRound=null; S.msg=`${isPz?'Puzzel':r.isFilm?'Film':'Liedje'} toegevoegd aan "${round.name}".`; render(); }

/* ---------- HTML ---------- */
/* knoppenrij voor de kant-en-klare rondes (elke ronde opent zijn eigen kies-scherm). */
function libButtonsHTML(){
  const cat=S.catalog||[];
  if(S.busy && !cat.length) return `<p class="muted center m0 f12">Bibliotheek laden…</p>`;
  if(!cat.length) return `<p class="muted m0 f12">Geen kant-en-klare vragen gevonden.</p>`;
  return `<div class="row" style="gap:6px">${cat.map(rd=>{ const m=libMeta(rd);
    return `<button class="btn ghost" data-lib="${esc(rd.folder)}">${icon(m.icon,16)}${esc(m.label)}</button>`;
  }).join('')}</div>`;
}
/* kies-scherm voor één kant-en-klare ronde: vink de vragen aan die je wilt toevoegen. */
function libHTML(){
  const rd=(S.catalog||[]).find(r=>r.folder===S.libFolder);
  if(!rd) return `<div class="statusbar"><h1 class="h-md">Niet gevonden</h1></div>
    <div class="row"><button class="btn ghost grow" id="b-back">Terug</button></div>`;
  const m=libMeta(rd), keys=Object.keys(rd.items), on=libSelCount(rd.folder), all=keys.length>0&&on===keys.length;
  return `<div class="statusbar"><h1 class="h-md">${esc(m.label)}</h1><span class="muted f12">${on} gekozen</span></div>
    <div class="stack edscroll" id="ed-scroll" style="gap:10px">
      ${rd.intro?`<p class="muted m0 f12">${esc(rd.intro)}</p>`:''}
      <div class="card stack" style="gap:4px">
        <div class="statusbar"><label class="picklabel"><input type="checkbox" data-round="${esc(rd.folder)}" ${all?'checked':''}><b>Alles</b></label><span class="muted f12">${on}/${keys.length}</span></div>
        ${keys.map(k=>`<label class="picklabel"><input type="checkbox" data-folder="${esc(rd.folder)}" data-key="${esc(k)}" ${(S.sel[rd.folder]&&S.sel[rd.folder][k])?'checked':''}><span>${esc(itemLabel(rd,rd.items[k])||k)}</span></label>`).join('')}
      </div>
      <div class="card stack" style="gap:6px">${roundPickerHTML('lib', rd.name)}</div>
    </div>
    <div class="row"><button class="btn grow" id="b-apply" ${on&&!S.busy?'':'disabled'}>Toevoegen${on?` (${on})`:''}</button><button class="btn ghost" id="b-back">Terug</button></div>`;
}
function editHTML(){
  const d=S.draft||{name:'',rounds:[]};
  const rounds = d.rounds.length ? d.rounds.map((rd,ri)=>{
    const staged=rd.questions.filter(q=>Array.isArray(q.stages)), betN=staged.filter(betOf).length;
    const allBet=staged.length>0&&betN===staged.length, someBet=betN>0&&!allBet;
    const roundBet = staged.length ? `<label class="betlbl" title="Inzetten aan/uit voor alle hint-vragen in deze ronde"><input type="checkbox" class="r-bet" data-ri="${ri}" data-some="${someBet?1:0}" ${allBet?'checked':''}>inzet</label>` : '';
    return `
    <div class="card stack" data-idx="${ri}" style="gap:6px;padding:12px">
      <div class="row" style="gap:6px;align-items:center;flex-wrap:nowrap">
        <span class="grip" title="Sleep om de ronde te verplaatsen">${ICON_GRIP}</span>
        <input class="sinput r-name" data-ri="${ri}" value="${esc(rd.name)}" placeholder="Rondenaam">
        ${roundBet}
        <span class="muted f12 nowrap">${rd.questions.length} ${rd.questions.length===1?'vraag':'vragen'}</span>
      </div>
      <textarea class="r-intro" data-ri="${ri}" rows="2" placeholder="Uitleg voor de spelers (zien ze bij ‘Ik snap het’ aan het begin van de ronde)">${esc(rd.intro||'')}</textarea>
      <div class="stack qlist" data-round="${ri}" style="gap:6px">
      ${rd.questions.map((q,qi)=>`<div class="listrow tight" data-idx="${qi}">
        <span class="grip" title="Sleep om de vraag te verplaatsen">${ICON_GRIP}</span>
        <span class="ellip f14">${rowText(q)}</span>
        <span class="ptsfield" title="Punten voor deze vraag (standaard 100)"><input type="number" min="0" step="10" class="q-pts" data-ri="${ri}" data-qi="${qi}" value="${q.points??100}">pt</span>
        ${Array.isArray(q.stages)?`<label class="betlbl" title="Inzetten toestaan op deze vraag"><input type="checkbox" data-qbet="${ri}|${qi}" ${betOf(q)?'checked':''}>inzet</label>`:''}
        <button class="mini" data-qreveal="${ri}|${qi}" title="voorvertoning — volledige vraag met alle hints" aria-label="voorvertoning">${icon('eye',15)}</button>
        <button class="mini" data-qsim="${ri}|${qi}" title="simuleren — speel de vraag na" aria-label="simuleren">${icon('play',15)}</button>
        <button class="mini" data-qedit="${ri}|${qi}" title="wijzigen" aria-label="wijzigen">${icon('pencil',15)}</button>
        <button class="mini danger" data-qdel="${ri}|${qi}" title="verwijderen" aria-label="verwijderen">${ICON_TRASH}</button></div>`).join('')}
      </div>
      <button class="btn ghost" data-addtoround="${ri}" style="align-self:flex-start">${icon('plus',14)}Vraag toevoegen</button>
    </div>`;
  }).join('') : `<p class="muted m0">Nog geen vragen. Klik “+ Vraag toevoegen”.</p>`;
  return `<div class="statusbar"><h1 class="h-md">${S.editingName?'Quiz wijzigen':'Nieuwe quiz'}</h1></div>
    <input id="q-name" class="sinput f18" placeholder="Naam van je quiz" value="${esc(d.name||'')}">
    <div class="stack edscroll" id="ed-scroll" style="gap:10px">${rounds}</div>
    <button class="btn ghost" id="b-goadd">${icon('plus',16)}Vraag toevoegen</button>`;
}
function addHTML(){
  const bankN=bankSelCount(), bank=loadBank();
  const bankHTML = bank.length ? `<div class="card stack" style="gap:4px"><div class="statusbar"><b>Mijn opgeslagen vragen</b><span class="muted f12">${bankN} gekozen</span></div>
    ${bank.map((it,i)=>`<label class="picklabel"><input type="checkbox" data-bank="${i}" ${S.bankSel[i]?'checked':''}><span class="ellip f14">${rowText(it.q)}</span></label>`).join('')}
    ${bankN?`<div class="stack" style="gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)">${roundPickerHTML('bank','Eigen vragen')}</div>`:''}</div>` : '';
  return `<div class="statusbar"><h1 class="h-md">Vraag toevoegen</h1></div>
    <div class="stack edscroll" id="ed-scroll" style="gap:10px">
      <div class="statusbar"><b>Kant-en-klare vragen</b></div>
      ${libButtonsHTML()}
      ${bankHTML}
      <div class="statusbar" style="margin-top:4px"><b>Nieuw maken</b></div>
      <div class="row" style="gap:6px"><button class="btn ghost" id="b-custom">${icon('plus',16)}Custom</button><button class="btn ghost" id="b-film">${icon('film',16)}Film</button><button class="btn ghost" id="b-song">${icon('music',16)}Liedje</button><button class="btn ghost" id="b-puzzle">${icon('eye',16)}Puzzel</button></div>
    </div>
    <div class="row"><button class="btn grow" id="b-apply" ${bankN&&!S.busy?'':'disabled'}>Toevoegen${bankN?` (${bankN})`:''}</button><button class="btn ghost" id="b-back">Terug</button></div>`;
}
function render(){
  const builder = (S.view==='film'&&S.filmPick) || (S.view==='song'&&S.songPick) || (S.view==='puzzle'&&S.puzzlePick);   // brede twee-koloms-bouwer
  const w=document.querySelector('.wrap'); if(w) w.classList.toggle('builderwide', !!builder);
  const inner =
    S.view==='add'  ? addHTML() :
    S.view==='lib'  ? libHTML() :
    S.view==='custom' ? customFormHTML(S, S.editingQ ? { addLabel:'Bijwerken', backId:'b-formback' } : { addLabel:'Toevoegen aan quiz', backId:'b-formback', roundPickerHTML:roundPickerHTML('cb','Eigen vragen') }) :
    S.view==='film' ? filmFormHTML(S, S.editingQ ? { addLabel:'Bijwerken', backId:'b-formback' } : { addLabel:'Toevoegen aan quiz', backId:'b-formback', roundPickerHTML:roundPickerHTML('mb','Films') }) :
    S.view==='song' ? songFormHTML(S, S.editingQ ? { addLabel:'Bijwerken', backId:'b-formback' } : { addLabel:'Toevoegen aan quiz', backId:'b-formback', roundPickerHTML:roundPickerHTML('mb','Liedjes') }) :
    S.view==='puzzle' ? puzzleFormHTML(S, S.editingQ ? { addLabel:'Bijwerken', backId:'b-formback' } : { addLabel:'Toevoegen aan quiz', backId:'b-formback', roundPickerHTML:roundPickerHTML('mb','Wie of wat is dit?') }) :
                      editHTML();
  el.innerHTML = `${inner}
    ${S.err?`<p class="err feedback">${esc(S.err)}</p>`:''}
    ${S.msg?`<p class="muted feedback txt-ok">${esc(S.msg)}</p>`:''}
    ${S.busy?`<p class="muted center feedback">Bezig…</p>`:''}`;
  wire();
}
function wire(){
  wireScroll($, S);
  const v=S.view;
  if(v==='edit'){
    enableDragSort($('#ed-scroll'), { handle:'.grip', onDrop:reorderRounds });
    el.querySelectorAll('.qlist').forEach(ql=> enableDragSort(ql, { handle:'.grip', onDrop:order=>reorderQ(+ql.dataset.round, order) }));
    el.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{ syncEdit(); const a=b.dataset.qdel.split('|'); delQ(+a[0],+a[1]); });
    el.querySelectorAll('[data-qreveal]').forEach(b=>b.onclick=()=>{ syncEdit(); const a=b.dataset.qreveal.split('|'); const q=S.draft&&S.draft.rounds[+a[0]]&&S.draft.rounds[+a[0]].questions[+a[1]]; if(q) openQuestionReveal(q, '../../../'); });
    el.querySelectorAll('[data-qsim]').forEach(b=>b.onclick=()=>{ syncEdit(); const a=b.dataset.qsim.split('|'); const q=S.draft&&S.draft.rounds[+a[0]]&&S.draft.rounds[+a[0]].questions[+a[1]]; if(q) openQuestionSimulate(q, '../../../'); });
    el.querySelectorAll('[data-qedit]').forEach(b=>b.onclick=()=>{ const a=b.dataset.qedit.split('|'); editQ(+a[0],+a[1]); });
    el.querySelectorAll('[data-qbet]').forEach(cb=>cb.onchange=()=>{ const a=cb.dataset.qbet.split('|'); toggleQBet(+a[0],+a[1]); });
    el.querySelectorAll('.r-bet').forEach(cb=>{ cb.indeterminate = cb.dataset.some==='1'; cb.onchange=()=>toggleRoundBet(+cb.dataset.ri, cb.checked); });
    const ga=$('#b-goadd'); if(ga)ga.onclick=()=>gotoAdd();
    el.querySelectorAll('[data-addtoround]').forEach(b=>b.onclick=()=>{ syncEdit(); gotoAdd(+b.dataset.addtoround); });
    return;
  }
  if(v==='add'){
    el.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{ S.libFolder=b.dataset.lib; S.sel={}; S.view='lib'; S.err=''; S.msg=''; render(); });
    el.querySelectorAll('[data-bank]').forEach(cb=>cb.onchange=()=>toggleBank(+cb.dataset.bank));
    const go=v2=>()=>{ S.view=v2; S.err=''; S.msg=''; render(); };
    const cu=$('#b-custom'); if(cu)cu.onclick=()=>{ S.customPick=null; go('custom')(); };
    const f=$('#b-film'); if(f)f.onclick=go('film');
    const sg=$('#b-song'); if(sg)sg.onclick=go('song');
    const pz=$('#b-puzzle'); if(pz)pz.onclick=()=>{ S.puzzlePick=null; pactions.loadPuzzleCatalog(); go('puzzle')(); };
    const ap=$('#b-apply'); if(ap)ap.onclick=addSelections;
    const bk=$('#b-back'); if(bk)bk.onclick=()=>{ S.view='edit'; S.targetRound=null; S.err=''; S.msg=''; render(); };
    wireRoundPicker('bank');
    return;
  }
  if(v==='lib'){
    el.querySelectorAll('[data-key]').forEach(cb=>cb.onchange=()=>toggleItem(cb.dataset.folder,cb.dataset.key));
    el.querySelectorAll('[data-round]').forEach(cb=>cb.onchange=()=>toggleRound(cb.dataset.round));
    const ap=$('#b-apply'); if(ap)ap.onclick=addSelections;
    const bk=$('#b-back'); if(bk)bk.onclick=()=>{ S.sel={}; S.view='add'; S.err=''; S.msg=''; render(); };
    wireRoundPicker('lib');
    return;
  }
  if(v==='custom'){
    const eq=S.editingQ;
    wireCustomForm(el, S, render, {
      onAdd:eq ? updateCustom : addCustom,
      onBack:()=>{ S.customPick=null; S.editingQ=null; S.view=eq?'edit':'add'; S.err=''; render(); },
      backId:'b-formback',
      afterBuilderWire:eq ? undefined : ()=>wireRoundPicker('cb'),
    });
    return;
  }
  if(v==='film' || v==='song'){
    const eq=S.editingQ;
    wireMediaForms(el, S, render, actions, {
      onAdd:eq ? updateMedia : addMedia,
      onBack:()=>{ S.filmPick=null; S.songPick=null; S.editingQ=null; S.view=eq?'edit':'add'; S.err=''; render(); },
      backId:'b-formback',
      afterBuilderWire:eq ? undefined : ()=>wireRoundPicker('mb'),
    });
    return;
  }
  if(v==='puzzle'){
    const eq=S.editingQ;
    wirePuzzleForms(el, S, render, pactions, {
      onAdd:eq ? updateMedia : addMedia,
      onBack:()=>{ S.puzzlePick=null; S.editingQ=null; S.view=eq?'edit':'add'; S.err=''; render(); },
      backId:'b-formback',
      afterBuilderWire:eq ? undefined : ()=>wireRoundPicker('mb'),
    });
    return;
  }
}

document.getElementById('chrome').innerHTML = editorTopbarHTML({ saveLabel:'Opslaan' });
$('#b-topback').onclick = toList;
$('#b-save').onclick = saveDraft;
boot();
</script>
</body>
</html>
