<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mijn quizzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="tb-round" href="index.html" style="text-decoration:none">← Spel</a>
    <span class="tb-actions"><a class="btn ghost" href="questions.html" style="font-size:13px;padding:8px 12px;text-decoration:none">Mijn losse vragen</a></span>
  </div>
  <main id="app" class="screen" aria-live="polite"></main>
</div>

<script type="module">
import * as core from './lib/quiz-core.js';
const { esc, qLabel, qTypeLabel, itemLabel, loadCatalog, buildQuestion, tmdbSearch, movieCast,
        loadSavedQuizzes, saveQuizToDevice, deleteSavedQuiz, loadBank, addToBank,
        flattenQuiz, exportQuizJSON, setActiveQuiz } = core;

const el = document.getElementById('app');
const $ = s => document.querySelector(s);
const S = {
  view:'list', catalog:null, busy:false, err:'', msg:'', scroll:0,
  draft:null, editingName:null, sel:{}, bankSel:{},
  mcDraft:null, openDraft:null,
  filmQuery:'', filmResults:[], filmBusy:false, filmPick:null,
};

/* ---------- helpers ---------- */
function syncName(){ const e=$('#q-name'); if(e && S.draft) S.draft.name=e.value; }
function ensureRound(d, name, intro){ let r=d.rounds.find(x=>x.name===name); if(!r){ r={name,intro:intro||'',questions:[]}; d.rounds.push(r); } return r; }
function selCount(){ return Object.keys(S.sel).reduce((n,f)=> n+Object.keys(S.sel[f]||{}).filter(k=>S.sel[f][k]).length, 0); }
function bankSelCount(){ return Object.keys(S.bankSel).filter(k=>S.bankSel[k]).length; }
function qCount(d){ return ((d&&d.rounds)||[]).reduce((n,r)=>n+(r.questions?r.questions.length:0),0); }
function pushToDraft(bucket, label, q){
  ensureRound(S.draft, bucket==='films'?'Films':'Eigen vragen', bucket==='films'?'Raad de film aan de acteurs.':'').questions.push(q);
  addToBank({ bucket, label, q: JSON.parse(JSON.stringify(q)) });
}
function applyMediaToQ(q, url, type){ url=(url||'').trim(); if(!url) return; if(type==='video') q.video=url; else if(type==='audio') q.audio=url; else q.image=url; }

/* ---------- navigatie / acties ---------- */
async function boot(){
  S.busy=true; render();
  try{ if(!S.catalog) S.catalog = await loadCatalog(); }catch(e){ S.err='Bibliotheek laden mislukt: '+e.message; }
  S.busy=false; render();
}
function newDraft(){ S.draft={name:'',rounds:[]}; S.editingName=null; S.view='edit'; S.err=''; S.msg=''; S.scroll=0; render(); }
function editDraft(name){
  const q=loadSavedQuizzes()[name]; if(!q){ S.err='Quiz niet gevonden.'; render(); return; }
  const f=flattenQuiz(q);
  S.draft={ name:q.name||name, rounds: f.rounds.map(rr=>({ name:rr.name||'Ronde', intro:rr.intro||'', questions: f.questions.slice(rr.start,rr.end).map(x=>JSON.parse(JSON.stringify(x))) })) };
  S.editingName=name; S.view='edit'; S.err=''; S.msg=''; S.scroll=0; render();
}
function delQuiz(name){ if(confirm(`Quiz "${name}" verwijderen?`)){ deleteSavedQuiz(name); render(); } }
function exportSaved(name){ const q=loadSavedQuizzes()[name]; if(q){ exportQuizJSON(name, q); S.msg=`"${name}" geëxporteerd.`; render(); } }
function useQuiz(name){ const q=loadSavedQuizzes()[name]; if(!q){ S.err='Quiz niet gevonden.'; render(); return; } setActiveQuiz(name, q); location.href='index.html'; }
function saveDraft(){
  syncName(); const d=S.draft; if(!d) return;
  const nm=(d.name||'').trim();
  if(!nm){ S.err='Geef je quiz een naam.'; render(); return; }
  d.rounds=(d.rounds||[]).filter(r=>r.questions&&r.questions.length);
  if(!qCount(d)){ S.err='Voeg minstens één vraag toe.'; render(); return; }
  d.name=nm;
  if(S.editingName && S.editingName!==nm) deleteSavedQuiz(S.editingName);
  if(!saveQuizToDevice(nm, JSON.parse(JSON.stringify(d)))){ S.err='Opslaan mislukt (opslag vol?).'; render(); return; }
  S.editingName=null; S.draft=null; S.view='list'; S.err=''; S.msg=`Opgeslagen: "${nm}".`; render();
}
function gotoAdd(){ syncName(); S.sel={}; S.bankSel={}; S.view='add'; S.err=''; S.msg=''; render(); }
function toggleItem(f,k){ if(!S.sel[f])S.sel[f]={}; S.sel[f][k]=!S.sel[f][k]; render(); }
function toggleRound(f){ const rd=(S.catalog||[]).find(r=>r.folder===f); if(!rd)return; const keys=Object.keys(rd.items); const sel=S.sel[f]||(S.sel[f]={}); const all=keys.every(k=>sel[k]); keys.forEach(k=>sel[k]=!all); render(); }
function toggleBank(i){ S.bankSel[i]=!S.bankSel[i]; render(); }
async function addSelections(){
  if(!S.draft) return;
  S.busy=true; render(); let added=0;
  try{
    for(const rd of (S.catalog||[])){
      const picked=Object.keys(rd.items).filter(k=> S.sel[rd.folder]&&S.sel[rd.folder][k]);
      if(!picked.length) continue;
      const round=ensureRound(S.draft, rd.name, rd.intro);
      for(const k of picked){ round.questions.push(await buildQuestion(rd,k,rd.items[k])); added++; }
    }
    const bank=loadBank();
    Object.keys(S.bankSel).forEach(i=>{ if(S.bankSel[i]&&bank[+i]){ const it=bank[+i]; ensureRound(S.draft, it.bucket==='films'?'Films':'Eigen vragen', it.bucket==='films'?'Raad de film aan de acteurs.':'').questions.push(JSON.parse(JSON.stringify(it.q))); added++; } });
  }catch(e){ S.err='Toevoegen mislukt: '+e.message; }
  S.sel={}; S.bankSel={}; S.busy=false; S.view='edit'; S.msg=added?`${added} vraag/vragen toegevoegd.`:''; render();
}
function moveRound(i,dir){ const d=S.draft; const j=i+dir; if(!d||j<0||j>=d.rounds.length)return; [d.rounds[i],d.rounds[j]]=[d.rounds[j],d.rounds[i]]; render(); }
function moveQ(ri,qi,dir){ const r=S.draft&&S.draft.rounds[ri]; if(!r)return; const j=qi+dir; if(j<0||j>=r.questions.length)return; [r.questions[qi],r.questions[j]]=[r.questions[j],r.questions[qi]]; render(); }
function delQ(ri,qi){ const d=S.draft, r=d&&d.rounds[ri]; if(!r)return; r.questions.splice(qi,1); if(!r.questions.length) d.rounds.splice(ri,1); render(); }

/* meerkeuze */
function readMc(){ const d=S.mcDraft||(S.mcDraft={}); const g=id=>{const e=$('#'+id);return e?e.value:undefined;}; if($('#mc-q')!=null){ d.question=g('mc-q'); d.media=g('mc-media'); d.mediaType=g('mc-mtype'); d.correct=g('mc-correct'); d.distractors=[0,1,2,3,4].map(i=>g('mc-d'+i)).map(x=>x==null?'':x);} return d; }
function addMc(){
  const d=readMc(); const correct=(d.correct||'').trim(); const dist=(d.distractors||[]).map(x=>(x||'').trim()).filter(Boolean);
  if(!correct){ S.err='Vul het juiste antwoord in.'; render(); return; }
  if(!dist.length){ S.err='Vul minstens één foute optie in (of gebruik "Open vraag").'; render(); return; }
  const q={ question:(d.question||'').trim(), options:[correct,...dist], answer:0, shuffle:true };
  applyMediaToQ(q, d.media, d.mediaType);
  if(!q.question && !q.image && !q.video && !q.audio){ S.err='Geef een vraag of een medialink op.'; render(); return; }
  pushToDraft('eigen', (q.question||correct), q); S.mcDraft=null; S.err=''; S.view='edit'; S.msg='Vraag toegevoegd.'; render();
}
/* open */
function readOpen(){ const d=S.openDraft||(S.openDraft={}); const g=id=>{const e=$('#'+id);return e?e.value:undefined;}; if($('#op-q')!=null){ d.question=g('op-q'); d.media=g('op-media'); d.mediaType=g('op-mtype'); d.answer=g('op-ans'); d.accept=g('op-accept'); } return d; }
function addOpen(){
  const d=readOpen(); const ans=(d.answer||'').trim();
  if(!ans){ S.err='Vul het juiste antwoord in.'; render(); return; }
  const accept=(d.accept||'').split(',').map(x=>x.trim()).filter(Boolean);
  const q={ question:(d.question||'').trim(), options:':text', answer:ans, accept };
  applyMediaToQ(q, d.media, d.mediaType);
  if(!q.question && !q.image && !q.video && !q.audio){ S.err='Geef een vraag of een medialink op.'; render(); return; }
  pushToDraft('eigen', (q.question||ans), q); S.openDraft=null; S.err=''; S.view='edit'; S.msg='Vraag toegevoegd.'; render();
}
/* film */
async function filmSearch(){ const e=$('#film-q'); const q=e?e.value.trim():''; S.filmQuery=q; if(!q){ S.filmResults=[]; render(); return; } S.filmBusy=true; render(); try{ S.filmResults=await tmdbSearch(q); }catch(err){ S.filmResults=[]; S.err='Zoeken mislukt: '+err.message; } S.filmBusy=false; render(); }
async function filmPick(id,label){ S.filmBusy=true; S.filmResults=[]; S.filmQuery=''; render(); const cast=await movieCast(id,5); S.filmPick={ tmdbId:id, label, cast: cast.map(c=>({...c, checked:true})) }; S.filmBusy=false; render(); }
function filmToggle(i){ const p=S.filmPick; if(!p)return; p.cast[i].checked=!p.cast[i].checked; render(); }
function filmMove(i,dir){ const p=S.filmPick; if(!p)return; const j=i+dir; if(j<0||j>=p.cast.length)return; [p.cast[i],p.cast[j]]=[p.cast[j],p.cast[i]]; render(); }
function addFilm(){
  const p=S.filmPick; if(!p){ S.err='Kies eerst een film.'; render(); return; }
  const sel=p.cast.filter(c=>c.checked);
  if(sel.length<2){ S.err='Kies minstens 2 acteurs.'; render(); return; }
  const mults=core.defaultBetMults(sel.length);
  const q={ question:'In welke film spelen deze acteurs?', options:':tmdb', answer:Number(p.tmdbId)||p.tmdbId, answerLabel:p.label, points:100, stages: sel.map((c,i)=>({ image:c.img, betMultiplier:mults[i] })) };
  pushToDraft('films', p.label, q); S.filmPick=null; S.err=''; S.view='edit'; S.msg='Film toegevoegd.'; render();
}

/* ---------- HTML ---------- */
function mediaRowHTML(pfx,d){ d=d||{}; return `<input id="${pfx}-media" class="sinput" placeholder="Medialink (optioneel): https://…" value="${esc(d.media||'')}">
  <select id="${pfx}-mtype" class="sinput">${['image','video','audio'].map(t=>`<option value="${t}" ${d.mediaType===t?'selected':''}>${t==='image'?'afbeelding':t==='video'?'video':'audio'}</option>`).join('')}</select>`; }
function libraryHTML(){
  const cat=S.catalog||[];
  if(S.busy && !cat.length) return `<p class="muted center" style="margin:0">Bibliotheek laden…</p>`;
  if(!cat.length) return `<p class="muted" style="margin:0;font-size:12px">Geen bibliotheek gevonden.</p>`;
  return cat.map(rd=>{
    const keys=Object.keys(rd.items), on=keys.filter(k=>S.sel[rd.folder]&&S.sel[rd.folder][k]).length, all=keys.length>0&&on===keys.length;
    const modeLbl=rd.mode===':deezer'?'Deezer':rd.mode===':tmdb'?'TMDB':rd.mode===':text'?'tekst':rd.mode==='listsearch'?'lijst':rd.mode;
    return `<div class="card stack" style="gap:4px">
      <div class="statusbar"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-round="${esc(rd.folder)}" ${all?'checked':''}><b>${esc(rd.name)}</b></label><span class="muted" style="font-size:12px">${on}/${keys.length}${rd.betting?' · inzet':''} · ${esc(modeLbl)}</span></div>
      ${keys.map(k=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 2px"><input type="checkbox" data-folder="${esc(rd.folder)}" data-key="${esc(k)}" ${(S.sel[rd.folder]&&S.sel[rd.folder][k])?'checked':''}><span>${esc(itemLabel(rd,rd.items[k])||k)}</span></label>`).join('')}
    </div>`;
  }).join('');
}
function listHTML(){
  const saved=loadSavedQuizzes(), names=Object.keys(saved), bankN=loadBank().length;
  const rows = names.length ? names.map(n=>{ let c='?'; try{ c=flattenQuiz(saved[n]).questions.length; }catch(e){}
    return `<div class="card stack" style="gap:8px;padding:14px">
      <div class="statusbar"><b style="font-size:16px">${esc(n)}</b><span class="muted" style="font-size:12px">${c} vragen</span></div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn grow" data-use="${esc(n)}" style="font-size:14px;padding:11px 12px">▶ Gebruik in spel</button>
        <button class="btn ghost" data-edit="${esc(n)}" style="font-size:14px;padding:11px 12px">Wijzig</button>
        <button class="btn ghost" data-export="${esc(n)}" style="font-size:14px;padding:11px 12px">Export</button>
        <button class="mini danger" data-del="${esc(n)}" title="verwijderen">🗑</button>
      </div></div>`; }).join('')
    : `<p class="muted" style="margin:0">Nog geen quizzen. Maak er een met “+ Nieuwe quiz”.</p>`;
  return `<div class="center stack" style="gap:2px;margin-bottom:6px"><h1 style="font-size:clamp(28px,7vw,44px)">Jouw quizzen</h1><p class="muted" style="margin:0">Op dit apparaat opgeslagen.</p></div>
    <button class="btn big" id="b-new">+ Nieuwe quiz</button>
    <div class="stack" id="ed-scroll" style="gap:10px">${rows}</div>
    ${bankN?`<p class="muted center" style="font-size:12px">Je hebt ${bankN} losse vraag/vragen in je <a href="questions.html">vragenbank</a>.</p>`:''}`;
}
function editHTML(){
  const d=S.draft||{name:'',rounds:[]};
  const rounds = d.rounds.length ? d.rounds.map((rd,ri)=>`
    <div class="card stack" style="gap:6px;padding:12px">
      <div class="statusbar"><b style="font-size:15px">${esc(rd.name)} <span class="muted" style="font-weight:400;font-size:12px">· ${rd.questions.length}</span></b>
        <span style="display:flex;gap:4px"><button class="mini" data-rmove="${ri}|-1" ${ri===0?'disabled':''}>▲</button><button class="mini" data-rmove="${ri}|1" ${ri===d.rounds.length-1?'disabled':''}>▼</button></span></div>
      ${rd.questions.map((q,qi)=>`<div class="row" style="gap:6px;align-items:center;background:var(--surface-2);border-radius:10px;padding:7px 9px">
        <span style="flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(qLabel(q))} <span class="muted" style="font-size:11px">· ${qTypeLabel(q)}</span></span>
        <button class="mini" data-qmove="${ri}|${qi}|-1" ${qi===0?'disabled':''}>▲</button>
        <button class="mini" data-qmove="${ri}|${qi}|1" ${qi===rd.questions.length-1?'disabled':''}>▼</button>
        <button class="mini danger" data-qdel="${ri}|${qi}">🗑</button></div>`).join('')}
    </div>`).join('') : `<p class="muted" style="margin:0">Nog geen vragen. Klik “+ Vraag toevoegen”.</p>`;
  return `<div class="statusbar"><h1 style="font-size:clamp(22px,5vw,32px)">${S.editingName?'Quiz wijzigen':'Nieuwe quiz'}</h1></div>
    <input id="q-name" class="sinput" placeholder="Naam van je quiz" value="${esc(d.name||'')}" style="font-size:18px">
    <div class="stack" id="ed-scroll" style="gap:10px">${rounds}</div>
    <button class="btn ghost" id="b-goadd">+ Vraag toevoegen</button>
    <div class="row"><button class="btn grow big" id="b-save">Opslaan</button><button class="btn ghost" id="b-cancel">Annuleer</button></div>`;
}
function addHTML(){
  const libN=selCount(), bankN=bankSelCount(), bank=loadBank();
  const bankHTML = bank.length ? `<div class="card stack" style="gap:4px"><div class="statusbar"><b>Mijn opgeslagen vragen</b><span class="muted" style="font-size:12px">${bankN} gekozen</span></div>
    ${bank.map((it,i)=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 2px"><input type="checkbox" data-bank="${i}" ${S.bankSel[i]?'checked':''}><span style="font-size:14px">${esc(it.label||qLabel(it.q))} <span class="muted" style="font-size:11px">· ${it.bucket==='films'?'film':'eigen'}</span></span></label>`).join('')}</div>` : '';
  return `<div class="statusbar"><h1 style="font-size:clamp(22px,5vw,32px)">Vraag toevoegen</h1></div>
    <div class="stack" id="ed-scroll" style="gap:10px">
      <div class="statusbar"><b>Kant-en-klare rondes</b><span class="muted" style="font-size:12px">${libN} gekozen</span></div>
      ${libraryHTML()}
      ${bankHTML}
      <div class="statusbar" style="margin-top:4px"><b>Nieuw maken</b></div>
      <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn ghost" id="b-mc">+ Meerkeuze</button><button class="btn ghost" id="b-open">+ Open vraag</button><button class="btn ghost" id="b-film">+ Film (acteurs)</button></div>
    </div>
    <div class="row"><button class="btn grow" id="b-apply" ${(libN||bankN)&&!S.busy?'':'disabled'}>Toevoegen${(libN+bankN)?` (${libN+bankN})`:''}</button><button class="btn ghost" id="b-back">Terug</button></div>`;
}
function mcFormHTML(){ const d=S.mcDraft||{}; return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Meerkeuzevraag</h1></div>
  <div class="stack" id="ed-scroll" style="gap:8px">
    <input id="mc-q" class="sinput" placeholder="De vraag (mag leeg bij alleen een medialink)" value="${esc(d.question||'')}">
    ${mediaRowHTML('mc',d)}
    <label class="lbl">Juiste antwoord</label><input id="mc-correct" class="sinput" placeholder="Het juiste antwoord" value="${esc(d.correct||'')}">
    <label class="lbl">Foute opties (minstens 1)</label>
    ${[0,1,2,3,4].map(i=>`<input id="mc-d${i}" class="sinput" placeholder="Foute optie ${i+1}" value="${esc((d.distractors&&d.distractors[i])||'')}">`).join('')}
    <p class="muted" style="font-size:12px;margin:0">De volgorde wordt willekeurig in de quiz.</p>
  </div>
  <div class="row"><button class="btn grow" id="b-mc-add">Toevoegen</button><button class="btn ghost" id="b-formback">Terug</button></div>`; }
function openFormHTML(){ const d=S.openDraft||{}; return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Open vraag</h1></div>
  <div class="stack" id="ed-scroll" style="gap:8px">
    <input id="op-q" class="sinput" placeholder="De vraag (mag leeg bij alleen een medialink)" value="${esc(d.question||'')}">
    ${mediaRowHTML('op',d)}
    <label class="lbl">Juiste antwoord</label><input id="op-ans" class="sinput" placeholder="Het juiste antwoord" value="${esc(d.answer||'')}">
    <label class="lbl">Ook goed (komma-gescheiden, optioneel)</label><input id="op-accept" class="sinput" placeholder="bv. variant 1, variant 2" value="${esc(d.accept||'')}">
    <p class="muted" style="font-size:12px;margin:0">Open antwoorden beoordeel je als host handmatig.</p>
  </div>
  <div class="row"><button class="btn grow" id="b-op-add">Toevoegen</button><button class="btn ghost" id="b-formback">Terug</button></div>`; }
function filmFormHTML(){
  if(S.filmPick){ const p=S.filmPick;
    const cast=p.cast.map((c,i)=>`<div class="row" style="gap:8px;align-items:center;padding:3px 0"><input type="checkbox" data-actor="${i}" ${c.checked?'checked':''}><img src="${esc(c.img)}" alt="" style="width:38px;height:38px;border-radius:8px;object-fit:cover"><span style="flex:1;font-size:14px">${esc(c.name)}</span><button class="mini" data-amove="${i}|-1">▲</button><button class="mini" data-amove="${i}|1">▼</button></div>`).join('');
    return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Film: ${esc(p.label)}</h1></div>
      <p class="muted" style="font-size:13px;margin:0">Vink acteurs aan en zet ze in onthul-volgorde (bovenaan = eerst).</p>
      <div class="stack" id="ed-scroll" style="gap:2px">${cast || '<p class="muted">Geen acteurfoto’s gevonden (Worker gedeployd?).</p>'}</div>
      <div class="row"><button class="btn grow" id="b-film-add">Toevoegen aan quiz</button><button class="btn ghost" id="b-film-reset">Andere film</button></div>`;
  }
  const res=S.filmResults||[];
  return `<div class="statusbar"><h1 style="font-size:clamp(20px,5vw,28px)">Film (acteurs raden)</h1></div>
    <div class="row" style="gap:6px"><input id="film-q" class="sinput" placeholder="Zoek een film…" value="${esc(S.filmQuery||'')}" style="flex:1"><button class="btn" id="b-film-search">Zoek</button></div>
    ${S.filmBusy?'<p class="muted center" style="margin:0">Bezig…</p>':''}
    <div class="stack" id="ed-scroll" style="gap:4px">${res.map(m=>`<button class="btn ghost" data-film="${esc(m.id)}|${esc(m.label)}" style="justify-content:flex-start;font-size:14px">${m.thumb?`<img src="${esc(m.thumb)}" style="width:28px;height:40px;object-fit:cover;border-radius:4px;margin-right:8px">`:''}${esc(m.label)}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="b-formback">Terug</button></div>`;
}
function render(){
  const v=S.view;
  const inner = v==='edit'?editHTML() : v==='add'?addHTML() : v==='mc'?mcFormHTML() : v==='open'?openFormHTML() : v==='film'?filmFormHTML() : listHTML();
  el.innerHTML = `${inner}
    ${S.err?`<p class="err" style="margin:4px 0 0">${esc(S.err)}</p>`:''}
    ${S.msg?`<p class="muted" style="margin:4px 0 0;color:var(--groen)">${esc(S.msg)}</p>`:''}
    ${S.busy?`<p class="muted center" style="margin:4px 0 0">Bezig…</p>`:''}`;
  wire();
}
function wire(){
  const sc=$('#ed-scroll'); if(sc){ sc.style.overflow='auto'; sc.style.maxHeight='52vh'; sc.scrollTop=S.scroll||0; sc.onscroll=()=>{ S.scroll=sc.scrollTop; }; }
  const v=S.view;
  if(v==='list'){
    el.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>useQuiz(b.dataset.use));
    el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editDraft(b.dataset.edit));
    el.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportSaved(b.dataset.export));
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delQuiz(b.dataset.del));
    const n=$('#b-new'); if(n)n.onclick=newDraft;
    return;
  }
  if(v==='edit'){
    el.querySelectorAll('[data-rmove]').forEach(b=>b.onclick=()=>{ syncName(); const a=b.dataset.rmove.split('|'); moveRound(+a[0],+a[1]); });
    el.querySelectorAll('[data-qmove]').forEach(b=>b.onclick=()=>{ syncName(); const a=b.dataset.qmove.split('|'); moveQ(+a[0],+a[1],+a[2]); });
    el.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{ syncName(); const a=b.dataset.qdel.split('|'); delQ(+a[0],+a[1]); });
    const ga=$('#b-goadd'); if(ga)ga.onclick=gotoAdd;
    const sv=$('#b-save'); if(sv)sv.onclick=saveDraft;
    const cn=$('#b-cancel'); if(cn)cn.onclick=()=>{ S.draft=null; S.editingName=null; S.view='list'; S.err=''; S.msg=''; render(); };
    return;
  }
  if(v==='add'){
    el.querySelectorAll('[data-key]').forEach(cb=>cb.onchange=()=>toggleItem(cb.dataset.folder,cb.dataset.key));
    el.querySelectorAll('[data-round]').forEach(cb=>cb.onchange=()=>toggleRound(cb.dataset.round));
    el.querySelectorAll('[data-bank]').forEach(cb=>cb.onchange=()=>toggleBank(+cb.dataset.bank));
    const go=v2=>()=>{ S.view=v2; S.err=''; S.msg=''; render(); };
    const m=$('#b-mc'); if(m)m.onclick=go('mc');
    const o=$('#b-open'); if(o)o.onclick=go('open');
    const f=$('#b-film'); if(f)f.onclick=go('film');
    const ap=$('#b-apply'); if(ap)ap.onclick=addSelections;
    const bk=$('#b-back'); if(bk)bk.onclick=()=>{ S.view='edit'; S.err=''; S.msg=''; render(); };
    return;
  }
  if(v==='mc'){ const a=$('#b-mc-add'); if(a)a.onclick=addMc; const b=$('#b-formback'); if(b)b.onclick=()=>{ readMc(); S.view='add'; S.err=''; render(); }; return; }
  if(v==='open'){ const a=$('#b-op-add'); if(a)a.onclick=addOpen; const b=$('#b-formback'); if(b)b.onclick=()=>{ readOpen(); S.view='add'; S.err=''; render(); }; return; }
  if(v==='film'){
    const s=$('#b-film-search'); if(s)s.onclick=filmSearch;
    const fq=$('#film-q'); if(fq)fq.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); filmSearch(); } };
    el.querySelectorAll('[data-film]').forEach(b=>b.onclick=()=>{ const val=b.dataset.film; const i=val.indexOf('|'); filmPick(val.slice(0,i), val.slice(i+1)); });
    el.querySelectorAll('[data-actor]').forEach(cb=>cb.onchange=()=>filmToggle(+cb.dataset.actor));
    el.querySelectorAll('[data-amove]').forEach(b=>b.onclick=()=>{ const a=b.dataset.amove.split('|'); filmMove(+a[0],+a[1]); });
    const add=$('#b-film-add'); if(add)add.onclick=addFilm;
    const rs=$('#b-film-reset'); if(rs)rs.onclick=()=>{ S.filmPick=null; S.err=''; render(); };
    const b=$('#b-formback'); if(b)b.onclick=()=>{ S.filmPick=null; S.view='add'; S.err=''; render(); };
    return;
  }
}
boot();
</script>
</body>
</html>
