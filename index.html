<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf1fb; --bg2:#ffffff; --surface:#ffffff; --surface-2:#eef4fc;
    --ink:#142944; --muted:#5d6b82; --line:#d6e3f2; --gold:#2b7fff;
    --rood:#e5484d; --blauw:#2b7fff; --geel:#e29400; --groen:#16a173;
    --radius:18px; --shadow:0 16px 34px -20px rgba(31,68,128,.30);
    --display:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --body:"Inter", ui-sans-serif, system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);
    background:radial-gradient(1200px 600px at 50% -10%, rgba(43,127,255,.12), transparent 60%),linear-gradient(180deg, var(--bg) 0%, #dce8f8 100%);
    background-attachment:fixed;min-height:100%;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:780px;margin:0 auto;padding:24px 18px 64px;min-height:100vh;display:flex;flex-direction:column}
  .wrap.wide{max-width:1180px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px var(--gold)}
  .brand b{font-family:var(--display);letter-spacing:.5px;font-size:15px;text-transform:uppercase}
  .brand span{color:var(--muted);font-size:13px;margin-left:auto}
  h1{font-family:var(--display);font-weight:700;line-height:1.05;margin:.2em 0;letter-spacing:-.5px}
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
  .muted{color:var(--muted)} .center{text-align:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:12px;flex-wrap:wrap} .grow{flex:1}
  button{font-family:var(--body);cursor:pointer;border:none;border-radius:14px;font-size:16px;font-weight:600;transition:transform .08s ease, filter .15s ease, background .15s}
  button:active{transform:translateY(1px) scale(.99)}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .btn{padding:15px 18px;background:var(--gold);color:#fff}
  .btn:hover{filter:brightness(1.05)}
  .btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.big{font-size:18px;padding:18px;width:100%}
  .linkbtn{align-self:center;background:transparent;border:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px}
  .linkbtn:hover{color:var(--ink)}
  input{font-family:var(--body);font-size:18px;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);width:100%}
  input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
  input::placeholder{color:#94a3b8}
  label.lbl{font-size:13px;color:var(--muted);font-weight:600}
  .code{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:clamp(44px,11vw,76px);color:var(--gold);text-shadow:0 0 30px rgba(43,127,255,.35)}
  .pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600}
  .pill.ok{color:var(--groen)} .chips{display:flex;flex-wrap:wrap;gap:8px}
  .spotlight{position:relative;border-radius:var(--radius);padding:30px 22px;text-align:center;
    background:radial-gradient(420px 240px at 50% 0%, rgba(43,127,255,.18), transparent 70%), var(--surface);border:1px solid var(--line)}
  .qmeta{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
  .qtext{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);line-height:1.15}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:520px){.answers{grid-template-columns:1fr}}
  .ans{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;border:2px solid transparent;background:var(--surface-2);color:var(--ink);text-align:left;font-size:17px;font-weight:600;width:100%}
  .ans .shape{font-size:20px;width:30px;text-align:center;flex:none}
  .ans[data-c="0"]{box-shadow:inset 4px 0 0 var(--rood)} .ans[data-c="1"]{box-shadow:inset 4px 0 0 var(--blauw)}
  .ans[data-c="2"]{box-shadow:inset 4px 0 0 var(--geel)} .ans[data-c="3"]{box-shadow:inset 4px 0 0 var(--groen)}
  .ans[data-c="0"] .shape{color:var(--rood)} .ans[data-c="1"] .shape{color:var(--blauw)}
  .ans[data-c="2"] .shape{color:var(--geel)} .ans[data-c="3"] .shape{color:var(--groen)}
  .ans.sel{border-color:var(--gold);background:#dce9fb}
  .ans.correct{border-color:var(--groen);background:rgba(67,214,160,.16)}
  .ans.wrong{border-color:var(--rood);background:rgba(255,93,108,.14);opacity:.85}
  .ans.dim{opacity:.45} .ans[disabled]{cursor:default}
  .lb{display:flex;flex-direction:column;gap:8px}
  .lbrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:12px}
  .lbrow .rank{font-family:var(--display);font-weight:700;color:var(--muted);width:26px}
  .lbrow .nm{flex:1;font-weight:600} .lbrow .sc{font-family:var(--display);font-weight:700}
  .lbrow .gain{color:var(--groen);font-size:13px;font-weight:600;margin-left:6px}
  .lbrow.me{outline:2px solid var(--gold)}
  .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end;margin:10px 0}
  .pcol{background:var(--surface-2);border-radius:14px 14px 0 0;padding:14px 8px;text-align:center;border:1px solid var(--line);border-bottom:none}
  .pcol .nm{font-weight:700;font-size:15px;margin-top:6px;word-break:break-word}
  .pcol .sc{font-family:var(--display);color:var(--gold);font-weight:700;font-size:20px}
  .pcol.first{height:150px}.pcol.second{height:120px}.pcol.third{height:100px}
  .medal{font-size:26px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;background:var(--gold);transition:width .3s ease}
  .footnote{color:var(--muted);font-size:12px;text-align:center;margin-top:14px}
  .err{color:var(--rood)}
  .waiting-dots::after{content:"";animation:dots 1.4s steps(4,end) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* spelerlijst (host) */
  .plist{display:flex;flex-direction:column;gap:8px}
  .prow{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 14px}
  .prow.answered{border-color:rgba(67,214,160,.5);background:rgba(67,214,160,.08)}
  .prow .nm{font-weight:600}
  .nm-btn{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;background:transparent;color:var(--ink);padding:8px 6px;border-radius:10px;text-align:left}
  .nm-btn:hover{background:rgba(20,40,80,.05)}
  .st{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
  .st.ok{color:var(--groen)}
  .kick{background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:9px 11px;border-radius:10px;flex:none}
  .kick:hover{background:rgba(255,93,108,.16);color:var(--rood)}
  .kickconfirm{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .mini{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
  .mini.danger{background:var(--rood);color:#fff;border-color:transparent}
  /* host vult antwoord in */
  .picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 4px 4px}
  @media (max-width:520px){.picker{grid-template-columns:1fr}}
  .popt{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px;text-align:left}
  .popt:hover{background:var(--surface-2)}
  .popt .shape{font-size:17px;width:24px;text-align:center;flex:none}
  .popt[data-c="0"] .shape{color:var(--rood)} .popt[data-c="1"] .shape{color:var(--blauw)}
  .popt[data-c="2"] .shape{color:var(--geel)} .popt[data-c="3"] .shape{color:var(--groen)}
  /* reveal: wie koos wat */
  .ansline{border-radius:14px;border:2px solid transparent;background:var(--surface-2);padding:12px 14px}
  .ansline.correct{border-color:var(--groen);background:rgba(67,214,160,.14)}
  .ansline.dim{opacity:.6}
  .ans-head{display:flex;align-items:center;gap:12px;font-weight:600;font-size:16px}
  .ansline[data-c="0"] .shape{color:var(--rood)} .ansline[data-c="1"] .shape{color:var(--blauw)}
  .ansline[data-c="2"] .shape{color:var(--geel)} .ansline[data-c="3"] .shape{color:var(--groen)}
  .ans-head .shape{font-size:18px;width:24px;text-align:center;flex:none}
  .ans-head .otxt{flex:1}
  .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#fff;background:var(--groen);padding:3px 8px;border-radius:999px}
  .whos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .who{font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .who.empty{color:var(--muted);font-weight:500;border-style:dashed}
  /* afbeeldingen in vragen */
  .qimg{display:block;max-width:100%;max-height:300px;margin:0 auto 14px;border-radius:12px;border:1px solid var(--line)}
  .qtext.sm{font-size:clamp(17px,3.5vw,21px)}
  /* progressive hints */
  .clues{display:flex;flex-direction:column;gap:12px;text-align:left}
  .clue{display:flex;gap:12px;align-items:flex-start}
  .cnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .cbody{flex:1}
  .cbody .qimg{margin-bottom:6px;max-height:220px}
  /* inzet-knoppen */
  .bets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:520px){.bets{grid-template-columns:1fr}}
  .betopt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px}
  .betopt:hover{background:#dce9fb;border-color:var(--gold)}
  .betopt .mult{font-family:var(--display);font-weight:700;color:var(--gold);font-size:18px}
  /* open zoeken */
  .searchwrap{display:flex;flex-direction:column;gap:0}
  .sinput{margin-bottom:8px}
  .sresults{display:flex;flex-direction:column;gap:6px}
  .sresult{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-weight:600;font-size:15px;text-align:left;width:100%}
  .sresult:hover{background:#dce9fb} .sresult.sel{border-color:var(--gold);background:#dce9fb}
  .sresult img{width:34px;height:50px;object-fit:cover;border-radius:5px;flex:none;background:var(--bg2)}
  .picked{margin-top:10px;padding:10px 12px;border-radius:11px;background:rgba(43,127,255,.12);border:1px solid var(--gold);font-size:14px}
  /* audio in stages */
  .qaudio{width:100%;margin:4px 0 8px;height:38px}
  /* gok bij reveal (host) */
  .guess{font-size:14px;font-weight:600}
  .guess.gok-ok{color:var(--groen)} .guess.gok-bad{color:var(--rood)}
  /* beoordeel-paneel host */
  .reviewrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px}
  .reviewrow .rnm{font-weight:600;flex:none;min-width:64px}
  .reviewrow .rguess{flex:1;font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .reviewrow .pts{color:var(--groen);font-weight:700}
  .judge{flex:none;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;border:1px solid var(--line)}
  .judge.jok{background:rgba(67,214,160,.18);color:var(--groen);border-color:rgba(67,214,160,.5)}
  .judge.jbad{background:rgba(255,93,108,.16);color:var(--rood);border-color:rgba(255,93,108,.45)}
  /* stage-lijst met omschrijvingen + indicator */
  .stagelist{display:flex;flex-direction:column;gap:8px;text-align:left}
  .stagerow{display:flex;gap:12px;align-items:flex-start;padding:9px 11px;border-radius:12px;border:1px solid transparent}
  .stagerow.dim{opacity:.45}
  .stagerow.cur{background:rgba(43,127,255,.10);border-color:rgba(43,127,255,.45)}
  .stagerow .cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .slabel{font-weight:600;font-size:15px}
  .nowtag{margin-left:8px;font-size:12px;font-weight:700;color:var(--gold)}
  .slocked{font-size:13px;color:var(--muted);font-style:italic}
  .hintlist{display:flex;flex-wrap:wrap;gap:6px}
  .hintlabel{display:flex;align-items:center;gap:7px;background:var(--surface-2);border-radius:9px;padding:5px 10px;font-size:14px;font-weight:600}
  .metarow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:-2px}
  .pointsbig{text-align:center;background:linear-gradient(180deg,rgba(43,127,255,.10),rgba(43,127,255,.04));border:1px solid var(--line);border-radius:14px;padding:12px 16px;font-size:16px;color:var(--ink)}
  .pointsbig b{font-family:var(--display);font-size:30px;color:var(--blauw);vertical-align:-2px;margin:0 2px}
  .pointsbig span{color:var(--muted);font-size:14px}
  /* spelerslijst-tabel */
  .ptable{display:flex;flex-direction:column;gap:6px}
  .ptable .phead,.ptable .prow2{display:grid;grid-template-columns:1.4fr 1.3fr 1.2fr auto;gap:8px;align-items:center}
  .ptable.noinzet .phead,.ptable.noinzet .prow2{grid-template-columns:1.4fr 1.3fr auto}
  .ptable .phead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:0 12px}
  .ptable .prow2{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px}
  .ptable .prow2 .pnm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .ptable .pscore{font-family:var(--display);font-weight:700;text-align:right}
  .stbadge{font-size:12.5px;font-weight:700;white-space:nowrap}
  .stbadge.wait{color:var(--muted)} .stbadge.done{color:var(--blauw)}
  .stbadge.good{color:var(--groen)} .stbadge.bad{color:var(--rood)} .stbadge.pass{color:var(--muted)}
  .betcell{font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  .betcell.over{color:var(--rood)}
  .wronglist{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 2px}
  .wronglist .wl-h{font-size:13px;font-weight:700;color:var(--rood)}
  .wronglist .wl-chip{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:line-through}
  /* bovenbalk */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .tb-round{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
  .tb-round small{font-weight:600;color:var(--muted);font-family:var(--body)}
  .tb-conn{font-size:13px;color:var(--muted);font-weight:600}
  .introtext{font-size:17px;line-height:1.5;max-width:46ch;margin:0 auto;color:var(--ink)}
  .qnote{font-size:14px;color:var(--muted);text-align:center;margin:6px 0 0;max-width:50ch;margin-left:auto;margin-right:auto}
  .roundtag{font-family:var(--display);font-weight:700;font-size:14px;color:var(--blauw)}
  .betminirow{display:flex;gap:5px;flex:none}
  .betmini{width:34px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px}
  .betmini.sel{background:var(--blauw);color:#fff;border-color:var(--blauw)}
  .reviewrow.me{background:var(--surface-2);border-radius:10px;padding-left:8px;padding-right:8px}
  .tb-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tb-skip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .tb-skip:hover{color:var(--rood);border-color:var(--rood)}
  .tb-skipconfirm{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  /* host: twee koloms met statuszijbalk */
  .hostgrid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
  .hostmain{display:flex;flex-direction:column;gap:16px;min-width:0}
  .hostaside{display:flex;flex-direction:column;gap:12px;min-width:0}
  @media(min-width:900px){
    .hostgrid{grid-template-columns:minmax(0,1fr) 320px}
    .hostaside{position:sticky;top:16px}
  }
  .psc{margin-left:auto;font-family:var(--display);font-weight:700;color:var(--gold);font-size:15px;padding:0 4px}
  .st.good{color:var(--groen)} .st.wait{color:var(--muted)} .st.bad{color:var(--rood)}
  .pwin{font-family:var(--display);font-weight:700;color:var(--groen);font-size:14px;white-space:nowrap}
  .pbust{font-family:var(--display);font-weight:700;color:var(--rood);font-size:14px}
  .betval{margin-left:auto;font-size:13px;font-weight:600;color:var(--gold)}
  /* pas-knop + popup */
  .pasbtn{margin-top:10px}
  .modal{position:fixed;inset:0;background:rgba(10,6,24,.72);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .modalcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .funbanner{border-color:rgba(43,127,255,.5)!important;background:rgba(43,127,255,.10)}
  .checkrow{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
  .checkrow input{margin-top:2px;flex:none}
</style>
</head>

   → kies "Config" en kopieer het hele object hieronder overheen.
   Let op dat 'databaseURL' erin staat (komt erbij zodra je de
   Realtime Database hebt aangemaakt — zie stappenplan). */

  authDomain: "quiz-db61a.firebaseapp.com",

  projectId: "quiz-db61a",

async function tmdbSearch(q){
  const url = `https://api.themoviedb.org/3/search/movie?query=${encodeURIComponent(q)}&include_adult=false&language=nl-NL&page=1`;
  const res = await fetch(url, { headers:{ Authorization:'Bearer '+TMDB_TOKEN, accept:'application/json' } });

  return (data.results||[]).slice(0,8).map(m=>({
    id:m.id,
    label:m.title,
    thumb:m.poster_path?`https://image.tmdb.org/t/p/w92${m.poster_path}`:null,
  }));

function deezerSearch(q){
  return new Promise(resolve=>{
    const cb='dz_'+Math.random().toString(36).slice(2,9);
    const s=document.createElement('script');
    const done=items=>{ try{ delete window[cb]; }catch(e){} s.remove(); resolve(items); };
    window[cb]=data=>done((data&&data.data?data.data:[]).slice(0,8).map(t=>({
      id:t.id, label:`${t.artist?t.artist.name+' – ':''}${t.title}`,

    })));
    s.onerror=()=>done([]);

  });

/* normaliseer een vraag naar het interne model (accepteert ook {type,display}-stages en correctIndex) */
function normStage(s){
  const o={};
  if(s.type && s.display!=null){ if(s.type==='image')o.image=s.display; else if(s.type==='audio')o.audio=s.display; else o.text=s.display; }
  if(s.text!=null)o.text=s.text; if(s.image!=null)o.image=s.image; if(s.audio!=null)o.audio=s.audio;
  if(s.label!=null)o.label=s.label;
  if(s.betMultiplier!=null)o.betMultiplier=s.betMultiplier;
  return o;
}
function normalizeQuiz(arr){
  return arr.map(q=>{
    const out = Object.assign({}, q);
    if(Array.isArray(q.stages)) out.stages = q.stages.map(normStage);
    if(typeof q.options==='string')        out.optionsMode = q.options===':tmdb'?'tmdb':q.options===':deezer'?'deezer':q.options===':text'?'text':'list';
    else if(Array.isArray(q.options))      out.optionsMode = q.search ? 'listsearch' : 'list';   // search:true → autocomplete-veld
    else if(['tmdb','deezer','text','listsearch'].includes(q.optionsMode)) out.optionsMode = q.optionsMode;   // al genormaliseerd (resume)
    else { out.optionsMode='list'; out.options = out.options||[]; }
    if(!['list','listsearch'].includes(out.optionsMode)) delete out.options;
    if(out.answer==null && q.correctIndex!=null) out.answer = q.correctIndex;
    if(Array.isArray(out.stages)){
      const muls = out.stages.map(s=>s.betMultiplier);
      if(muls.some(m=>m!=null)){ out.betting=true; out.betMultipliers = out.stages.map(s=>s.betMultiplier!=null?s.betMultiplier:1); }
      // bandle-metadata uit de mapnaam halen, bv "..._(1974_143M_par-2)/1" → jaar 1974, 143M views, par 2
      const ap = out.stages.find(s=>s.audio);
      if(ap){
        const folder = ap.audio.split('/').slice(-2,-1)[0]||'';
        const m = folder.match(/\(\s*(\d{4})\s*[_ ]\s*([\d.]+\s*[kmbKMB]?)\s*[_ ]\s*par[-_ ]*(\d+)\s*\)/);
        if(m){ if(out.year==null) out.year=+m[1]; if(out.views==null) out.views=m[2].toUpperCase().replace(/\s+/g,''); if(out.par==null) out.par=+m[3]; }
      }
    }
    if(out.answerLabel==null && ['list','listsearch'].includes(out.optionsMode) && Array.isArray(out.options) && out.options[out.answer]!=null)
      out.answerLabel = out.options[out.answer];
    if(out.optionsMode==='text' && out.answerLabel==null && out.answer!=null) out.answerLabel = String(out.answer);
    if(out.points==null) out.points = 100;
    return out;
  });
}
/* metaregel (jaar · views · moeilijkheid) voor bv bandle-vragen */
function metaHTML(r){
  const bits=[];
  if(r.year) bits.push(String(r.year));
  if(r.views) bits.push(`${r.views} views`);
  if(r.par!=null) bits.push(`par ${r.par}`);
  return bits.length ? `<div class="metarow">${bits.map(b=>`<span class="pill">${esc(b)}</span>`).join('')}</div>` : '';
}
/* tekst normaliseren voor losse antwoordvergelijking */
function normTxt(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
/* is dit antwoord goed? ondersteunt lijst/zoek (id of index), tekst, én meerdere juiste antwoorden (array) */
function isCorrectAns(r, a){
  if(a==null) return false;
  if(r.optionsMode==='text'){
    const ok = [r.answerLabel, r.answer, ...((r.accept)||[])].filter(x=>x!=null).map(normTxt);
    return ok.includes(normTxt(a));
  }
  const ans = r.answer;
  return Array.isArray(ans) ? ans.map(String).includes(String(a)) : String(a)===String(ans);
}

/* vragenset kan plat zijn (lijst van vragen) of ingedeeld in rondes ({rounds:[{name,intro,questions:[]}]}) */
function flattenQuiz(data){
  if(Array.isArray(data)) return { questions:data.slice(), rounds:[{name:'',intro:'',start:0,end:data.length}] };
  if(data && Array.isArray(data.rounds)){
    const questions=[], rounds=[];
    data.rounds.forEach(rd=>{
      const qs = Array.isArray(rd.questions)?rd.questions:[];
      const start=questions.length;
      qs.forEach(q=>questions.push(q));
      rounds.push({ name:rd.name||'', intro:rd.intro||'', start, end:questions.length });
    });
    return { questions, rounds };
  }
  return { questions:[], rounds:[{name:'',intro:'',start:0,end:0}] };
}
/* welke ronde + positie hoort bij platte vraagindex i */
function roundCtx(i){
  const rounds = app.rounds||[];
  for(let ri=0; ri<rounds.length; ri++){
    const rd=rounds[ri];
    if(i>=rd.start && i<rd.end) return { ri, name:rd.name, intro:rd.intro, qIn:i-rd.start, qCount:rd.end-rd.start, roundCount:rounds.length, start:rd.start, end:rd.end };
  }
  return { ri:0, name:'', intro:'', qIn:i, qCount:(app.quiz||[]).length, roundCount:rounds.length||1, start:0, end:(app.quiz||[]).length };
}
/* is platte index i de eerste vraag van een ronde? */
function isRoundStart(i){ return (app.rounds||[]).some(rd=> rd.start===i && rd.end>rd.start); }

/* validatie van een geladen vragenset (plat of met rondes) */
function validateQuiz(raw){
  if(raw && !Array.isArray(raw) && Array.isArray(raw.rounds)){
    for(let ri=0; ri<raw.rounds.length; ri++){
      const rd=raw.rounds[ri];
      if(!rd || typeof rd!=='object') return `Ronde ${ri+1} is ongeldig.`;
      if(!Array.isArray(rd.questions) || !rd.questions.length) return `Ronde ${ri+1} ("${rd.name||''}") heeft geen vragen.`;
    }
  }
  const data = flattenQuiz(raw).questions;
  return validateQuestions(data);
}
function validateQuestions(data){
  if(!Array.isArray(data) || !data.length) return 'Het bestand moet een niet-lege lijst met vragen zijn.';
  for(let i=0;i<data.length;i++){
    const q=data[i], n=i+1;
    if(!q || typeof q!=='object') return `Vraag ${n} is ongeldig.`;
    const apiOpts = typeof q.options==='string' && [':tmdb',':deezer'].includes(q.options);
    const textOpts = q.options===':text';
    const listOpts = Array.isArray(q.options);
    if(!apiOpts && !textOpts && !listOpts) return `Vraag ${n}: 'options' moet een lijst zijn of ":tmdb"/":deezer"/":text".`;
    if(listOpts && q.options.length<2) return `Vraag ${n}: minstens 2 opties nodig.`;
    if(textOpts){
      if(q.answer==null && !q.answerLabel) return `Vraag ${n}: bij ":text" is 'answer' of 'answerLabel' nodig.`;
    } else {
      const ans = q.answer!=null ? q.answer : q.correctIndex;
      if(ans==null) return `Vraag ${n}: 'answer' ontbreekt.`;
      if(listOpts && (typeof ans!=='number' || ans<0 || ans>=q.options.length)) return `Vraag ${n}: 'answer' moet een geldige index zijn.`;
      if(apiOpts && !q.answerLabel) return `Vraag ${n}: bij ":tmdb"/":deezer" is 'answerLabel' nodig.`;
    }
    if(q.stages!=null){
      if(!Array.isArray(q.stages)||!q.stages.length) return `Vraag ${n}: 'stages' moet een niet-lege lijst zijn.`;
      for(let j=0;j<q.stages.length;j++){
        const s=q.stages[j];
        const has = s && (s.text!=null||s.image!=null||s.audio!=null||(s.type&&s.display!=null));
        if(!has) return `Vraag ${n}, stage ${j+1}: heeft tekst, image of audio nodig.`;
      }
      if(Array.isArray(q.pointsByStage) && q.pointsByStage.length!==q.stages.length) return `Vraag ${n}: 'pointsByStage' moet even lang zijn als 'stages'.`;
    } else if(!q.question && !q.image){
      return `Vraag ${n}: 'question' of 'image' nodig.`;
    }
  }
  return null;
}

/* publiek deel van de huidige vraag dat spelers mogen zien (zonder juist antwoord, behalve bij reveal) */
function publicCurrent(){
  const r = app.quiz[app.round]; if(!r) return null;
  const staged = Array.isArray(r.stages);
  const base = { question:r.question||'', optionsMode:r.optionsMode||'list', staged, points:r.points ?? 100 };
  if(['list','listsearch'].includes(base.optionsMode)) base.options = r.options||[];
  if(r.year!=null) base.year=r.year;
  if(r.views!=null) base.views=r.views;
  if(r.par!=null) base.par=r.par;
  if(!staged){
    base.image = resolveMedia(r.image) || null;
  } else {
    const reveal = app.phase==='reveal';
    base.stages = r.stages.map((s,idx)=>{
      const revealed = reveal || idx<=app.stage;
      const kind = s.audio?'audio':s.image?'image':'text';
      const o = { kind, label:s.label||'', revealed };
      if(revealed){
        if(kind==='text') o.text = s.text||'';
        if(kind==='image') o.image = resolveMedia(s.image) || '';
        // audio-paden gaan NIET naar spelers: alleen de host speelt af
      }
      return o;
    });
    base.totalStages = r.stages.length;
    base.stage = app.stage;
    if(r.betting){ base.betting = true; base.betMultipliers = r.betMultipliers; }
    else if(r.pointsByStage){ base.points = r.pointsByStage[app.stage] ?? base.points; }
  }
  if(app.phase==='reveal'){
    base.answer = r.answer;
    base.answerLabel = r.answerLabel || (base.optionsMode==='list' && base.options ? base.options[r.answer] : '') || '';
  }
  return base;
}
function pushState(){
  // per-speler oordeel over hun huidige gok (alleen zichtbaar voor spelers ná 'controleer antwoorden')
  let judged = null, bets = null;
  if(app.phase==='question'){
    const r = app.quiz[app.round];
    if(r && Array.isArray(r.stages)){
      judged = {};
      app.players.forEach(p=>{
        const a = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
        if(a!=null) judged[p.id] = effectiveCorrect(app.round, p.id, isCorrectAns(r,a));
      });
    }
    if(r && r.betting){
      bets = {};
      app.players.forEach(p=>{ if(p.bet && p.bet[app.round]!=null) bets[p.id]=p.bet[app.round]; });
    }
  }
  set(stateRef(app.code), {
    phase: app.phase, round: app.round, totalRounds: app.quiz.length, stage: app.stage,
    rc: app.round>=0 ? roundCtx(app.round) : null,
    betStep: app.betStep, checked: app.checked,
    current: (app.phase==='question'||app.phase==='reveal') ? publicCurrent() : null,
    scores: app.scores, names: app.names,
    results: app.phase==='reveal' ? app.results : null,
    judged, bets,
    answeredCount: app.answeredCount, totalPlayers: Object.keys(app.names).length, ts: Date.now(),
  });
}

/* ============================================================
   REALTIME LISTENERS (geen polling meer)
   ============================================================ */
function startHost(){
  app.unsubPlayers = onValue(playersRef(app.code), snap=>{
    const present = Object.values(snap.val() || {}).filter(p=> p && p.id && p.name);
    app.players = present;
    // namen blijven bewaard (ook als iemand wegvalt) voor scorebord
    present.forEach(p=>{ app.names[p.id]=p.name; if(!(p.id in app.scores)) app.scores[p.id]=0; });
    if(app.phase==='question'){
      app.answeredCount = present.filter(p=> p.ans && p.ans[app.round]!=null).length;
    }
    if(app.phase==='reveal') buildResults();
    pushState();
    setConn(app.code+' · '+present.length+' verbonden');
    renderHost();
  });
  // handmatige oordelen (van host of controleur) → herbereken + opnieuw tonen
  app.unsubJudges = onValue(ref(db, `games/${app.code}/judge`), snap=>{
    app.judges = snap.val() || {};
    if(app.phase==='reveal') buildResults();
    pushState();
    renderHost();
  });
}
function startPlayer(){
  app.unsubState = onValue(stateRef(app.code), snap=>{
    const v = snap.val(); if(!v) return;
    app.game = v; setConn('verbonden'); renderPlayer();
  });
  // eigen node bewaken: verdwijnt die, dan ben je door de host verwijderd
  app.unsubMe = onValue(playerRef(app.code, app.pid), snap=>{
    if(!snap.exists() && !app.kicked){ app.kicked=true; cleanup(); renderPlayerKicked(); }
  });
}
function cleanup(){
  if(app.unsubPlayers){ app.unsubPlayers(); app.unsubPlayers=null; }
  if(app.unsubState){ app.unsubState(); app.unsubState=null; }
  if(app.unsubMe){ app.unsubMe(); app.unsubMe=null; }
  if(app.unsubJudges){ app.unsubJudges(); app.unsubJudges=null; }
}

function hostCreate(){
  app.role='host'; app.code=genCode(); app.phase='lobby'; app.round=-1; app.stage=0;
  app.scores={}; app.names={}; app.players=[]; app.results=null;
  app.openPicker=null; app.confirmKick=null; app.kicked=false; app.quizErr='';
  app.judgeToken = genToken(); app.loadInfo=null;
  const f = flattenQuiz(SAMPLE);
  app.quiz = normalizeQuiz(f.questions); app.rounds = f.rounds; app.quizName = 'Voorbeeldset';
  remember(app.code);
  set(quizRef(app.code), app.quiz);      // vragenset bewaren voor hervatten
  set(roundsRef(app.code), app.rounds);
  set(ref(db, `games/${app.code}/judgeToken`), app.judgeToken);   // geheime sleutel voor de jurylid-link
  pushState(); startHost(); renderHost();
}
/* nieuwe vragenset toepassen (uit geladen JSON, plat of met rondes) */
function setQuiz(data, name){
  const f = flattenQuiz(data);
  app.quiz = normalizeQuiz(f.questions); app.rounds = f.rounds; app.quizName = name; app.quizErr='';
  applyAudioLabels();                    // instrumentnamen uit bestandsnamen overnemen (audio-stages)
  if(app.code){ set(quizRef(app.code), app.quiz); set(roundsRef(app.code), app.rounds); }
  renderHost();
}
function handleQuizFile(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data; try{ data = JSON.parse(reader.result); }
    catch(e){ app.quizErr='Ongeldige JSON: '+e.message; renderHost(); return; }
    const err = validateQuiz(data);
    if(err){ app.quizErr=err; renderHost(); return; }
    setQuiz(data, file.name);
  };
  reader.onerror = ()=>{ app.quizErr='Bestand kon niet gelezen worden.'; renderHost(); };
  reader.readAsText(file);
}
/* host hervat een lopend spel: status + vragenset terughalen uit Firebase */
async function hostResume(code){
  code = code.toUpperCase();
  const snap = await get(stateRef(code));
  if(!snap.exists()) return false;
  const s = snap.val();
  app.role='host'; app.code=code;
  app.phase  = s.phase || 'lobby';
  app.round  = (s.round!=null) ? s.round : -1;
  app.stage  = s.stage || 0;
  app.betStep = s.betStep!=null ? s.betStep : null;
  app.checked = !!s.checked;
  app.scores = s.scores || {};
  app.names  = s.names  || {};
  app.results= s.results || null;
  // oordelen terughalen + pre-ronde scores reconstrueren (scores nu = pre-ronde + winst deze ronde)
  const js = await get(ref(db, `games/${code}/judge`));
  app.judges = js.exists() ? js.val() : {};
  const tk = await get(ref(db, `games/${code}/judgeToken`));
  app.judgeToken = tk.exists() ? tk.val() : (app.judgeToken||genToken());
  if(!tk.exists()) set(ref(db, `games/${code}/judgeToken`), app.judgeToken);
  app.preRoundScores = {};
  Object.keys(app.scores).forEach(pid=>{
    const g = (app.results && app.results[pid]) ? (app.results[pid].gained||0) : 0;
    app.preRoundScores[pid] = app.scores[pid] - g;
  });
  app.players=[]; app.openPicker=null; app.confirmKick=null; app.kicked=false; app.quizErr='';
  const qs = await get(quizRef(code));
  app.quiz = normalizeQuiz(qs.exists() ? qs.val() : SAMPLE);
  const rs = await get(roundsRef(code));
  app.rounds = rs.exists() ? rs.val() : flattenQuiz(qs.exists()?qs.val():SAMPLE).rounds;
  app.quizName = qs.exists() ? 'geladen set' : 'Voorbeeldset';
  remember(code);
  startHost(); renderHost();
  return true;
}
/* zet de sub-stappen klaar voor een nieuwe vraag */
function initQuestion(){
  const r = app.quiz[app.round];
  app.stage=0; app.checked=false; app.answeredCount=0; app.results=null; app.confirmSkip=false;
  app.preRoundScores = {...app.scores};
  app.betStep = (r && r.betting) ? 'bet' : null;
}
function hostStart(){ app.round=0; app.phase='roundintro'; pushState(); renderHost(); }
function hostBeginRound(){ app.phase='question'; initQuestion(); pushState(); renderHost(); }
/* host slaat de huidige vraag over: geen punten, gewoon door (zelfde sprong als 'volgende') */
function hostSkip(){
  app.confirmSkip=false;
  if(app.round+1 < app.quiz.length){
    app.round++;
    if(isRoundStart(app.round)) app.phase='roundintro';
    else { app.phase='question'; initQuestion(); }
  }
  else app.phase='final';
  pushState(); renderHost();
}
/* punten bepalen op basis van (eventueel overrulede) correctheid */
function computeGain(r, correct, bet, lock){
  if(!correct) return { gained:0, won:false };
  if(r.betting){
    const won = bet!=null && lock!=null && lock<=bet;
    return { gained: won ? Math.round((r.points??100)*(r.betMultipliers[bet]||1)) : 0, won };
  }
  if(Array.isArray(r.stages) && r.pointsByStage){
    const st = lock!=null ? lock : r.pointsByStage.length-1;
    return { gained: r.pointsByStage[st] ?? (r.points??100), won:true };
  }
  return { gained: r.points??100, won:true };
}
/* leesbare puntenweergave bij 'controleer antwoorden'
   -> {text, kind}  kind: 'win' | 'bust' | 'open' (nog mogelijk, leeg) */
function pointsInfo(r, correct, lock, bet, stage){
  const base = r.points ?? 100;
  if(r.betting){
    if(correct){
      const won = (bet!=null && lock!=null && lock<=bet);
      if(won) return { text:`+${base} × ${r.betMultipliers[bet]||1}`, kind:'win' };
      return { text:'0', kind:'bust' };
    }
    if(bet!=null && stage>=bet) return { text:'0', kind:'bust' };  // inzet-deadline verstreken
    return { text:'', kind:'open' };                                // nog mogelijk
  }
  if(Array.isArray(r.stages) && r.pointsByStage){
    if(correct){ const p=r.pointsByStage[lock] ?? base; return { text:`+${p}`, kind:'win' }; }
    return stage>=r.stages.length-1 ? { text:'0', kind:'bust' } : { text:'', kind:'open' };
  }
  return correct ? { text:`+${base}`, kind:'win' } : { text:'0', kind:'bust' };
}
/* effectieve correctheid: handmatig oordeel (host/controleur) overruult de auto-check */
function effectiveCorrect(round, pid, auto){
  const o = app.judges && app.judges[round] ? app.judges[round][pid] : undefined;
  return (o===true||o===false) ? o : auto;
}
/* resultaten + score voor de huidige ronde (her)berekenen */
function buildResults(){
  const r = app.quiz[app.round];
  app.results = {};
  app.players.forEach(p=>{
    const a  = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
    const al = (p.anslabel && p.anslabel[app.round]!=null) ? p.anslabel[app.round] : null;
    const lock = (p.astage && p.astage[app.round]!=null) ? p.astage[app.round] : null;
    const bet  = (p.bet && p.bet[app.round]!=null) ? p.bet[app.round] : null;
    const passed = !!(p.pass && p.pass[app.round]);
    const auto = isCorrectAns(r,a);
    const correct = effectiveCorrect(app.round, p.id, auto);
    const g = computeGain(r, correct, bet, lock);
    app.results[p.id] = { answer:a, label:al, autoCorrect:auto, correct, gained:g.gained, won:g.won, bet, lock, passed };
  });
  Object.keys(app.names).forEach(pid=>{
    app.scores[pid] = (app.preRoundScores[pid]||0) + (app.results[pid] ? app.results[pid].gained : 0);
  });
}
function hostReveal(){
  const r = app.quiz[app.round];
  if(Array.isArray(r.stages)) app.stage = r.stages.length-1;   // bij onthullen alles tonen
  buildResults();
  app.phase='reveal'; pushState(); renderHost();
}
/* ---- host sub-stappen binnen een vraag ---- */
function hostRevealBets(){ app.betStep='reveal'; pushState(); renderHost(); }
function hostStartPlay(){ app.betStep='play'; app.checked=false; pushState(); renderHost(); }
function hostCheck(){ app.checked=true; pushState(); renderHost(); }
function hostNextHint(){ app.stage++; app.checked=false; pushState(); renderHost(); }
/* schrijf handmatig oordeel naar gedeelde opslag (host of controleur) */
function setJudge(round, pid, val){
  set(ref(db, `games/${app.code}/judge/${round}/${pid}`), val);
}
/* host overruled goed/fout (schrijft naar judge-opslag; listener herberekent) */
function hostToggleCorrect(pid){
  const res = app.results && app.results[pid]; if(!res) return;
  setJudge(app.round, pid, !res.correct);
}
function hostNext(){
  if(app.round+1 < app.quiz.length){
    app.round++;
    if(isRoundStart(app.round)) app.phase='roundintro';      // nieuwe ronde → eerst de uitleg
    else { app.phase='question'; initQuestion(); }
  }
  else app.phase='final';
  pushState(); renderHost();
}
async function hostEnd(){ forget(); cleanup(); await remove(ref(db, `games/${app.code}`)); resetToHome(); }

/* host vult zelf een antwoord in namens een speler (backup) */
async function hostSetAnswer(pid, idx){
  app.openPicker=null;
  const p = app.players.find(x=>x.id===pid);   // optimistisch updaten voor snappy feedback
  if(p){ p.ans = p.ans||{}; p.ans[app.round]=idx; }
  renderHost();
  await set(ansRef(app.code, pid, app.round), idx);
}
/* host verwijdert een speler handmatig */
async function hostKick(pid){
  app.confirmKick=null; if(app.openPicker===pid) app.openPicker=null;
  app.players = app.players.filter(p=>p.id!==pid);
  delete app.names[pid]; delete app.scores[pid];
  if(app.results) delete app.results[pid];
  renderHost();
  await remove(playerRef(app.code, pid));
}

   SPELER-ACTIES
   ============================================================ */
async function playerJoin(code, name){
  app.role='player'; app.code=code.toUpperCase(); app.pid=genId(); app.name=name.trim();
  app.ans={}; app.bet={}; app.submittedRound=-1; app.sel=null;
  const snap = await get(stateRef(app.code));
  if(!snap.exists()) return false;
  const pr = playerRef(app.code, app.pid);
  await set(pr, { id:app.pid, name:app.name, ans:app.ans, seen:Date.now() });
  startPlayer();
  return true;
}
/* ---- controleur (jurylid): ziet antwoorden, keurt goed/fout, telt mee in de score ---- */
async function controllerJoin(code, token){
  code = code.toUpperCase();
  const snap = await get(stateRef(code));
  if(!snap.exists()) return 'nogame';
  const tk = await get(ref(db, `games/${code}/judgeToken`));
  if(!tk.exists() || String(tk.val())!==String(token||'')) return 'badtoken';
  app.role='controller'; app.code=code; app.kicked=false;
  const qs = await get(quizRef(code));
  app.quiz = normalizeQuiz(qs.exists()?qs.val():SAMPLE);
  const rs = await get(roundsRef(code));
  app.rounds = rs.exists() ? rs.val() : flattenQuiz(qs.exists()?qs.val():SAMPLE).rounds;
  app.unsubState   = onValue(stateRef(code), s=>{ app.game = s.val(); renderController(); });
  app.unsubPlayers = onValue(playersRef(code), s=>{ app.players = Object.values(s.val()||{}).filter(p=>p&&p.id&&p.name); renderController(); });
  app.unsubJudges  = onValue(ref(db,`games/${code}/judge`), s=>{ app.judges = s.val()||{}; renderController(); });
  setConn('controleur · '+code);
  renderController();
  return 'ok';
}
function renderController(){
  const wrap=document.querySelector('.wrap'); if(wrap) wrap.classList.remove('wide');
  const g = app.game;
  const rc = (g && g.rc) || {};
  const roundLbl = g && g.rc ? `Ronde ${rc.ri+1}/${rc.roundCount} · vraag ${rc.qIn+1}/${rc.qCount}` : '';
  if(!g || g.phase==='lobby' || g.phase==='final'){
    el.innerHTML = `<div class="center stack"><div class="qmeta">Controleur · ${esc(app.code||'')}</div>
      <h1>${g&&g.phase==='final'?'Het spel is afgelopen':'Wachten op het spel…'}</h1>
      <p class="muted">Je ziet hier straks alle antwoorden en inzetten.</p></div>`;
    return;
  }
  if(g.phase==='roundintro'){
    el.innerHTML = `<div class="center stack" style="gap:12px">
      <div class="qmeta">Controleur · nieuwe ronde</div>
      <h1 style="font-size:clamp(28px,7vw,42px)">${esc(rc.name||('Ronde '+((rc.ri??0)+1)))}</h1>
      ${rc.intro?`<p class="introtext">${esc(rc.intro)}</p>`:''}
      <p class="muted">Wachten tot de host de ronde start <span class="waiting-dots"></span></p></div>`;
    return;
  }
  const round = g.round, r = app.quiz[round] || {};
  // ---- inzetfase: inzetten zien én wijzigen ----
  if(g.phase==='question' && r.betting && (g.betStep==='bet' || g.betStep==='reveal')){
    const muls = r.betMultipliers||[];
    const rows = app.players.map(p=>{
      const bet = (p.bet&&p.bet[round]!=null)?p.bet[round]:null;
      const passed = !!(p.pass&&p.pass[round]);
      const btns = muls.map((m,i)=>`<button class="betmini ${bet===i?'sel':''}" data-cbet="${p.id}:${i}">${i+1}</button>`).join('');
      return `<div class="reviewrow" style="flex-wrap:wrap">
        <span class="rnm">${esc(p.name)}</span>
        <span class="rguess">${passed?'⤴ gepast':(bet!=null?`uiterlijk hint ${bet+1} (×${muls[bet]})`:'nog niet ingezet')}</span>
        <div class="betminirow">${btns}</div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="statusbar"><span class="pill">${esc(roundLbl)}</span><span class="pill ok">controleur · inzet</span></div>
      <div class="spotlight"><div class="qmeta">${esc(rc.name||'')}</div><div class="qtext" style="font-size:20px">${esc(r.question||'')}</div></div>
      ${metaHTML(r)}
      <div class="card stack" style="gap:8px"><b>Inzetten — zien en wijzigen</b>
        <p class="muted" style="margin:0;font-size:12px">Tik een hintnummer om iemands inzet te zetten of te corrigeren, vóórdat de vraag begint.</p>
        ${rows||'<p class="muted" style="margin:0">Nog geen spelers.</p>'}</div>`;
    el.querySelectorAll('[data-cbet]').forEach(b=> b.onclick=()=>{ const [pid,i]=b.dataset.cbet.split(':'); ctrlSetBet(pid, parseInt(i,10)); });
    return;
  }
  // ---- speel/onthul: beoordelen ----
  const correctLabel = r.answerLabel || (r.optionsMode==='list'&&r.options?r.options[r.answer]:'') || '—';
  const rows = app.players.map(p=>{
    const a = (p.ans&&p.ans[round]!=null)?p.ans[round]:null;
    const al = (p.anslabel&&p.anslabel[round]!=null)?p.anslabel[round]:null;
    const passed = !!(p.pass&&p.pass[round]);
    const auto = isCorrectAns(r,a);
    const eff = effectiveCorrect(round, p.id, auto);
    const ans = passed?'⤴ gepast':(a==null?'— nog niet':(al||String(a)));
    const dis = (a==null||passed)?'disabled':'';
    return `<div class="reviewrow">
      <span class="rnm">${esc(p.name)}</span>
      <span class="rguess">${esc(ans)}</span>
      <button class="judge ${eff?'jok':'jbad'}" data-cjudge="${p.id}" ${dis}>${eff?'goed ✓':'fout ✗'}</button>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="statusbar"><span class="pill">${esc(roundLbl)}</span><span class="pill ok">controleur</span></div>
    <div class="spotlight"><div class="qmeta">Juiste antwoord</div><div class="qtext" style="font-size:22px">${esc(correctLabel)}</div></div>
    <div class="card stack" style="gap:8px"><b>Antwoorden beoordelen</b>
      <p class="muted" style="margin:0;font-size:12px">Tik om goed/fout te zetten — telt direct mee in de score.</p>
      ${rows||'<p class="muted" style="margin:0">Nog geen spelers.</p>'}</div>`;
  el.querySelectorAll('[data-cjudge]').forEach(b=> b.onclick=()=> ctrlToggle(b.dataset.cjudge));
}
function ctrlSetBet(pid, k){
  const round = app.game.round;
  set(ref(db, `games/${app.code}/players/${pid}/bet/${round}`), k);
}
function ctrlToggle(pid){
  const round = app.game.round, r = app.quiz[round]||{};
  const p = app.players.find(x=>x.id===pid);
  const a = (p&&p.ans&&p.ans[round]!=null)?p.ans[round]:null;
  const auto = isCorrectAns(r,a);
  setJudge(round, pid, !effectiveCorrect(round, pid, auto));
}
async function playerSubmit(){
  if(app.kicked) return;
  const cur = app.game.current, r = app.game.round;
  let val, label;
  if(cur.optionsMode==='list'){
    if(app.sel==null) return;
    val = app.sel; label = (cur.options||[])[app.sel];
  } else if(cur.optionsMode==='text'){
    if(!app.textAns || !app.textAns.trim()) return;
    val = app.textAns.trim(); label = val;
  } else {
    if(!app.searchPick) return;
    val = app.searchPick.id; label = app.searchPick.label;
  }
  app.ans[r] = val; app.submittedRound = r;
  app.lastSubmitLabel = label;
  await set(ansRef(app.code, app.pid, r), val);
  await set(ref(db, `games/${app.code}/players/${app.pid}/anslabel/${r}`), label||'');
  if(cur.staged){
    app.myStage = cur.stage||0;
    await set(ref(db, `games/${app.code}/players/${app.pid}/astage/${r}`), cur.stage||0);
  }
  app.sel=null; app.searchPick=null; app.searchOpen=false; app.reguess=false;
  renderPlayer();
}
async function playerBet(k){
  if(app.kicked) return;
  const r = app.game.round;
  app.bet[r] = k;
  await set(ref(db, `games/${app.code}/players/${app.pid}/bet/${r}`), k);
  renderPlayer();
}
async function playerPass(){
  if(app.kicked) return;
  const r = app.game.round;
  app.confirmPass=false; app.passed[r]=true;
  await set(ref(db, `games/${app.code}/players/${app.pid}/pass/${r}`), true);
  renderPlayer();
}

/* spelerlijst met status + kick (+ in vraagmodus: zelf antwoord invullen) */
function playerRowsHTML(mode){
  if(!app.players.length) return `<p class="muted">Nog niemand verbonden… <span class="waiting-dots"></span></p>`;
  const r = app.quiz[app.round];
  const kickHTML = p => app.confirmKick===p.id
    ? `<span class="kickconfirm">Verwijderen? <button class="mini danger" data-kickyes="${p.id}">Ja</button> <button class="mini" data-kickno="1">Nee</button></span>`
    : `<button class="kick" data-kick="${p.id}" title="Verwijder speler" aria-label="Verwijder ${esc(p.name)}">✕</button>`;
  if(mode==='lobby')
    return app.players.map(p=>`<div class="prow"><span class="nm">${esc(p.name)}</span>${kickHTML(p)}</div>`).join('');

  const staged = r && Array.isArray(r.stages);
  const betting = r && r.betting;
  const betsRevealed = betting && app.betStep!=='bet';   // inzetten pas zichtbaar na "Toon de inzetten"
  const canPick = mode==='question' && r && r.optionsMode==='list';
  const rows = app.players.map(p=>{
    const a = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
    const passed = !!(p.pass && p.pass[app.round]);
    const bet  = (p.bet && p.bet[app.round]!=null) ? p.bet[app.round] : null;
    const correct = a!=null && effectiveCorrect(app.round, p.id, isCorrectAns(r,a));
    const score = app.scores[p.id]||0;
    // STATUS
    let st;
    if(passed) st = `<span class="stbadge pass">⤴ gepast</span>`;
    else if(a==null) st = `<span class="stbadge wait">nadenken…</span>`;
    else if(!staged || !app.checked) st = `<span class="stbadge done">✓ geantwoord</span>`;
    else if(correct) st = `<span class="stbadge good">goed ✓</span>`;
    else st = `<span class="stbadge bad">fout ✗</span>`;
    // INZET (kolom alleen getoond bij inzetvragen; waarde pas ná de reveal)
    let betCell = '';
    if(betting){
      if(passed) betCell = '<span class="betcell">—</span>';
      else if(bet==null) betCell = '<span class="betcell">nog niet</span>';
      else if(!betsRevealed) betCell = '<span class="betcell">✓ ingezet</span>';   // verbergen tot reveal
      else { const over = app.stage>bet && !correct; betCell = `<span class="betcell ${over?'over':''}">uiterlijk hint ${bet+1}${over?' · te laat':''}</span>`; }
    }
    // NAAM (+ evt. host-picker voor losse meerkeuze) — geen kick tijdens het spel
    const nameInner = canPick
      ? `<button class="nm-btn" data-pick="${p.id}" aria-expanded="${app.openPicker===p.id}"><span>${esc(p.name)}</span></button>`
      : `<span>${esc(p.name)}</span>`;
    const picker = (canPick && app.openPicker===p.id)
      ? `<div class="picker">${r.options.map((o,i)=>`<button class="popt" data-c="${i}" data-setans="${p.id}:${i}"><span class="shape" aria-hidden="true">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
      : '';
    return `<div class="prow2"><span class="pnm">${nameInner}</span>${st}${betting?betCell:''}<span class="pscore">${score}</span></div>${picker}`;
  }).join('');

/* ---- lokaal ingeladen media (host) ----
   De host kan audio/afbeeldingen van de eigen schijf laden, zodat ze niet op
   GitHub hoeven. Audio speelt alleen de host af; afbeeldingen gaan via de
   state-node (als data-URI) naar de spelers. Niet gevonden? Dan valt resolveMedia
   terug op het oorspronkelijke pad, dus een GitHub-URL blijft ook werken. */
let mediaMap = {};
/* zoek de échte mediaMap-sleutel (bestandspad) die bij p hoort, of null */
function resolveMediaKey(p){
  if(!p) return null;
  if(mediaMap[p]) return p;
  for(const k in mediaMap){ if(k===p || k.endsWith('/'+p) || p.endsWith('/'+k)) return k; }
  const base = p.split('/').pop().toLowerCase();
  for(const k in mediaMap){ if(k.split('/').pop().toLowerCase()===base) return k; }
  // losse match: zelfde (sub)map + zelfde begin-token (bv "1", "5", "full").
  // Mapnaam wordt vergeleken zónder (metadata-haakjes) en leestekens, zodat bv
  // "(1974_143M_par-2)" of een ander cijfer/teken in de mapnaam de match niet breekt.
  const folderKey = s => { const a=s.split('/'); const d=(a.length>1?a[a.length-2]:''); return d.replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); };
  const tok = s => s.split('/').pop().toLowerCase().replace(/\.[^.]+$/,'').split(/[-_. ]/)[0];
  const pdir=folderKey(p), ptok=tok(p);
  if(pdir && ptok){ for(const k in mediaMap){ if(folderKey(k)===pdir && tok(k)===ptok) return k; } }
  // laatste redmiddel: mapnaam wijkt licht af (bv typefout in bandnaam). Alleen als precies één
  // kandidaat met hetzelfde begin-token een lange gemeenschappelijke voor- óf achterkant deelt.
  if(pdir && ptok){
    const affix=(a,b)=>{let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length&&j<b.length&&a[a.length-1-j]===b[b.length-1-j])j++;return Math.max(i,j);};
    const cands=[];
    for(const k in mediaMap){ if(tok(k)===ptok && affix(folderKey(k),pdir)>=10) cands.push(k); }
    if(cands.length===1) return cands[0];
  }
  return null;
}
function resolveMedia(p){
  if(!p) return p;
  const k = resolveMediaKey(p);
  return k ? mediaMap[k] : p;
}
/* instrument/laag-naam uit een bestandsnaam halen, bv "2-electric_guitar.m4a" → "Electric Guitar" */
function labelFromFile(path){
  let b = path.split('/').pop().replace(/\.[^.]+$/,'');   // bestandsnaam zonder extensie
  b = b.replace(/^\s*\d+\s*[-_.]\s*/,'');                  // leidend nummer + scheidingsteken weg
  b = b.replace(/[-_]+/g,' ').trim();
  if(!b || /^\d+$/.test(b)) return '';
  return b.split(/\s+/).map(w=> w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
/* voor audio-stages: label uit de bestandsnaam (instrument) overnemen, zodra de media geladen is */
function applyAudioLabels(){
  if(!Array.isArray(app.quiz)) return;
  app.quiz.forEach(q=>{
    if(!Array.isArray(q.stages)) return;
    q.stages.forEach(s=>{
      if(s && s.audio){
        const k = resolveMediaKey(s.audio);
        if(k){ const lbl = labelFromFile(k); if(lbl) s.label = lbl; }
      }
    });
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
}
async function loadMediaFiles(files){
  let added=0, big=0;
  for(const f of files){
    if(f.size > 8*1024*1024){ big++; continue; }              // sla heel grote bestanden over
    const key = f.webkitRelativePath || f.name;
    try{ mediaMap[key] = await fileToDataURL(f); added++; }catch(e){}
  }
  app.mediaCount = Object.keys(mediaMap).length;
  app.mediaWarn = big ? `${big} bestand(en) overgeslagen (> 8 MB).` : '';
  applyAudioLabels();                                  // instrumentnamen uit bestandsnamen
  if(app.code && Array.isArray(app.quiz)) set(quizRef(app.code), app.quiz);
  renderHost();
}
/* één map inladen: pak de JSON uit de root, laad alle media */
const SKIP_RE = /^\.|\.(json|txt|md|markdown|html?|csv|js|css|py|rb|zip|gz|tgz|rar|7z|pdf|docx?|xlsx?|pptx?|ini|yml|yaml|lock)$/i;
async function loadFolder(files){
  const arr = Array.from(files);
  const byDepth = (a,b)=> (a.webkitRelativePath||a.name).split('/').length - (b.webkitRelativePath||b.name).split('/').length;
  // root-JSON: liefst een bestand dat 'questions.json' heet, anders de ondiepste .json
  const jsons = arr.filter(f=> /\.json$/i.test(f.name||''));
  const named = jsons.filter(f=> /^questions\.json$/i.test(f.name||''));
  const jf = (named.sort(byDepth)[0]) || jsons.sort(byDepth)[0];
  // media: alles behalve het json en duidelijke niet-media (ook bestanden zónder nette extensie, bv puzzeldelen)
  let bigNames=[];
  for(const f of arr){
    if(f===jf) continue;
    const name = f.name||'';
    if(SKIP_RE.test(name)) continue;
    const isAudio = /^audio\//.test(f.type||'') || /\.(m4a|mp3|wav|ogg|oga|aac|flac|m4b)$/i.test(name);
    const cap = (isAudio ? 40 : 12) * 1024*1024;     // audio blijft host-only, dus mag groter
    if(f.size > cap){ bigNames.push(name); continue; }
    const key = f.webkitRelativePath || f.name;
    try{ mediaMap[key] = await fileToDataURL(f); }catch(e){}
  }
  app.mediaCount = Object.keys(mediaMap).length;
  app.mediaWarn = bigNames.length ? `${bigNames.length} te groot, overgeslagen: ${bigNames.slice(0,5).join(', ')}${bigNames.length>5?` (+${bigNames.length-5})`:''}` : '';
  // JSON toepassen
  if(!jf){ app.quizErr='Geen .json gevonden in de map.'; renderHost(); return; }
  let text; try{ text = await jf.text(); }catch(e){ app.quizErr='JSON kon niet gelezen worden.'; renderHost(); return; }
  let data; try{ data = JSON.parse(text); }catch(e){ app.quizErr='Ongeldige JSON: '+e.message; renderHost(); return; }
  const err = validateQuiz(data);
  if(err){ app.quizErr=err; renderHost(); return; }
  setQuiz(data, jf.name);   // roept renderHost (toont meteen ook de media-teller)
  const rep = quizMediaReport();
  app.loadInfo = { file: jf.webkitRelativePath||jf.name, count: app.quiz.length, mediaTotal: rep.total, missing: rep.missing };
  renderHost();
}
/* controleer welke door de vragenset genoemde media gekoppeld kon worden */
function quizMediaReport(){
  const folderKey = s => { const a=s.split('/'); const d=(a.length>1?a[a.length-2]:''); return d.replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); };
  const miss=[]; let total=0;
  (app.quiz||[]).forEach(q=>{
    const ps=[];
    if(q.image) ps.push(q.image);
    if(Array.isArray(q.stages)) q.stages.forEach(s=>{ if(s.image)ps.push(s.image); if(s.audio)ps.push(s.audio); });
    ps.forEach(p=>{ total++;
      if(!resolveMediaKey(p)){
        const fk = folderKey(p);
        const cands = Object.keys(mediaMap).filter(k=>folderKey(k)===fk).map(k=>k.split('/').pop());
        miss.push({ path:p, cands });
      }
    });
  });
  return { total, missing: miss };
}

    spot = `<div class="spotlight"><div class="qmeta">${meta}</div>${hostStagesHTML(r, app.stage)}</div>`;
    if(!app.checked){
      const everyonePassed = app.players.length>0 && app.players.every(p=> p.pass && p.pass[app.round]);
      controls = everyonePassed
        ? `<button class="btn big" id="b-reveal">Toon het antwoord</button>`
        : `<button class="btn big" id="b-check" ${answeredAny?'':'disabled'}>Controleer antwoorden</button>`;
    } else {
      const moreHints = app.stage < r.stages.length-1;
      controls = `${moreHints?`<button class="btn ghost" id="b-hint">Volgende hint (${app.stage+2}/${r.stages.length})</button>`:''}
                  <button class="btn big" id="b-reveal">Toon het antwoord</button>`;
    }
  } else {
    spot = `<div class="spotlight"><div class="qmeta">${r.points??100} punten</div>${imgHTML(resolveMedia(r.image))}<div class="qtext">${esc(r.question)}</div></div>`;
    controls = `<button class="btn big" id="b-reveal" ${answeredAny?'':'disabled'}>Toon het antwoord</button>`;
  }
  el.innerHTML = `
    <div class="hostgrid">
      <div class="hostmain">
        ${hostHead(app.checked?'<span class="pill ok">gecontroleerd</span>':'', true)}
        ${spot}
        ${metaHTML(r)}
        ${opts}
        ${controls}
      </div>
      ${hostAside()}
    </div>`;
  const cb=$('#b-check'); if(cb) cb.onclick=hostCheck;
  const hb=$('#b-hint'); if(hb) hb.onclick=hostNextHint;
  const rb=$('#b-reveal'); if(rb) rb.onclick=hostReveal;
  wirePlayerControls();
}
function hostRevealView(){
  const r = app.quiz[app.round];
  const res = app.results || {};
  const last = app.round===app.quiz.length-1;
  const correctLabel = r.answerLabel || (r.optionsMode==='list' && r.options ? r.options[r.answer] : '') || '';
  let grouping='';
  if(r.optionsMode==='list'){
    const namesFor = i => Object.keys(res).filter(pid=> String(res[pid].answer)===String(i)).map(pid=> app.names[pid]).filter(Boolean);
    grouping = `<div class="stack">${r.options.map((o,i)=>{
      const who = namesFor(i).map(n=>`<span class="who">${esc(n)}</span>`).join('');
      const correct = i===r.answer;
      return `<div class="ansline ${correct?'correct':'dim'}" data-c="${i}">
          <div class="ans-head"><span class="shape">${SHAPES[i]}</span><span class="otxt">${esc(o)}</span>${correct?'<span class="tag">goed</span>':''}</div>
          ${who ? `<div class="whos">${who}</div>` : ''}
        </div>`;}).join('')}</div>`;
  }
  const answered = app.players.filter(p=> res[p.id] && res[p.id].answer!=null);
  const reviewRows = answered.map(p=>{
    const rr = res[p.id];
    return `<div class="reviewrow">
      <span class="rnm">${esc(p.name)}</span>
      <span class="rguess">${esc(rr.label||'—')}${rr.gained>0?` <span class="pts">+${rr.gained}</span>`:''}</span>
      <button class="judge ${rr.correct?'jok':'jbad'}" data-judge="${p.id}">${rr.correct?'goed ✓':'fout ✗'}</button>
    </div>`;
  }).join('');
  const noAns = app.players.filter(p=> (!res[p.id] || res[p.id].answer==null) && !(res[p.id] && res[p.id].passed)).map(p=>p.name);
  const passedNames = app.players.filter(p=> res[p.id] && res[p.id].passed).map(p=>p.name);
  el.innerHTML = `
    ${hostHead('<span class="pill ok">Antwoord</span>')}
    <div class="spotlight"><div class="qmeta">Het juiste antwoord is</div><div class="qtext">${esc(correctLabel)}</div></div>
    ${grouping}
    <div class="card stack" style="gap:8px"><b>Antwoorden beoordelen</b>
      <p class="muted" style="margin:0;font-size:12px">Tik op goed/fout om handmatig te overrulen.</p>
      ${reviewRows || '<p class="muted" style="margin:0">Niemand heeft geantwoord.</p>'}</div>
    ${noAns.length?`<p class="footnote">Geen antwoord: ${noAns.map(esc).join(', ')}</p>`:''}
    ${passedNames.length?`<p class="footnote">Gepast: ${passedNames.map(esc).join(', ')}</p>`:''}
    ${leaderboardHTML(true)}
    <button class="btn big" id="b-next">${last?'Naar de eindstand':'Volgende vraag'}</button>`;
  el.querySelectorAll('[data-judge]').forEach(b=> b.onclick=()=> hostToggleCorrect(b.dataset.judge));
  $('#b-next').onclick = hostNext;
}
function hostFinal(){
  el.innerHTML = `
    <div class="center"><div class="qmeta">Dat was het</div><h1 style="font-size:clamp(32px,8vw,52px)">Eindstand</h1></div>
    ${podiumHTML()}${leaderboardHTML(false)}
    <button class="btn big" id="b-new">Nieuw spel</button>`;
  $('#b-new').onclick = hostEnd;
}
function leaderboardHTML(showGain){
  const rows = Object.keys(app.names).map(pid=>({pid,name:app.names[pid],score:app.scores[pid]||0,
    gain: app.results && app.results[pid] ? app.results[pid].gained : 0})).sort((a,b)=>b.score-a.score);
  if(!rows.length) return '';
  return `<div class="card lb">${rows.map((p,i)=>`<div class="lbrow">
      <span class="rank">${i+1}</span><span class="nm">${esc(p.name)}</span>
      ${showGain && p.gain>0?`<span class="gain">+${p.gain}</span>`:''}<span class="sc">${p.score}</span></div>`).join('')}</div>`;
}
function podiumHTML(){
  const rows = Object.keys(app.names).map(pid=>({name:app.names[pid],score:app.scores[pid]||0})).sort((a,b)=>b.score-a.score);
  if(!rows.length) return '';
  const order=[1,0,2], cls=['second','first','third'], med=['🥈','🥇','🥉'];
  return `<div class="podium">${order.map((idx,slot)=>{ const p=rows[idx]; if(!p) return '<div></div>';
    return `<div class="pcol ${cls[slot]}"><div class="medal">${med[slot]}</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}</div></div>`;}).join('')}</div>`;
}

function renderPlayer(){
  const wrap = document.querySelector('.wrap'); if(wrap) wrap.classList.remove('wide');
  if(app.kicked) return renderPlayerKicked();
  const g = app.game; if(!g) return;
  if(g.phase==='lobby')   return playerLobby();
  if(g.phase==='roundintro') return playerRoundIntro();
  if(g.phase==='question')return playerQuestion();
  if(g.phase==='reveal')  return playerReveal();
  if(g.phase==='final')   return playerFinal();
}
function renderPlayerKicked(){
  el.innerHTML = `<div class="center stack">
    <h1>Je bent uit het spel gehaald</h1>
    <p class="muted">De host heeft je verwijderd.</p>
    <button class="btn big ghost" id="b-home">Terug naar start</button></div>`;
  $('#b-home').onclick = ()=>{ app.kicked=false; resetToHome(); };
}
function playerLobby(){
