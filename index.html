/* ============================================================
   VRAAG-PREVIEW  (host- + spelerscherm, échte rendering, tijdelijk spel)
   Twee iframes van deze pagina (?preview=host / ?preview=player) draaien een mini-spel met één
   vraag: het host-iframe maakt het spel aan, het speler-iframe doet automatisch mee. Zo hergebruikt
   de preview exact de spel-rendering — wijzig je het host- of spelerdeel, dan verandert de preview mee.
   ============================================================ */
function previewEnd(){
  // tijdelijk preview-spel opruimen ZONDER de echte localStorage (quizHost) of sessie aan te raken
  try{ cleanup(); }catch(e){}
  try{ if(app.code) remove(ref(db, `games/${app.code}`)); }catch(e){}
}
async function previewHost(){
  document.body.classList.add('preview'); app.preview=true;
  window.addEventListener('message', e=>{ if(e.data && e.data.t==='qz-preview-close') previewEnd(); });
  window.addEventListener('beforeunload', previewEnd);
  let q=null; try{ q=JSON.parse(localStorage.getItem('quiz:preview')||'null'); }catch(e){}
  if(!q){ el.innerHTML=`<div class="center stack"><p class="muted">Geen vraag om te tonen.</p></div>`; return; }
  app.role='host'; app.code=genCode(); app.phase='question'; app.round=0; app.stage=0;
  app.scores={}; app.names={}; app.players=[]; app.results=null; app.judges={};
  app.openPicker=null; app.confirmKick=null; app.kicked=false; app.quizErr=''; app.loadInfo=null;
  app.judgeToken=genToken(); app.quizFromLibrary=false; app.quizName='Voorbeeld';
  const f=flattenQuiz({ rounds:[{ name:'Voorbeeld', intro:'', questions:[q] }] });
  app.quiz=applyShuffles(normalizeQuiz(f.questions)); app.rounds=f.rounds;
  initQuestion();                                            // stage/checked/betStep/preRoundScores
  set(quizRef(app.code), app.quiz); set(roundsRef(app.code), app.rounds);
  set(ref(db, `games/${app.code}/judgeToken`), app.judgeToken);
  startHost(); pushState(); renderHost();
  try{ localStorage.setItem('quiz:preview-code', app.code); }catch(e){}   // sein voor het speler-iframe
}
async function previewPlayer(){
  document.body.classList.add('preview'); app.preview=true;
  window.addEventListener('beforeunload', ()=>{ try{ cleanup(); }catch(e){} });
  el.innerHTML=`<div class="center stack"><p class="muted">Voorbeeld laden… <span class="waiting-dots"></span></p></div>`;
  let joining=false, joined=false, poll=null;
  const tryJoin=async()=>{
    if(joined||joining) return joined;
    let code=null; try{ code=localStorage.getItem('quiz:preview-code'); }catch(e){}
    if(!code) return false;
    joining=true;
    try{ joined=await playerJoin(code, 'Speler'); }catch(e){ joined=false; }
    joining=false;
    if(joined){ try{ clearSession(); }catch(e){} }            // preview heeft geen refresh-herstel nodig
    return joined;
  };
  if(await tryJoin()) return;
  // host-iframe heeft de code nog niet gepubliceerd → wachten op het storage-event (+ poll als fallback)
  const onStore=async e=>{ if(e.key==='quiz:preview-code' && e.newValue){ window.removeEventListener('storage', onStore); if(poll) clearInterval(poll); await tryJoin(); } };
  window.addEventListener('storage', onStore);
  let tries=0;
  poll=setInterval(async()=>{ if(++tries>40){ clearInterval(poll); return; } if(await tryJoin()){ clearInterval(poll); window.removeEventListener('storage', onStore); } }, 250);
}

async function boot(){
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/,''));   // ook via de hash: sommige servers strippen de querystring (clean-URL)
  const pv = hash.get('preview') || params.get('preview');
  if(pv==='host'){ await previewHost(); return; }
  if(pv==='player'){ await previewPlayer(); return; }
  const jc = params.get('judge');
  if(jc){
    el.innerHTML = `<div class="center stack"><div class="qmeta">Jurylid</div><h1>Verbinden…</h1></div>`;
    let r='err';
    try{ r = await controllerJoin(jc, params.get('t')||''); }catch(e){ r='err'; }
    if(r!=='ok'){
      const msg = r==='nogame' ? 'Geen spel gevonden met die code.'
                : r==='badtoken' ? 'Deze jurylid-link is ongeldig of verlopen. Vraag de host om een nieuwe link.'
                : 'Verbinden mislukt — check de internetverbinding.';
      el.innerHTML = `<div class="center stack"><div class="qmeta">Jurylid</div><h1>Niet gelukt</h1>
        <p class="muted">${esc(msg)}</p><button class="btn ghost" id="b-home">Naar startscherm</button></div>`;
      const hb=$('#b-home'); if(hb) hb.onclick=()=>{ history.replaceState(null,'',location.pathname); renderHome(); };
    }
    return;
  }
  // "Host deze quiz" vanaf de quizzenlijst → meteen als host de gekozen quiz starten
  if(params.get('host')==='1' || hash.get('host')==='1'){
    history.replaceState(null,'',location.pathname);   // host-vlag uit de URL (refresh herpakt via de sessie)
    let hasActive=false; try{ hasActive=!!localStorage.getItem(ACTIVE_KEY); }catch(e){}
    if(hasActive){ hostCreate(); return; }
  }
  // refresh-herstel: zat je in een spel (per-tab sessie), koppel dan terug i.p.v. naar home.
  // Uitzondering: staat er een vers gekozen quiz klaar (handoff vanaf account/quizzes/ in
  // hetzelfde tabblad), dan home tonen zodat je die kunt hosten i.p.v. het oude spel.
  let pendingQuiz=false; try{ pendingQuiz = !!localStorage.getItem(ACTIVE_KEY); }catch(e){}
  const sess = loadSession();
  if(sess && sess.code && !pendingQuiz){
    el.innerHTML = `<div class="center stack"><div class="qmeta">Even geduld</div><h1>Verbinden…</h1></div>`;
    try{
      if(sess.role==='host'){ if(await hostResume(sess.code)) return; }
      else if(sess.role==='player'){ if(await playerResume(sess.code, sess.pid, sess.name)) return; }
    }catch(e){}
    clearSession();   // spel weg of herstel mislukt → schoon naar home
  }
  renderHome();
}
boot();
</script>
