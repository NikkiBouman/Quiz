/* ============================================================
   OPEN ZOEKEN — TMDB (films) + Deezer (liedjes)
   TMDB-zoekopdrachten lopen via een Cloudflare Worker-proxy, zodat de
   TMDB-token server-side blijft en niet in deze (publieke) pagina staat.
   Worker-bron: zie tmdb-proxy/ in deze repo.
   ============================================================ */
const TMDB_PROXY = "https://quiz-tmdb-proxy.nikkibouman.workers.dev";

async function tmdbSearch(q){
  const res = await fetch(`${TMDB_PROXY}/search?query=${encodeURIComponent(q)}`, { headers:{ accept:'application/json' } });
  const data = await res.json();
  return (data.results||[]).slice(0,8).map(m=>({
    id:m.id,
    label:m.title,
    thumb:m.poster_path?`https://image.tmdb.org/t/p/w92${m.poster_path}`:null,
  }));
}
function deezerSearch(q){
  return new Promise(resolve=>{
    const cb='dz_'+Math.random().toString(36).slice(2,9);
    const s=document.createElement('script');
    const done=items=>{ try{ delete window[cb]; }catch(e){} s.remove(); resolve(items); };
    window[cb]=data=>done((data&&data.data?data.data:[]).slice(0,8).map(t=>({
      id:t.id, label:`${t.artist?t.artist.name+' – ':''}${t.title}`,
      thumb:t.album&&t.album.cover_small?t.album.cover_small:null,
      preview:t.preview||'',   // ~30s MP3-fragment (host-only afspeelbaar)
    })));
    s.onerror=()=>done([]);
    s.src=`https://api.deezer.com/search?q=${encodeURIComponent(q)}&output=jsonp&callback=${cb}&limit=8`;
    document.body.appendChild(s);
  });
}
/* Deezer album-/artiest-zoeken (JSONP) — voor antwoorden waarbij het album/de artiest geraden wordt */
function deezerSearchKind(kind, q){
  return new Promise(resolve=>{
    const cb='dz_'+Math.random().toString(36).slice(2,9);
    const s=document.createElement('script');
    const done=items=>{ try{ delete window[cb]; }catch(e){} s.remove(); resolve(items); };
    window[cb]=data=>done((data&&data.data?data.data:[]).slice(0,8).map(x=> kind==='album'
      ? { id:x.id, label:`${x.artist?x.artist.name+' – ':''}${x.title}`, thumb:x.cover_small||null }
      : { id:x.id, label:x.name, thumb:x.picture_small||null }));
    s.onerror=()=>done([]);
    s.src=`https://api.deezer.com/search/${kind}?q=${encodeURIComponent(q)}&output=jsonp&callback=${cb}&limit=8`;
    document.body.appendChild(s);
  });
}
/* alleen titels (ontdubbeld) — voor antwoord "alleen titel"; de gekozen titel is de waarde (tekst-match) */
function deezerSearchTitles(q){
  return new Promise(resolve=>{
    const cb='dz_'+Math.random().toString(36).slice(2,9);
    const s=document.createElement('script');
    const done=items=>{ try{ delete window[cb]; }catch(e){} s.remove(); resolve(items); };
    window[cb]=data=>{
      const seen=new Set(), out=[];
      (data&&data.data?data.data:[]).forEach(t=>{
        const title=(t.title||'').trim(), k=title.toLowerCase();
        if(!title||seen.has(k)) return; seen.add(k);
        out.push({ id:title, label:title, thumb:(t.album&&t.album.cover_small)||null });   // id = titel → tekst-match
      });
      done(out.slice(0,8));
    };
    s.onerror=()=>done([]);
    s.src=`https://api.deezer.com/search?q=${encodeURIComponent(q)}&output=jsonp&callback=${cb}&limit=25`;
    document.body.appendChild(s);
  });
}
async function searchOptions(mode,q){ try{ return mode==='tmdb'?await tmdbSearch(q):mode==='deezer'?await deezerSearch(q):mode==='deezertitle'?await deezerSearchTitles(q):mode==='deezeralbum'?await deezerSearchKind('album',q):mode==='deezerartist'?await deezerSearchKind('artist',q):[]; }catch(e){ return []; } }

/* ============================================================
   INGEBOUWDE VOORBEELDSET — gebruikt tot je een JSON laadt.
   Uniform schema:
   - question, points
   - options: lijst ["A","B"]  óf  ":tmdb" (films) / ":deezer" (liedjes)
   - answer: index (bij lijst) óf API-id (bij :tmdb/:deezer)
   - answerLabel: leesbaar juist antwoord (bij API aanbevolen)
   - stages: [{text?,image?,audio?,betMultiplier?}]  → gestage vraag
       betMultiplier per stage  → inzetronde
       anders pointsByStage[..]  → eerder = meer punten
   ============================================================ */
const SAMPLE = [
  { question:'Welke planeet staat het dichtst bij de zon?', points:100,
    options:['Mercurius','Venus','Mars','Aarde'], answer:0 },
  { question:'Welke studio maakte de film Spirited Away?', points:100,
    options:['Pixar','Studio Ghibli','Disney','DreamWorks'], answer:1 },
  { question:'Welke film?',
    stages:[ {text:'Animatiefilm uit 2001.'}, {text:'Gemaakt door Studio Ghibli.'}, {text:'Hoofdpersoon is een meisje genaamd Chihiro.'} ],
    options:['Spirited Away','Princess Mononoke','Ponyo','Howl\'s Moving Castle'], answer:0,
    pointsByStage:[300,200,100] },
  { question:'Welk land? (inzetronde)',
    stages:[ {text:'Ligt in Azië.', betMultiplier:3}, {text:'Bestaat uit duizenden eilanden.', betMultiplier:2},
             {text:'Bekend om sushi en anime.', betMultiplier:1.5}, {text:'De hoofdstad is Tokio.', betMultiplier:1} ],
    options:['Japan','Zuid-Korea','China','Thailand'], answer:0, points:100 },
  { question:'In welk land beklim je de berg Fuji?', points:100,
    options:['China','Japan','Zuid-Korea','Nepal'], answer:1 },
];
const SHAPES = ['▲','◆','●','■'];

/* normaliseer een vraag naar het interne model (accepteert ook {type,display}-stages en correctIndex) */
function normStage(s){
  const o={};
  if(s.type && s.display!=null){ if(s.type==='image')o.image=s.display; else if(s.type==='audio')o.audio=s.display; else if(s.type==='video')o.video=s.display; else o.text=s.display; }
  if(s.text!=null)o.text=s.text; if(s.image!=null)o.image=s.image; if(s.audio!=null)o.audio=s.audio; if(s.video!=null)o.video=s.video;
  if(s.label!=null)o.label=s.label;
  if(s.previewLabel!=null)o.previewLabel=s.previewLabel;   // categorie voor 'Hints die je gaat krijgen' (geen spoiler)
  if(s.betMultiplier!=null)o.betMultiplier=s.betMultiplier;
  if(s.clipStart!=null)o.clipStart=s.clipStart; if(s.clipEnd!=null)o.clipEnd=s.clipEnd;  // audio-fragment afspelen van … tot …
  return o;
}
/* hint-preview categorieën (mirror van lib/quiz-core.js): oudere vragen hebben geen stage.previewLabel,
   dus haal de categorie terug uit de bewaarde clue-pool (q.source.clues) via media-matching. Nooit waarde/naam. */
function clueCategory(c){
  if(!c) return '';
  if(c.kind==='fact')   return c.label||'';
  if(c.kind==='custom') return '';                          // 'Eigen' zegt niets → val terug op het mediatype
  if(c.kind==='audio')  return c.role||'Fragment';
  return c.role||'';                                        // person/image/title: rol = categorie
}
function clueMediaKey(c){
  if(!c) return '';
  if(c.kind==='audio')  return 'a:'+(c.preview||'');
  if(c.kind==='image')  return 'i:'+(c.img||'');
  if(c.kind==='person') return (c.showPhoto&&c.img) ? 'i:'+c.img
    : 't:'+[c.showName&&c.name?c.name:'', c.showRole&&c.role?c.role:''].filter(Boolean).join(' · ');
  if(c.kind==='custom'){ const t=c.mediaType||'text', url=(c.value||'').trim(); return (t!=='text'&&url) ? (t[0]+':'+url) : 't:'+(c.value||''); }
  if(c.kind==='fact')   return 't:'+`${c.label}: ${c.value}`;
  if(c.kind==='title')  return 't:'+(c.value||'');
  return '';
}
function stageMediaKey(s){
  return s.image!=null?'i:'+s.image : s.audio!=null?'a:'+s.audio : s.video!=null?'v:'+s.video : s.text!=null?'t:'+s.text : '';
}
function backfillPreviewLabels(stages, source){
  if(!Array.isArray(stages) || !source || !Array.isArray(source.clues)) return;
  if(stages.every(s=>s.previewLabel!=null)) return;
  const cat={};
  source.clues.forEach(c=>{ const k=clueMediaKey(c); if(k && cat[k]==null){ const v=clueCategory(c); if(v) cat[k]=v; } });
  stages.forEach(s=>{ if(s.previewLabel==null){ const v=cat[stageMediaKey(s)]; if(v) s.previewLabel=v; } });
}
/* standaard inzet-multipliers per stage-aantal (mirror van lib/quiz-core.js) */
function defaultBetMults(n){
  const t = {1:[1], 2:[2,1], 3:[3,2,1], 4:[3,2,1.5,1], 5:[3,2,1.5,1.25,1], 6:[3,2.5,2,1.5,1.25,1]};
  if(t[n]) return t[n];
  return Array.from({length:n}, (_,i)=> n<=1 ? 1 : Math.round((3 - 2*i/(n-1))*100)/100);
}
function normalizeQuiz(arr){
  return arr.map(q=>{
    const out = Object.assign({}, q);
    if(Array.isArray(q.stages)){
      out.stages = q.stages.map(normStage);
      backfillPreviewLabels(out.stages, q.source);   // oudere vragen (vóór previewLabel): categorie uit de clue-pool halen
    }
    if(typeof q.options==='string')        out.optionsMode = q.options===':tmdb'?'tmdb':q.options===':deezer'?'deezer':q.options===':deezer-title'?'deezertitle':q.options===':deezer-album'?'deezeralbum':q.options===':deezer-artist'?'deezerartist':q.options===':text'?'text':'list';
    else if(Array.isArray(q.options))      out.optionsMode = q.search ? 'listsearch' : 'list';   // search:true → autocomplete-veld
    else if(['tmdb','deezer','deezertitle','deezeralbum','deezerartist','text','listsearch'].includes(q.optionsMode)) out.optionsMode = q.optionsMode;   // al genormaliseerd (resume)
    else { out.optionsMode='list'; out.options = out.options||[]; }
    if(!['list','listsearch'].includes(out.optionsMode)) delete out.options;
    if(out.answer==null && q.correctIndex!=null) out.answer = q.correctIndex;
    if(Array.isArray(out.stages)){
      // inzetten is optioneel: expliciete q.bet wint; anders afleiden uit aanwezige betMultipliers
      const hasMul = out.stages.some(s=>s.betMultiplier!=null);
      const betOn = q.bet!=null ? !!q.bet : hasMul;
      if(betOn){ const dm=defaultBetMults(out.stages.length); out.betting=true; out.betMultipliers = out.stages.map((s,i)=>s.betMultiplier!=null?s.betMultiplier:dm[i]); }
      // bandle-metadata uit de mapnaam halen, bv "..._(1974_143M_par-2)/1" → jaar 1974, 143M views, par 2
      const ap = out.stages.find(s=>s.audio);
      if(ap){
        const folder = ap.audio.split('/').slice(-2,-1)[0]||'';
        const m = folder.match(/\(\s*(\d{4})\s*[_ ]\s*([\d.]+\s*[kmbKMB]?)\s*[_ ]\s*par[-_ ]*(\d+)\s*\)/);
        if(m){ if(out.year==null) out.year=+m[1]; if(out.views==null) out.views=m[2].toUpperCase().replace(/\s+/g,''); if(out.par==null) out.par=+m[3]; }
      }
    }
    if(out.answerLabel==null && ['list','listsearch'].includes(out.optionsMode) && Array.isArray(out.options) && out.options[out.answer]!=null)
      out.answerLabel = out.options[out.answer];
    if(out.optionsMode==='text' && out.answerLabel==null && out.answer!=null) out.answerLabel = String(out.answer);
    if(out.points==null) out.points = 100;
    return out;
  });
}
/* metaregel (jaar · views · moeilijkheid) voor bv bandle-vragen */
function metaHTML(r){
  const bits=[];
  if(r.year) bits.push(String(r.year));
  if(r.views) bits.push(`${r.views} views`);
  if(r.par!=null) bits.push(`par ${r.par}`);
  return bits.length ? `<div class="metarow">${bits.map(b=>`<span class="pill">${esc(b)}</span>`).join('')}</div>` : '';
}
/* info-subkop bij de vraag (jaar/genre/regisseur/… en evt. een acteurfoto). Altijd zichtbaar,
   nooit het antwoord (de editor sluit dat uit). Spiegelt factsHTML in lib/quiz-core.js. */
function factsHTML(r, isHost){
  const facts = r && Array.isArray(r.facts) ? r.facts : null;
  if(!facts || !facts.length) return '';
  const cap=f=> f.label?`<span>${esc(f.label)}</span>`:'';
  return `<div class="factsrow">${facts.map(f=>{
    // afbeelding/video zónder label = hoofdbeeld → groot; mét label = klein context-fotootje
    if(f.image) return f.label
      ? `<span class="factimg"><img src="${esc(resolveMedia(f.image))}" alt="">${cap(f)}</span>`
      : `<div class="factmain"><img class="qimg" src="${esc(resolveMedia(f.image))}" alt=""></div>`;
    if(f.video) return f.label
      ? `<span class="factimg">${videoHTML(resolveMedia(f.video))}${cap(f)}</span>`
      : `<div class="factmain">${videoHTML(resolveMedia(f.video))}</div>`;
    if(f.audio) return isHost                                  // audio speelt alleen op het hostscherm
      ? `<span class="factimg">${audioHTML(resolveMedia(f.audio))}${cap(f)}</span>`
      : `<span class="pill">🔊 ${f.label?esc(f.label):'audio'}</span>`;
    return `<span class="pill">${f.label?esc(f.label)+': ':''}${esc(f.value)}</span>`;
  }).join('')}</div>`;
}
/* tekst normaliseren voor losse antwoordvergelijking */
function normTxt(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
/* is dit antwoord goed? ondersteunt lijst/zoek (id of index), tekst, én meerdere juiste antwoorden (array) */
function isCorrectAns(r, a){
  if(a==null) return false;
  if(r.optionsMode==='text' || r.optionsMode==='deezertitle'){   // deezertitle: speler koos een titel → tekst-match
    const ok = [r.answerLabel, r.answer, ...((r.accept)||[])].filter(x=>x!=null).map(normTxt);
    return ok.includes(normTxt(a));
  }
  const ans = r.answer;
  return Array.isArray(ans) ? ans.map(String).includes(String(a)) : String(a)===String(ans);
}

/* vragenset kan plat zijn (lijst van vragen) of ingedeeld in rondes ({rounds:[{name,intro,questions:[]}]}) */
function flattenQuiz(data){
  if(Array.isArray(data)) return { questions:data.slice(), rounds:[{name:'',intro:'',start:0,end:data.length}] };
  if(data && Array.isArray(data.rounds)){
    const questions=[], rounds=[];
    data.rounds.forEach(rd=>{
      const qs = Array.isArray(rd.questions)?rd.questions:[];
      const start=questions.length;
      qs.forEach(q=>questions.push(q));
      rounds.push({ name:rd.name||'', intro:rd.intro||'', start, end:questions.length });
    });
    return { questions, rounds };
  }
  return { questions:[], rounds:[{name:'',intro:'',start:0,end:0}] };
}
/* welke ronde + positie hoort bij platte vraagindex i */
function roundCtx(i){
  const rounds = app.rounds||[];
  for(let ri=0; ri<rounds.length; ri++){
    const rd=rounds[ri];
    if(i>=rd.start && i<rd.end) return { ri, name:rd.name, intro:rd.intro, qIn:i-rd.start, qCount:rd.end-rd.start, roundCount:rounds.length, start:rd.start, end:rd.end };
  }
  return { ri:0, name:'', intro:'', qIn:i, qCount:(app.quiz||[]).length, roundCount:rounds.length||1, start:0, end:(app.quiz||[]).length };
}
/* is platte index i de eerste vraag van een ronde? */
function isRoundStart(i){ return (app.rounds||[]).some(rd=> rd.start===i && rd.end>rd.start); }

/* validatie van een geladen vragenset (plat of met rondes) */
function validateQuiz(raw){
  if(raw && !Array.isArray(raw) && Array.isArray(raw.rounds)){
    for(let ri=0; ri<raw.rounds.length; ri++){
      const rd=raw.rounds[ri];
      if(!rd || typeof rd!=='object') return `Ronde ${ri+1} is ongeldig.`;
      if(!Array.isArray(rd.questions) || !rd.questions.length) return `Ronde ${ri+1} ("${rd.name||''}") heeft geen vragen.`;
    }
  }
  const data = flattenQuiz(raw).questions;
  return validateQuestions(data);
}
function validateQuestions(data){
  if(!Array.isArray(data) || !data.length) return 'Het bestand moet een niet-lege lijst met vragen zijn.';
  for(let i=0;i<data.length;i++){
    const q=data[i], n=i+1;
    if(!q || typeof q!=='object') return `Vraag ${n} is ongeldig.`;
    const apiOpts = typeof q.options==='string' && [':tmdb',':deezer',':deezer-album',':deezer-artist'].includes(q.options);
    const textOpts = q.options===':text' || q.options===':deezer-title';   // titel-zoek matcht op tekst
    const listOpts = Array.isArray(q.options);
    if(!apiOpts && !textOpts && !listOpts) return `Vraag ${n}: 'options' moet een lijst zijn of ":tmdb"/":deezer"/":text".`;
    if(listOpts && q.options.length<2) return `Vraag ${n}: minstens 2 opties nodig.`;
    if(textOpts){
      if(q.answer==null && !q.answerLabel) return `Vraag ${n}: bij ":text" is 'answer' of 'answerLabel' nodig.`;
    } else {
      const ans = q.answer!=null ? q.answer : q.correctIndex;
      if(ans==null) return `Vraag ${n}: 'answer' ontbreekt.`;
      if(listOpts && (typeof ans!=='number' || ans<0 || ans>=q.options.length)) return `Vraag ${n}: 'answer' moet een geldige index zijn.`;
      if(apiOpts && !q.answerLabel) return `Vraag ${n}: bij ":tmdb"/":deezer" is 'answerLabel' nodig.`;
    }
    if(q.stages!=null){
      if(!Array.isArray(q.stages)||!q.stages.length) return `Vraag ${n}: 'stages' moet een niet-lege lijst zijn.`;
      for(let j=0;j<q.stages.length;j++){
        const s=q.stages[j];
        const has = s && (s.text!=null||s.image!=null||s.audio!=null||s.video!=null||(s.type&&s.display!=null));
        if(!has) return `Vraag ${n}, stage ${j+1}: heeft tekst, image, audio of video nodig.`;
      }
      if(Array.isArray(q.pointsByStage) && q.pointsByStage.length!==q.stages.length) return `Vraag ${n}: 'pointsByStage' moet even lang zijn als 'stages'.`;
    } else if(!q.question && !q.image && !q.video && !q.audio && !(Array.isArray(q.facts)&&q.facts.length)){
      return `Vraag ${n}: 'question', info of media (image/video/audio) nodig.`;
    }
  }
  return null;
}

const $ = s => document.querySelector(s);
const el = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const genId = () => 'p'+Math.random().toString(36).slice(2,9);
const genToken = () => Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
/* onthoud laatste host-code (werkt op GitHub Pages; valt stil terug indien niet beschikbaar) */
const remember = c => { try{ localStorage.setItem('quizHost', c); }catch(e){} };
const forget   = () => { try{ localStorage.removeItem('quizHost'); }catch(e){} };
const recall   = () => { try{ return localStorage.getItem('quizHost'); }catch(e){ return null; } };

/* actieve sessie onthouden zodat een refresh je niet uit het spel gooit.
   Per-tab (sessionStorage): overleeft een refresh, maar verdwijnt als je het tabblad
   sluit — dus geen 'blijf voor altijd hangen in een oud spel'. De controleur gebruikt
   hiervoor al de URL (?judge&t); host heeft daarnaast nog de losse 'Hervat quiz'-knop. */
const SESSION_KEY = 'quizSession';
const saveSession  = o => { try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); }catch(e){} };
const loadSession  = () => { try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } };
const clearSession = () => { try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} };

/* tekst naar klembord (met fallback), zonder de tekst zichtbaar te tonen */
function copyText(txt, cb){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); if(cb)cb(); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>{ if(cb)cb(); }).catch(fallback); }
  else fallback();
}

/* ============================================================
   HOST → state schrijven
   ============================================================ */
/* publiek deel van de huidige vraag dat spelers mogen zien (zonder juist antwoord, behalve bij reveal) */
function publicCurrent(){
  const r = app.quiz[app.round]; if(!r) return null;
  const staged = Array.isArray(r.stages);
  const base = { question:r.question||'', optionsMode:r.optionsMode||'list', staged, points:r.points ?? 100 };
  if(['list','listsearch'].includes(base.optionsMode)) base.options = r.options||[];
  if(r.year!=null) base.year=r.year;
  if(r.views!=null) base.views=r.views;
  if(r.par!=null) base.par=r.par;
  if(Array.isArray(r.facts)) base.facts=r.facts.map(f=>{                  // info-subkop is context, geen antwoord → altijd meesturen
    // Firebase weigert undefined: alleen gezette keys meesturen
    if(f.image){ const o={ image:resolveMedia(f.image)||'' }; if(f.label!=null) o.label=f.label; return o; }
    if(f.video){ const o={ video:resolveMedia(f.video)||'' }; if(f.label!=null) o.label=f.label; return o; }
    if(f.audio) return { value:'🔊 '+(f.label||'audio') };                // audio host-only: geen bron, alleen een pil
    const o={ value:f.value!=null?f.value:'' }; if(f.label!=null) o.label=f.label; return o;
  });
  if(!staged){
    base.image = resolveMedia(r.image) || null;
    if(r.video) base.video = resolveMedia(r.video) || null;
    // audio-prompt gaat NIET naar spelers: alleen de host speelt af
  } else {
    const reveal = app.phase==='reveal';
    base.stages = r.stages.map((s,idx)=>{
      const revealed = reveal || idx<=app.stage;
      const kind = s.audio?'audio':s.video?'video':s.image?'image':'text';
      // label: audio-labels (instrument) mogen vooraf zichtbaar zijn; andere (bv acteurnaam) pas bij onthulling — anders lekt het antwoord
      const o = { kind, label:(kind==='audio'||revealed)?(s.label||''):'', revealed };
      if(revealed){
        if(kind==='text') o.text = s.text||'';
        if(kind==='image') o.image = resolveMedia(s.image) || '';
        if(kind==='video') o.video = resolveMedia(s.video) || '';
        // audio-paden gaan NIET naar spelers: alleen de host speelt af
      }
      return o;
    });
    base.totalStages = r.stages.length;
    base.hintLabels = stageHintLabels(r.stages);   // host berekent labels uit de volledige vraag → speler ziet exact hetzelfde
    base.stage = app.stage;
    if(r.betting){ base.betting = true; base.betMultipliers = r.betMultipliers; }
    else if(r.pointsByStage){ base.points = r.pointsByStage[app.stage] ?? base.points; }
  }
  if(app.phase==='reveal'){
    base.answer = r.answer;
    base.answerLabel = r.answerLabel || (base.optionsMode==='list' && base.options ? base.options[r.answer] : '') || '';
    if(r.answerImage) base.answerImage = resolveMedia(r.answerImage) || null;
  }
  return base;
}
function pushState(){
  // per-speler oordeel over hun huidige gok (alleen zichtbaar voor spelers ná 'controleer antwoorden')
  let judged = null, bets = null;
  if(app.phase==='question'){
    const r = app.quiz[app.round];
    if(r && Array.isArray(r.stages)){
      judged = {};
      app.players.forEach(p=>{
        const a = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
        if(a!=null) judged[p.id] = effectiveCorrect(app.round, p.id, isCorrectAns(r,a));
      });
    }
    if(r && r.betting){
      bets = {};
      app.players.forEach(p=>{ if(p.bet && p.bet[app.round]!=null) bets[p.id]=p.bet[app.round]; });
    }
  }
  set(stateRef(app.code), {
    phase: app.phase, round: app.round, totalRounds: app.quiz.length, stage: app.stage,
    rc: app.round>=0 ? roundCtx(app.round) : null,
    betStep: app.betStep, checked: app.checked,
    current: (app.phase==='question'||app.phase==='reveal') ? publicCurrent() : null,
    scores: app.scores, names: app.names,
    results: app.phase==='reveal' ? app.results : null,
    judged, bets,
    answeredCount: app.answeredCount, totalPlayers: Object.keys(app.names).length, ts: Date.now(),
  });
}

/* ============================================================
   REALTIME LISTENERS (geen polling meer)
   ============================================================ */
function startHost(){
  app.unsubPlayers = onValue(playersRef(app.code), snap=>{
    const present = Object.values(snap.val() || {}).filter(p=> p && p.id && p.name);
    app.players = present;
    // namen blijven bewaard (ook als iemand wegvalt) voor scorebord
    present.forEach(p=>{ app.names[p.id]=p.name; if(!(p.id in app.scores)) app.scores[p.id]=0; });
    if(app.phase==='question'){
      app.answeredCount = present.filter(p=> p.ans && p.ans[app.round]!=null).length;
    }
    if(app.phase==='reveal') buildResults();
    pushState();
    setConn(app.code+' · '+present.length+' verbonden');
    renderHost();
  });
  // handmatige oordelen (van host of controleur) → herbereken + opnieuw tonen
  app.unsubJudges = onValue(ref(db, `games/${app.code}/judge`), snap=>{
    app.judges = snap.val() || {};
    if(app.phase==='reveal') buildResults();
    pushState();
    renderHost();
  });
}
function startPlayer(){
  app.unsubState = onValue(stateRef(app.code), snap=>{
    const v = snap.val(); if(!v) return;
    app.game = v; setConn('verbonden'); renderPlayer();
  });
  // eigen node bewaken: verdwijnt die, dan ben je door de host verwijderd
  app.unsubMe = onValue(playerRef(app.code, app.pid), snap=>{
    if(!snap.exists() && !app.kicked){ app.kicked=true; clearSession(); cleanup(); renderPlayerKicked(); }
  });
}
function cleanup(){
  if(app.unsubPlayers){ app.unsubPlayers(); app.unsubPlayers=null; }
  if(app.unsubState){ app.unsubState(); app.unsubState=null; }
  if(app.unsubMe){ app.unsubMe(); app.unsubMe=null; }
  if(app.unsubJudges){ app.unsubJudges(); app.unsubJudges=null; }
}

/* ============================================================
   HOST-ACTIES
   ============================================================ */
function hostCreate(){
  app.role='host'; app.code=genCode(); app.phase='lobby'; app.round=-1; app.stage=0;
  app.scores={}; app.names={}; app.players=[]; app.results=null;
  app.openPicker=null; app.confirmKick=null; app.kicked=false; app.quizErr='';
  app.judgeToken = genToken(); app.loadInfo=null;
  // op de quizzen-pagina gekozen quiz oppakken, anders de voorbeeldset
  const active = takeActiveQuiz();
  const src = (active && active.quiz) ? active.quiz : SAMPLE;
  const f = flattenQuiz(src);
  app.quiz = applyShuffles(normalizeQuiz(f.questions)); app.rounds = f.rounds;
  app.quizName = (active && active.name) ? active.name : 'Voorbeeldset';
  app.quizFromLibrary = !!(active && active.name);   // alleen dan kunnen we naar die quiz linken
  remember(app.code);
  saveSession({ role:'host', code:app.code });   // refresh → terug als host
  set(quizRef(app.code), app.quiz);      // vragenset bewaren voor hervatten
  set(roundsRef(app.code), app.rounds);
  set(ref(db, `games/${app.code}/judgeToken`), app.judgeToken);   // geheime sleutel voor de jurylid-link
  pushState(); startHost(); renderHost();
}
/* meerkeuzevragen met shuffle-vlag husselen: eerste optie is het juiste antwoord; bij elke
   hostsessie wordt de volgorde willekeurig en wijst 'answer' weer naar de juiste optie.
   Resume-veilig: dit draait alleen bij een verse set (setQuiz), niet bij hostResume. */
function applyShuffles(quiz){
  quiz.forEach(q=>{
    if(q.shuffle && Array.isArray(q.options) && q.options.length>1){
      const arr = Array.isArray(q.answer);                                  // meerdere juiste opties
      const correctVals = arr ? q.answer.map(i=>q.options[i]) : [q.options[q.answer!=null?q.answer:0]];
      for(let i=q.options.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [q.options[i],q.options[j]]=[q.options[j],q.options[i]]; }
      if(arr){ q.answer = correctVals.map(v=>q.options.indexOf(v)).sort((a,b)=>a-b); }
      else { q.answer = q.options.indexOf(correctVals[0]); q.answerLabel = correctVals[0]; }
    }
  });
  return quiz;
}
/* nieuwe vragenset toepassen (uit geladen JSON, plat of met rondes) */
function setQuiz(data, name){
  const f = flattenQuiz(data);
  app.quiz = applyShuffles(normalizeQuiz(f.questions)); app.rounds = f.rounds; app.quizName = name; app.quizErr='';
  applyAudioLabels();                    // instrumentnamen uit bestandsnamen overnemen (audio-stages)
  if(app.code){ set(quizRef(app.code), app.quiz); set(roundsRef(app.code), app.rounds); }
  renderHost();
}
function handleQuizFile(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data; try{ data = JSON.parse(reader.result); }
    catch(e){ app.quizErr='Ongeldige JSON: '+e.message; renderHost(); return; }
    const err = validateQuiz(data);
    if(err){ app.quizErr=err; renderHost(); return; }
    setQuiz(data, file.name);
  };
  reader.onerror = ()=>{ app.quizErr='Bestand kon niet gelezen worden.'; renderHost(); };
  reader.readAsText(file);
}

/* host hervat een lopend spel: status + vragenset terughalen uit Firebase */
async function hostResume(code){
  code = code.toUpperCase();
  const snap = await get(stateRef(code));
  if(!snap.exists()) return false;
  const s = snap.val();
  app.role='host'; app.code=code;
  app.phase  = s.phase || 'lobby';
  app.round  = (s.round!=null) ? s.round : -1;
  app.stage  = s.stage || 0;
  app.betStep = s.betStep!=null ? s.betStep : null;
  app.checked = !!s.checked;
  app.scores = s.scores || {};
  app.names  = s.names  || {};
  app.results= s.results || null;
  // oordelen terughalen + pre-ronde scores reconstrueren (scores nu = pre-ronde + winst deze ronde)
  const js = await get(ref(db, `games/${code}/judge`));
  app.judges = js.exists() ? js.val() : {};
  const tk = await get(ref(db, `games/${code}/judgeToken`));
  app.judgeToken = tk.exists() ? tk.val() : (app.judgeToken||genToken());
  if(!tk.exists()) set(ref(db, `games/${code}/judgeToken`), app.judgeToken);
  app.preRoundScores = {};
  Object.keys(app.scores).forEach(pid=>{
    const g = (app.results && app.results[pid]) ? (app.results[pid].gained||0) : 0;
    app.preRoundScores[pid] = app.scores[pid] - g;
  });
  app.players=[]; app.openPicker=null; app.confirmKick=null; app.kicked=false; app.quizErr='';
  const qs = await get(quizRef(code));
  app.quiz = normalizeQuiz(qs.exists() ? qs.val() : SAMPLE);
  const rs = await get(roundsRef(code));
  app.rounds = rs.exists() ? rs.val() : flattenQuiz(qs.exists()?qs.val():SAMPLE).rounds;
  app.quizName = qs.exists() ? 'geladen set' : 'Voorbeeldset';
  app.quizFromLibrary = false;                    // hervatte set heeft geen bekende lijst-naam
  remember(code);
  saveSession({ role:'host', code });            // refresh → terug als host
  startHost(); renderHost();
  return true;
}
/* zet de sub-stappen klaar voor een nieuwe vraag */
function initQuestion(){
  const r = app.quiz[app.round];
  app.stage=0; app.checked=false; app.answeredCount=0; app.results=null; app.confirmSkip=false; app.confirmStop=false;
  app.preRoundScores = {...app.scores};
  app.betStep = (r && r.betting) ? 'bet' : null;
}
function hostStart(){ app.round=0; app.phase='roundintro'; pushState(); renderHost(); }
function hostBeginRound(){ app.phase='question'; initQuestion(); pushState(); renderHost(); }
/* host slaat de huidige vraag over: geen punten, gewoon door (zelfde sprong als 'volgende') */
function hostSkip(){
  app.confirmSkip=false;
  if(app.round+1 < app.quiz.length){
    app.round++;
    if(isRoundStart(app.round)) app.phase='roundintro';
    else { app.phase='question'; initQuestion(); }
  }
  else app.phase='final';
  pushState(); renderHost();
}
/* punten bepalen op basis van (eventueel overrulede) correctheid */
function computeGain(r, correct, bet, lock){
  if(!correct) return { gained:0, won:false };
  if(r.betting){
    const won = bet!=null && lock!=null && lock<=bet;
    return { gained: won ? Math.round((r.points??100)*(r.betMultipliers[bet]||1)) : 0, won };
  }
  if(Array.isArray(r.stages) && r.pointsByStage){
    const st = lock!=null ? lock : r.pointsByStage.length-1;
    return { gained: r.pointsByStage[st] ?? (r.points??100), won:true };
  }
  return { gained: r.points??100, won:true };
}
/* leesbare puntenweergave bij 'controleer antwoorden'
   -> {text, kind}  kind: 'win' | 'bust' | 'open' (nog mogelijk, leeg) */
function pointsInfo(r, correct, lock, bet, stage){
  const base = r.points ?? 100;
  if(r.betting){
    if(correct){
      const won = (bet!=null && lock!=null && lock<=bet);
      if(won) return { text:`+${base} × ${r.betMultipliers[bet]||1}`, kind:'win' };
      return { text:'0', kind:'bust' };
    }
    if(bet!=null && stage>=bet) return { text:'0', kind:'bust' };  // inzet-deadline verstreken
    return { text:'', kind:'open' };                                // nog mogelijk
  }
  if(Array.isArray(r.stages) && r.pointsByStage){
    if(correct){ const p=r.pointsByStage[lock] ?? base; return { text:`+${p}`, kind:'win' }; }
    return stage>=r.stages.length-1 ? { text:'0', kind:'bust' } : { text:'', kind:'open' };
  }
  return correct ? { text:`+${base}`, kind:'win' } : { text:'0', kind:'bust' };
}
/* effectieve correctheid: handmatig oordeel (host/controleur) overruult de auto-check */
function effectiveCorrect(round, pid, auto){
  const o = app.judges && app.judges[round] ? app.judges[round][pid] : undefined;
  return (o===true||o===false) ? o : auto;
}
/* resultaten + score voor de huidige ronde (her)berekenen */
function buildResults(){
  const r = app.quiz[app.round];
  app.results = {};
  app.players.forEach(p=>{
    const a  = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
    const al = (p.anslabel && p.anslabel[app.round]!=null) ? p.anslabel[app.round] : null;
    const lock = (p.astage && p.astage[app.round]!=null) ? p.astage[app.round] : null;
    const bet  = (p.bet && p.bet[app.round]!=null) ? p.bet[app.round] : null;
    const passed = !!(p.pass && p.pass[app.round]);
    const auto = isCorrectAns(r,a);
    const correct = effectiveCorrect(app.round, p.id, auto);
    const g = computeGain(r, correct, bet, lock);
    app.results[p.id] = { answer:a, label:al, autoCorrect:auto, correct, gained:g.gained, won:g.won, bet, lock, passed };
  });
  Object.keys(app.names).forEach(pid=>{
    app.scores[pid] = (app.preRoundScores[pid]||0) + (app.results[pid] ? app.results[pid].gained : 0);
  });
}
function hostReveal(){
  const r = app.quiz[app.round];
  if(Array.isArray(r.stages)) app.stage = r.stages.length-1;   // bij onthullen alles tonen
  buildResults();
  app.phase='reveal'; pushState(); renderHost();
}
/* ---- host sub-stappen binnen een vraag ---- */
function hostRevealBets(){ app.betStep='reveal'; pushState(); renderHost(); }
function hostStartPlay(){ app.betStep='play'; app.checked=false; pushState(); renderHost(); }
function hostCheck(){ app.checked=true; pushState(); renderHost(); }
function hostNextHint(){ app.stage++; app.checked=false; pushState(); renderHost(); }
/* schrijf handmatig oordeel naar gedeelde opslag (host of controleur) */
function setJudge(round, pid, val){
  set(ref(db, `games/${app.code}/judge/${round}/${pid}`), val);
}
/* host overruled goed/fout (schrijft naar judge-opslag; listener herberekent) */
function hostToggleCorrect(pid){
  const res = app.results && app.results[pid]; if(!res) return;
  setJudge(app.round, pid, !res.correct);
}
function hostNext(){
  if(app.round+1 < app.quiz.length){
    app.round++;
    if(isRoundStart(app.round)) app.phase='roundintro';      // nieuwe ronde → eerst de uitleg
    else { app.phase='question'; initQuestion(); }
  }
  else app.phase='final';
  pushState(); renderHost();
}
async function hostEnd(){
  if(app.preview){ previewEnd(); return; }   // in preview: alleen het tijdelijke spel opruimen, niets van de echte app aanraken
  forget(); clearSession(); cleanup(); await remove(ref(db, `games/${app.code}`)); resetToHome();
}

/* host vult zelf een antwoord in namens een speler (backup) */
async function hostSetAnswer(pid, idx){
  app.openPicker=null;
  const p = app.players.find(x=>x.id===pid);   // optimistisch updaten voor snappy feedback
  if(p){ p.ans = p.ans||{}; p.ans[app.round]=idx; }
  renderHost();
  await set(ansRef(app.code, pid, app.round), idx);
}
/* host verwijdert een speler handmatig */
async function hostKick(pid){
  app.confirmKick=null; if(app.openPicker===pid) app.openPicker=null;
  app.players = app.players.filter(p=>p.id!==pid);
  delete app.names[pid]; delete app.scores[pid];
  if(app.results) delete app.results[pid];
  renderHost();
  await remove(playerRef(app.code, pid));
}

/* ============================================================
   SPELER-ACTIES
   ============================================================ */
async function playerJoin(code, name){
  app.role='player'; app.code=code.toUpperCase(); app.pid=genId(); app.name=name.trim();
  app.ans={}; app.bet={}; app.submittedRound=-1; app.sel=null;
  const snap = await get(stateRef(app.code));
  if(!snap.exists()) return false;
  const pr = playerRef(app.code, app.pid);
  await set(pr, { id:app.pid, name:app.name, ans:app.ans, seen:Date.now() });
  saveSession({ role:'player', code:app.code, pid:app.pid, name:app.name });  // refresh → zelfde speler
  startPlayer();
  return true;
}
/* speler hervat na een refresh: terugkoppelen aan dezelfde speler-node (zelfde pid → zelfde
   score en antwoorden), met de lokale voortgang opnieuw opgebouwd uit Firebase. */
async function playerResume(code, pid, name){
  code = (code||'').toUpperCase();
  if(!code || !pid) return false;
  const snap = await get(stateRef(code));
  if(!snap.exists()) return false;                          // spel bestaat niet meer → naar home
  const pSnap = await get(playerRef(code, pid));
  if(!pSnap.exists()){                                      // host heeft je verwijderd terwijl je weg was
    clearSession();
    app.role='player'; app.code=code; app.pid=pid; app.kicked=true;
    renderPlayerKicked();
    return true;
  }
  const pv = pSnap.val() || {};
  app.role='player'; app.code=code; app.pid=pid; app.name=(pv.name||name||'').trim();
  app.kicked=false; app.sel=null; app.searchPick=null; app.searchText=''; app.textAns='';
  // antwoorden / inzetten / passes / ready terughalen zodat de UI je voortgang toont
  app.ans = pv.ans || {}; app.bet = pv.bet || {}; app.passed = pv.pass || {};
  app.readyRounds = pv.ready || {};
  const round = (snap.val().round!=null) ? snap.val().round : -1;
  app.searchRound = round;                                  // voorkomt dat playerQuestion de per-ronde staat (myStage) wist
  if(pv.ans && pv.ans[round]!=null){ app.submittedRound = round; app.lastSubmitLabel = (pv.anslabel&&pv.anslabel[round])||null; }
  else app.submittedRound = -1;
  app.myStage = (pv.astage && pv.astage[round]!=null) ? pv.astage[round] : null;
  startPlayer();
  return true;
}
/* ---- controleur (jurylid): ziet antwoorden, keurt goed/fout, telt mee in de score ---- */
async function controllerJoin(code, token){
  code = code.toUpperCase();
  const snap = await get(stateRef(code));
  if(!snap.exists()) return 'nogame';
  const tk = await get(ref(db, `games/${code}/judgeToken`));
  if(!tk.exists() || String(tk.val())!==String(token||'')) return 'badtoken';
  app.role='controller'; app.code=code; app.kicked=false;
  const qs = await get(quizRef(code));
  app.quiz = normalizeQuiz(qs.exists()?qs.val():SAMPLE);
  const rs = await get(roundsRef(code));
  app.rounds = rs.exists() ? rs.val() : flattenQuiz(qs.exists()?qs.val():SAMPLE).rounds;
  app.unsubState   = onValue(stateRef(code), s=>{ app.game = s.val(); renderController(); });
  app.unsubPlayers = onValue(playersRef(code), s=>{ app.players = Object.values(s.val()||{}).filter(p=>p&&p.id&&p.name); renderController(); });
  app.unsubJudges  = onValue(ref(db,`games/${code}/judge`), s=>{ app.judges = s.val()||{}; renderController(); });
  setConn('controleur · '+code);
  renderController();
  return 'ok';
}
function renderController(){
  const wrap=document.querySelector('.wrap'); if(wrap) wrap.classList.remove('wide');
  const g = app.game;
  const rc = (g && g.rc) || {};
  const roundLbl = g && g.rc ? `Ronde ${rc.ri+1}/${rc.roundCount} · vraag ${rc.qIn+1}/${rc.qCount}` : '';
  if(!g || g.phase==='lobby' || g.phase==='final'){
    el.innerHTML = `<div class="center stack"><div class="qmeta">Controleur · ${esc(app.code||'')}</div>
      <h1>${g&&g.phase==='final'?'Het spel is afgelopen':'Wachten op het spel…'}</h1>
      <p class="muted">Je ziet hier straks alle antwoorden en inzetten.</p></div>`;
    return;
  }
  if(g.phase==='roundintro'){
    el.innerHTML = `<div class="center stack" style="gap:12px">
      <div class="qmeta">Controleur · nieuwe ronde</div>

    return;
  }
  const round = g.round, r = app.quiz[round] || {};
  // ---- inzetfase: inzetten zien én wijzigen ----
  if(g.phase==='question' && r.betting && (g.betStep==='bet' || g.betStep==='reveal')){
    const muls = r.betMultipliers||[];
    const rows = app.players.map(p=>{
      const bet = (p.bet&&p.bet[round]!=null)?p.bet[round]:null;
      const passed = !!(p.pass&&p.pass[round]);
      const btns = muls.map((m,i)=>`<button class="betmini ${bet===i?'sel':''}" data-cbet="${p.id}:${i}">${i+1}</button>`).join('');
      return `<div class="reviewrow" style="flex-wrap:wrap">
        <span class="rnm">${esc(p.name)}</span>
        <span class="rguess">${passed?'⤴ gepast':(bet!=null?`uiterlijk hint ${bet+1} (×${muls[bet]})`:'nog niet ingezet')}</span>
        <div class="betminirow">${btns}</div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div class="statusbar"><span class="pill">${esc(roundLbl)}</span><span class="pill ok">controleur · inzet</span></div>
      <div class="spotlight"><div class="qmeta">${esc(rc.name||'')}</div><div class="qtext" style="font-size:20px">${esc(r.question||'')}</div></div>
      ${metaHTML(r)}${factsHTML(r, false)}
      <div class="card stack" style="gap:8px"><b>Inzetten — zien en wijzigen</b>
        <p class="muted" style="margin:0;font-size:12px">Tik een hintnummer om iemands inzet te zetten of te corrigeren, vóórdat de vraag begint.</p>
        ${rows||'<p class="muted" style="margin:0">Nog geen spelers.</p>'}</div>`;
    el.querySelectorAll('[data-cbet]').forEach(b=> b.onclick=()=>{ const [pid,i]=b.dataset.cbet.split(':'); ctrlSetBet(pid, parseInt(i,10)); });
    return;
  }
  // ---- speel/onthul: beoordelen ----
  const correctLabel = r.answerLabel || (r.optionsMode==='list'&&r.options?r.options[r.answer]:'') || '—';
  const rows = app.players.map(p=>{
    const a = (p.ans&&p.ans[round]!=null)?p.ans[round]:null;
    const al = (p.anslabel&&p.anslabel[round]!=null)?p.anslabel[round]:null;
    const passed = !!(p.pass&&p.pass[round]);
    const auto = isCorrectAns(r,a);
    const eff = effectiveCorrect(round, p.id, auto);
    const ans = passed?'⤴ gepast':(a==null?'— nog niet':(al||String(a)));
    const dis = (a==null||passed)?'disabled':'';
    return `<div class="reviewrow">
      <span class="rnm">${esc(p.name)}</span>
      <span class="rguess">${esc(ans)}</span>
      <button class="judge ${eff?'jok':'jbad'}" data-cjudge="${p.id}" ${dis}>${eff?'goed ✓':'fout ✗'}</button>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="statusbar"><span class="pill">${esc(roundLbl)}</span><span class="pill ok">controleur</span></div>
    <div class="spotlight"><div class="qmeta">Juiste antwoord</div><div class="qtext" style="font-size:22px">${esc(correctLabel)}</div></div>

      ${rows||'<p class="muted" style="margin:0">Nog geen spelers.</p>'}</div>`;
  el.querySelectorAll('[data-cjudge]').forEach(b=> b.onclick=()=> ctrlToggle(b.dataset.cjudge));
}

function ctrlToggle(pid){

async function playerSubmit(){
  if(app.kicked) return;
  const cur = app.game.current, r = app.game.round;
  let val, label;
  if(cur.optionsMode==='list'){
    if(app.sel==null) return;
    val = app.sel; label = (cur.options||[])[app.sel];
  } else if(cur.optionsMode==='text'){
    if(!app.textAns || !app.textAns.trim()) return;
    val = app.textAns.trim(); label = val;
  } else {
    if(!app.searchPick) return;
    val = app.searchPick.id; label = app.searchPick.label;
  }
  app.ans[r] = val; app.submittedRound = r;
  app.lastSubmitLabel = label;
  await set(ansRef(app.code, app.pid, r), val);
  await set(ref(db, `games/${app.code}/players/${app.pid}/anslabel/${r}`), label||'');
  if(cur.staged){
    app.myStage = cur.stage||0;
    await set(ref(db, `games/${app.code}/players/${app.pid}/astage/${r}`), cur.stage||0);
  }
  app.sel=null; app.searchPick=null; app.searchOpen=false; app.reguess=false;
  renderPlayer();
}
async function playerBet(k){
  if(app.kicked) return;
  const r = app.game.round;
  app.bet[r] = k;
  await set(ref(db, `games/${app.code}/players/${app.pid}/bet/${r}`), k);
  renderPlayer();
}
/* PASS_ANS: sentinel die nooit als juist telt (isCorrectAns matcht 'm niet) — "pas" = fout antwoord */
const PASS_ANS = '␀pas';
async function playerPass(){
  if(app.kicked) return;
  const g = app.game, r = g.round, cur = g.current;
  app.confirmPass=false;
  // in de inzet-stap: "pas" = deze vraag niet meedoen (er is nog geen hint om te beantwoorden)
  if(cur && cur.betting && g.betStep==='bet'){
    app.passed[r]=true;
    await set(ref(db, `games/${app.code}/players/${app.pid}/pass/${r}`), true);
    renderPlayer();
    return;
  }
  // anders: "pas" telt als een fout antwoord voor deze hint; bij een volgende hint mag je opnieuw raden
  app.ans[r]=PASS_ANS; app.submittedRound=r; app.lastSubmitLabel='⤴ gepast'; app.reguess=false;
  await set(ansRef(app.code, app.pid, r), PASS_ANS);
  await set(ref(db, `games/${app.code}/players/${app.pid}/anslabel/${r}`), '⤴ gepast');
  if(cur && cur.staged){
    app.myStage = cur.stage||0;
    await set(ref(db, `games/${app.code}/players/${app.pid}/astage/${r}`), cur.stage||0);
  }
  renderPlayer();
}

function playerRowsHTML(mode){
  if(!app.players.length) return `<p class="muted">Nog niemand verbonden… <span class="waiting-dots"></span></p>`;
  const r = app.quiz[app.round];
  const kickHTML = p => app.confirmKick===p.id
    ? `<span class="kickconfirm">Verwijderen? <button class="mini danger" data-kickyes="${p.id}">Ja</button> <button class="mini" data-kickno="1">Nee</button></span>`
    : `<button class="kick" data-kick="${p.id}" title="Verwijder speler" aria-label="Verwijder ${esc(p.name)}">✕</button>`;
  if(mode==='lobby')
    return app.players.map(p=>`<div class="prow"><span class="nm">${esc(p.name)}</span>${kickHTML(p)}</div>`).join('');

  const staged = r && Array.isArray(r.stages);
  const betting = r && r.betting;
  const betsRevealed = betting && app.betStep!=='bet';   // inzetten pas zichtbaar na "Toon de inzetten"
  const canPick = mode==='question' && r && r.optionsMode==='list';
  const rows = app.players.map(p=>{
    const a = (p.ans && p.ans[app.round]!=null) ? p.ans[app.round] : null;
    const passed = !!(p.pass && p.pass[app.round]);
    const bet  = (p.bet && p.bet[app.round]!=null) ? p.bet[app.round] : null;
    const correct = a!=null && effectiveCorrect(app.round, p.id, isCorrectAns(r,a));
    const score = app.scores[p.id]||0;
    // STATUS
    let st;
    if(passed) st = `<span class="stbadge pass">⤴ gepast</span>`;
    else if(a==null) st = `<span class="stbadge wait">nadenken…</span>`;
    else if(!staged || !app.checked) st = `<span class="stbadge done">✓ geantwoord</span>`;
    else if(correct) st = `<span class="stbadge good">goed ✓</span>`;
    else st = `<span class="stbadge bad">fout ✗</span>`;
    // INZET (kolom alleen getoond bij inzetvragen; waarde pas ná de reveal)
    let betCell = '';
    if(betting){
      if(passed) betCell = '<span class="betcell">—</span>';
      else if(bet==null) betCell = '<span class="betcell">…</span>';
      else if(!betsRevealed) betCell = '<span class="betcell">✓ ingezet</span>';   // verbergen tot reveal
      else { const over = app.stage>bet && !correct; betCell = `<span class="betcell ${over?'over':''}">uiterlijk hint ${bet+1}${over?' · te laat':''}</span>`; }

    const nameInner = canPick
      ? `<button class="nm-btn" data-pick="${p.id}" aria-expanded="${app.openPicker===p.id}"><span>${esc(p.name)}</span></button>`
      : `<span>${esc(p.name)}</span>`;
    const picker = (canPick && app.openPicker===p.id)
      ? `<div class="picker">${r.options.map((o,i)=>`<button class="popt" data-c="${i}" data-setans="${p.id}:${i}"><span class="shape" aria-hidden="true">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
      : '';
    return `<div class="prow2"><span class="pnm">${nameInner}</span>${st}${betting?betCell:''}<span class="pscore">${score}</span></div>${picker}`;
  }).join('');
  const head = betting
    ? `<div class="phead"><span>Speler</span><span>Status</span><span>Inzet</span><span>Punten</span></div>`
    : `<div class="phead"><span>Speler</span><span>Status</span><span>Punten</span></div>`;

/* ---- lokaal ingeladen media (host) ----
   De host kan audio/afbeeldingen van de eigen schijf laden, zodat ze niet op
   GitHub hoeven. Audio speelt alleen de host af; afbeeldingen gaan via de
   state-node (als data-URI) naar de spelers. Niet gevonden? Dan valt resolveMedia
   terug op het oorspronkelijke pad, dus een GitHub-URL blijft ook werken. */
let mediaMap = {};
/* zoek de échte mediaMap-sleutel (bestandspad) die bij p hoort, of null */
function resolveMediaKey(p){
  if(!p) return null;
  if(mediaMap[p]) return p;
  for(const k in mediaMap){ if(k===p || k.endsWith('/'+p) || p.endsWith('/'+k)) return k; }
  const base = p.split('/').pop().toLowerCase();
  for(const k in mediaMap){ if(k.split('/').pop().toLowerCase()===base) return k; }
  // losse match: zelfde (sub)map + zelfde begin-token (bv "1", "5", "full").
  // Mapnaam wordt vergeleken zónder (metadata-haakjes) en leestekens, zodat bv
  // "(1974_143M_par-2)" of een ander cijfer/teken in de mapnaam de match niet breekt.
  const folderKey = s => { const a=s.split('/'); const d=(a.length>1?a[a.length-2]:''); return d.replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); };
  const tok = s => s.split('/').pop().toLowerCase().replace(/\.[^.]+$/,'').split(/[-_. ]/)[0];
  const pdir=folderKey(p), ptok=tok(p);
  if(pdir && ptok){ for(const k in mediaMap){ if(folderKey(k)===pdir && tok(k)===ptok) return k; } }
  // laatste redmiddel: mapnaam wijkt licht af (bv typefout in bandnaam). Alleen als precies één
  // kandidaat met hetzelfde begin-token een lange gemeenschappelijke voor- óf achterkant deelt.
  if(pdir && ptok){
    const affix=(a,b)=>{let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length&&j<b.length&&a[a.length-1-j]===b[b.length-1-j])j++;return Math.max(i,j);};
    const cands=[];
    for(const k in mediaMap){ if(tok(k)===ptok && affix(folderKey(k),pdir)>=10) cands.push(k); }
    if(cands.length===1) return cands[0];
  }
  return null;
}
function resolveMedia(p){
  if(!p) return p;
  const k = resolveMediaKey(p);
  return k ? mediaMap[k] : p;
}
/* instrument/laag-naam uit een bestandsnaam halen, bv "2-electric_guitar.m4a" → "Electric Guitar" */
function labelFromFile(path){
  let b = path.split('/').pop().replace(/\.[^.]+$/,'');   // bestandsnaam zonder extensie
  b = b.replace(/^\s*\d+\s*[-_.]\s*/,'');                  // leidend nummer + scheidingsteken weg
  b = b.replace(/[-_]+/g,' ').replace(/\s*\+\s*/g,' + ').trim();
  if(!b || /^\d+$/.test(b)) return '';
  return b.split(/\s+/).map(w=> w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
}
/* voor audio-stages: label uit de bestandsnaam (instrument) overnemen, zodra de media geladen is */
function applyAudioLabels(){
  if(!Array.isArray(app.quiz)) return;
  app.quiz.forEach(q=>{
    if(!Array.isArray(q.stages)) return;
    q.stages.forEach(s=>{
      if(s && s.audio){
        const k = resolveMediaKey(s.audio);
        if(k){ const lbl = labelFromFile(k); if(lbl) s.label = lbl; }
      }
    });
  });
}
function fileToDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(file); });
}
async function loadMediaFiles(files){
  let added=0, big=0;
  for(const f of files){
    if(f.size > 8*1024*1024){ big++; continue; }              // sla heel grote bestanden over
    const key = f.webkitRelativePath || f.name;
    try{ mediaMap[key] = await fileToDataURL(f); added++; }catch(e){}
  }
  app.mediaCount = Object.keys(mediaMap).length;
  app.mediaWarn = big ? `${big} bestand(en) overgeslagen (> 8 MB).` : '';
  applyAudioLabels();                                  // instrumentnamen uit bestandsnamen
  if(app.code && Array.isArray(app.quiz)) set(quizRef(app.code), app.quiz);
  renderHost();
}
/* één map inladen: pak de JSON uit de root, laad alle media */
const SKIP_RE = /^\.|\.(json|txt|md|markdown|html?|csv|js|css|py|rb|zip|gz|tgz|rar|7z|pdf|docx?|xlsx?|pptx?|ini|yml|yaml|lock)$/i;
async function loadFolder(files){
  const arr = Array.from(files);
  const byDepth = (a,b)=> (a.webkitRelativePath||a.name).split('/').length - (b.webkitRelativePath||b.name).split('/').length;
  // root-JSON: liefst een bestand dat 'questions.json' heet, anders de ondiepste .json
  const jsons = arr.filter(f=> /\.json$/i.test(f.name||''));
  const named = jsons.filter(f=> /^questions\.json$/i.test(f.name||''));
  const jf = (named.sort(byDepth)[0]) || jsons.sort(byDepth)[0];
  // media: alles behalve het json en duidelijke niet-media (ook bestanden zónder nette extensie, bv puzzeldelen)
  let bigNames=[];
  for(const f of arr){
    if(f===jf) continue;
    const name = f.name||'';
    if(SKIP_RE.test(name)) continue;
    const isAudio = /^audio\//.test(f.type||'') || /\.(m4a|mp3|wav|ogg|oga|aac|flac|m4b)$/i.test(name);
    const cap = (isAudio ? 40 : 12) * 1024*1024;     // audio blijft host-only, dus mag groter
    if(f.size > cap){ bigNames.push(name); continue; }
    const key = f.webkitRelativePath || f.name;
    try{ mediaMap[key] = await fileToDataURL(f); }catch(e){}
  }
  app.mediaCount = Object.keys(mediaMap).length;
  app.mediaWarn = bigNames.length ? `${bigNames.length} te groot, overgeslagen: ${bigNames.slice(0,5).join(', ')}${bigNames.length>5?` (+${bigNames.length-5})`:''}` : '';
  // JSON toepassen
  if(!jf){ app.quizErr='Geen .json gevonden in de map.'; renderHost(); return; }
  let text; try{ text = await jf.text(); }catch(e){ app.quizErr='JSON kon niet gelezen worden.'; renderHost(); return; }
  let data; try{ data = JSON.parse(text); }catch(e){ app.quizErr='Ongeldige JSON: '+e.message; renderHost(); return; }
  const err = validateQuiz(data);
  if(err){ app.quizErr=err; renderHost(); return; }
  setQuiz(data, jf.name);   // roept renderHost (toont meteen ook de media-teller)
  const rep = quizMediaReport();
  app.loadInfo = { file: jf.webkitRelativePath||jf.name, count: app.quiz.length, mediaTotal: rep.total, missing: rep.missing };
  renderHost();
}
/* controleer welke door de vragenset genoemde media gekoppeld kon worden */
function quizMediaReport(){
  const folderKey = s => { const a=s.split('/'); const d=(a.length>1?a[a.length-2]:''); return d.replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z0-9]+/g,''); };
  const miss=[]; let total=0;
  (app.quiz||[]).forEach(q=>{
    const ps=[];
    if(q.image) ps.push(q.image);
    if(Array.isArray(q.stages)) q.stages.forEach(s=>{ if(s.image)ps.push(s.image); if(s.audio)ps.push(s.audio); });
    ps.forEach(p=>{ total++;
      if(!resolveMediaKey(p)){
        const fk = folderKey(p);
        const cands = Object.keys(mediaMap).filter(k=>folderKey(k)===fk).map(k=>k.split('/').pop());
        miss.push({ path:p, cands });
      }
    });
  });
  return { total, missing: miss };
}

const imgHTML = src => src ? `<img class="qimg" src="${esc(src)}" alt="">` : '';
/* audio met optioneel clip-venster: start/end (sec) komen als data-attrs mee en
   worden na het renderen afgedwongen door wireClips() (spoel naar start, stop bij end) */
const audioHTML = (src, start, end) => src ? `<audio class="qaudio" controls preload="none" src="${esc(src)}"${start!=null?` data-clip-start="${+start||0}"`:''}${end!=null?` data-clip-end="${+end}"`:''}></audio>` : '';
const videoHTML = src => src ? `<video class="qimg" controls preload="metadata" playsinline src="${esc(src)}"></video>` : '';
/* media van een niet-gestage vraag (host krijgt audio, speler niet) */
function qMediaHTML(r, isHost){
  return `${imgHTML(resolveMedia(r.image))}${videoHTML(resolveMedia(r.video))}${isHost?audioHTML(resolveMedia(r.audio), r.clipStart, r.clipEnd):''}`;
}
/* dwingt het clip-venster af op alle geclipte <audio> in de huidige render:
   bij play naar de start spoelen, en bij het bereiken van end pauzeren + terug naar start
   (zodat opnieuw afspelen weer bij de start begint). Alleen op het hostscherm. */
function wireClips(root){
  (root||el).querySelectorAll('audio.qaudio').forEach(a=>{
    const ds=a.dataset;
    if(ds.clipStart==null && ds.clipEnd==null) return;
    const start=Math.max(0, parseFloat(ds.clipStart)||0);
    const end=(ds.clipEnd!=null && ds.clipEnd!=='') ? parseFloat(ds.clipEnd) : null;
    a.addEventListener('play', ()=>{ if(a.currentTime<start || (end!=null && a.currentTime>=end)){ try{ a.currentTime=start; }catch(e){} } });
    a.addEventListener('timeupdate', ()=>{ if(end!=null && a.currentTime>=end){ a.pause(); try{ a.currentTime=start; }catch(e){} } });
  });
}
function clueListHTML(stages){
  return `<div class="clues">${stages.map((s,idx)=>`<div class="clue"><span class="cnum">${idx+1}</span>
    <div class="cbody">${imgHTML(s.image)}${audioHTML(s.audio, s.clipStart, s.clipEnd)}${s.text?`<div class="qtext sm">${esc(s.text)}</div>`:''}</div></div>`).join('')}</div>`;
}
/* één stage-rij; isHost bepaalt of audio afspeelbaar is */
function stageRowHTML(kind, label, idx, cur, revealed, media, isHost, clipStart, clipEnd){
  const isCur = idx===cur;
  let body;
  if(kind==='audio'){
    body = `<span class="slabel">${esc(label||('Fragment '+(idx+1)))}</span>${isCur?'<span class="nowtag">▶ nu</span>':''}`;
    if(isHost && revealed) body += audioHTML(media, clipStart, clipEnd);
  } else if(kind==='image'){
    body = revealed ? imgHTML(media)+(label?`<div class="slabel">${esc(label)}</div>`:'') : `<span class="slocked">nog niet getoond</span>`;
  } else if(kind==='video'){
    body = revealed ? videoHTML(media)+(label?`<div class="slabel">${esc(label)}</div>`:'') : `<span class="slocked">nog niet getoond</span>`;
  } else {
    body = revealed ? `<div class="qtext sm">${esc(media||'')}</div>` : `<span class="slocked">nog niet getoond</span>`;
  }
  const cls = `stagerow ${isCur?'cur':''} ${revealed?'':'dim'}`;
  return `<div class="${cls}"><span class="cnum">${idx+1}</span><div class="cbody">${body}</div></div>`;
}
/* host: echte stages (incl. audio om af te spelen) */
function hostStagesHTML(r, cur){
  return `<div class="stagelist">${r.stages.map((s,idx)=>{
    const kind = s.audio?'audio':s.video?'video':s.image?'image':'text';
    const revealed = idx<=cur;
    const media = kind==='audio'?resolveMedia(s.audio):kind==='video'?resolveMedia(s.video):kind==='image'?resolveMedia(s.image):s.text;
    return stageRowHTML(kind, s.label, idx, cur, revealed, media, true, s.clipStart, s.clipEnd);
  }).join('')}</div>`;
}
/* speler: stage-meta uit state (geen audio-paden) */
/* lijst met hint-namen (vooraf zichtbaar, bv bij inzetten).
   één bron van waarheid: stages → labels. De host berekent dit uit de volledige vraag en stuurt
   exact dezelfde lijst mee in publicCurrent(), zodat host en speler hetzelfde zien.
   Toon alleen de categorie (previewLabel) of het type — nooit de waarde/naam (geen spoiler).
   audio-labels (instrument) zijn wél bedoeld vooraf zichtbaar. */
function stageHintLabels(stages){
  if(!Array.isArray(stages)) return [];
  return stages.map((s,i)=> s.previewLabel
    || (s.audio ? (s.label||('Fragment '+(i+1)))
      : s.image ? 'Foto'
      : s.video ? 'Video'
      : ('Hint '+(i+1))));
}
function hintLabelsHTML(labels){
  if(!labels || !labels.length) return '';
  return `<div class="hintlist">${labels.map((lbl,i)=>
    `<div class="hintlabel"><span class="cnum">${i+1}</span><span>${esc(lbl)}</span></div>`
  ).join('')}</div>`;
}
function playerStagesHTML(c){
  const cur = c.stage||0;
  return `<div class="stagelist">${(c.stages||[]).map((s,idx)=>{
    const media = s.kind==='image'?s.image:s.kind==='video'?s.video:s.kind==='text'?s.text:null;
    return stageRowHTML(s.kind, s.label, idx, cur, !!s.revealed, media, false);
  }).join('')}</div>`;
}

function hostQuestion(){
  const r = app.quiz[app.round];
  const staged = Array.isArray(r.stages);
  const betting = !!r.betting;

  // ---- INZET: stap 1 — wachten tot iedereen heeft gewed ----
  if(betting && app.betStep==='bet'){
    const placed = app.players.filter(p=> p.bet && p.bet[app.round]!=null).length;
    const passed = app.players.filter(p=> p.pass && p.pass[app.round]).length;
    el.innerHTML = `
      <div class="hostgrid">
        <div class="hostmain">
          ${hostHead('<span class="pill">inzetten</span>', true)}
          <div class="spotlight"><div class="qmeta">inzetronde</div><div class="qtext">${esc(r.question||'')}</div></div>
          ${metaHTML(r)}${factsHTML(r, true)}
          <div class="pointsbig">Deze vraag is <b>${r.points??100}</b> punten waard <span>× inzet</span></div>
          <div class="card stack" style="gap:8px"><b>Hints die je gaat krijgen</b>${hintLabelsHTML(stageHintLabels(r.stages))}</div>
          <p class="muted center">${placed}/${app.players.length} ingezet${passed?` · ${passed} gepast`:''}</p>
          <button class="btn big" id="b-revealbets" ${(placed||passed)?'':'disabled'}>Toon de inzetten</button>
        </div>
        ${hostAside()}
      </div>`;
    $('#b-revealbets').onclick = hostRevealBets;
    wirePlayerControls();
    return;
  }
  // ---- INZET: stap 2 — inzetten tonen, daarna de vraag starten ----
  if(betting && app.betStep==='reveal'){
    const entries = app.players.map(p=>({ name:p.name, bet:(p.bet&&p.bet[app.round]!=null)?p.bet[app.round]:null }));
    el.innerHTML = `
      <div class="hostgrid">
        <div class="hostmain">
          ${hostHead('<span class="pill ok">inzetten</span>', true)}
          <div class="spotlight"><div class="qmeta">${esc(r.question||'')}</div><div class="qtext" style="font-size:24px">De inzetten</div></div>
          ${betOverviewHTML(entries, r.betMultipliers)}
          <button class="btn big" id="b-startplay">Start de vraag</button>
        </div>
        ${hostAside()}
      </div>`;
    $('#b-startplay').onclick = hostStartPlay;
    wirePlayerControls();
    return;
  }

  // ---- SPELEN ----
  const answeredAny = app.players.some(p=> p.ans && p.ans[app.round]!=null);
  // "toon antwoord" is pas blauw (uitnodigend) als IEDEREEN (die niet past) het goed heeft; anders gedempt
  const activeP = app.players.filter(p=> !(p.pass && p.pass[app.round]));
  const everyoneCorrect = activeP.length>0
    && activeP.every(p=> p.ans && p.ans[app.round]!=null)
    && activeP.every(p=> effectiveCorrect(app.round, p.id, isCorrectAns(r, p.ans[app.round])));
  const revealCls = everyoneCorrect ? 'btn big' : 'btn ghost big';
  const opts = r.optionsMode==='list'
    ? `<div class="answers">${r.options.map((o,i)=>`<div class="ans dim" data-c="${i}" aria-hidden="true"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>`
    : `<p class="muted center" style="font-size:13px">${r.optionsMode==='text'?'Spelers typen zelf het antwoord':r.optionsMode==='listsearch'?'Spelers zoeken in de lijst via de zoekbalk':r.optionsMode==='tmdb'?'Zoek een film via de zoekbalk':r.optionsMode==='deezertitle'?'Zoek een titel via de zoekbalk':r.optionsMode==='deezeralbum'?'Zoek een album via de zoekbalk':r.optionsMode==='deezerartist'?'Zoek een artiest via de zoekbalk':'Zoek een nummer via de zoekbalk'}.</p>`;
  let spot, controls;
  if(staged){
    const meta = betting ? `${esc(r.question||'')} · inzetronde`
                         : `${esc(r.question||'')} · nu ${(r.pointsByStage||[])[app.stage] ?? (r.points??100)} punten`;
    spot = `<div class="spotlight"><div class="qmeta">${meta}</div>${hostStagesHTML(r, app.stage)}</div>`;
    if(!app.checked){
      const everyonePassed = app.players.length>0 && app.players.every(p=> p.pass && p.pass[app.round]);
      controls = everyonePassed
        ? `<button class="${revealCls}" id="b-reveal">Toon het antwoord</button>`
        : `<button class="btn big" id="b-check" ${answeredAny?'':'disabled'}>Controleer antwoorden</button>`;
    } else {
      const moreHints = app.stage < r.stages.length-1;
      controls = `${moreHints?`<button class="btn big" id="b-hint">Volgende hint (${app.stage+2}/${r.stages.length})</button>`:''}
                  <button class="${revealCls}" id="b-reveal">Toon het antwoord</button>`;
    }
  } else {
    spot = `<div class="spotlight"><div class="qmeta">${r.points??100} punten</div>${qMediaHTML(r, true)}<div class="qtext">${esc(r.question)}</div></div>`;
    controls = `<button class="${revealCls}" id="b-reveal" ${answeredAny?'':'disabled'}>Toon het antwoord</button>`;
  }
  el.innerHTML = `
    <div class="hostgrid">
      <div class="hostmain">
        ${hostHead(app.checked?'<span class="pill ok">gecontroleerd</span>':'', true)}
        ${spot}
        ${metaHTML(r)}${factsHTML(r, true)}
        ${opts}
        ${controls}
      </div>
      ${hostAside()}
    </div>`;
  const cb=$('#b-check'); if(cb) cb.onclick=hostCheck;
  const hb=$('#b-hint'); if(hb) hb.onclick=hostNextHint;
  const rb=$('#b-reveal'); if(rb) rb.onclick=hostReveal;
  wirePlayerControls();
  wireClips();
}

}
function podiumHTML(){
  const rows = Object.keys(app.names).map(pid=>({name:app.names[pid],score:app.scores[pid]||0})).sort((a,b)=>b.score-a.score);
  if(!rows.length) return '';
  const order=[1,0,2], cls=['second','first','third'], med=['🥈','🥇','🥉'];
  return `<div class="podium">${order.map((idx,slot)=>{ const p=rows[idx]; if(!p) return '<div></div>';
    return `<div class="pcol ${cls[slot]}"><div class="medal">${med[slot]}</div><div class="nm">${esc(p.name)}</div><div class="sc">${p.score}</div></div>`;}).join('')}</div>`;

function renderPlayer(){
  const wrap = document.querySelector('.wrap'); if(wrap) wrap.classList.remove('wide');
  if(app.kicked) return renderPlayerKicked();
  const g = app.game; if(!g) return;
  if(g.phase==='lobby')   return playerLobby();
  if(g.phase==='roundintro') return playerRoundIntro();
  if(g.phase==='question')return playerQuestion();
  if(g.phase==='reveal')  return playerReveal();
  if(g.phase==='final')   return playerFinal();
}
function renderPlayerKicked(){

function searchOutHTML(){
  // ingeklapt na een keuze: toon alleen het gekozen antwoord
  if(!app.searchOpen){
    return app.searchPick
      ? `<div class="picked">Gekozen: <b>${esc(app.searchPick.label)}</b> <span class="muted" style="font-size:12px">— tik in het veld om te wijzigen</span></div>`

function wireSearchResults(){
  el.querySelectorAll('.sresult').forEach(b=> b.onclick=()=>{
    const id=b.dataset.id, n=Number(id);
    app.searchPick = { id:(id!==''&&!isNaN(n))?n:id, label:b.dataset.label };
    app.searchOpen = false;            // na keuze inklappen
    renderPlayer();
  });
}
function refreshSearchOut(){ const out=el.querySelector('#sout'); if(out){ out.innerHTML=searchOutHTML(); wireSearchResults(); } }
function wireAnswerArea(r){
  if(r.optionsMode==='list'){
    el.querySelectorAll('.ans').forEach(b=> b.onclick=()=>{ app.sel=parseInt(b.dataset.i,10); renderPlayer(); });
    return;
  }
  if(r.optionsMode==='text'){
    const ti=$('#t-input');
    if(ti){
      ti.oninput=()=>{ app.textAns=ti.value; const b=$('#b-submit'); if(b) b.disabled = !ti.value.trim(); };
      ti.focus(); const L=ti.value.length; try{ ti.setSelectionRange(L,L); }catch(e){}
    }
    return;
  }
  if(r.optionsMode==='listsearch'){
    const inp=$('#s-input');
    const all = ()=> (r.options||[]).map((o,i)=>({id:i,label:o}));
    if(inp){
      inp.onfocus=()=>{ if(!app.searchOpen){ app.searchOpen=true; if(!app.searchResults.length) app.searchResults=all(); refreshSearchOut(); } };
      inp.oninput=()=>{
        app.searchText=inp.value; app.searchOpen=true;
        const ql=inp.value.trim().toLowerCase();
        app.searchResults = all().filter(x=> !ql || x.label.toLowerCase().includes(ql)).slice(0,40);
        app.searchBusy=false; refreshSearchOut();
      };
      if(app.searchOpen){ inp.focus(); const L=inp.value.length; try{ inp.setSelectionRange(L,L); }catch(e){} }
    }
    refreshSearchOut();
    return;
  }
  const inp = $('#s-input');
  if(inp){
    inp.onfocus = ()=>{ if(!app.searchOpen){ app.searchOpen=true; refreshSearchOut(); } };
    inp.oninput = ()=>{
      app.searchText = inp.value;
      app.searchOpen = true;
      clearTimeout(app._sTimer);
      const q = inp.value.trim();
      if(q.length<2){ app.searchResults=[]; app.searchBusy=false; refreshSearchOut(); return; }
      app._sTimer = setTimeout(async ()=>{
        app.searchBusy=true; refreshSearchOut();
        const res = await searchOptions(r.optionsMode, q);
        app.searchBusy=false; app.searchResults=res; refreshSearchOut();
      }, 300);
    };
    if(app.searchOpen){ inp.focus(); const L=inp.value.length; try{ inp.setSelectionRange(L,L); }catch(e){} }
  }
  refreshSearchOut();
}

function playerQuestion(){
  const g = app.game;
  const r = g.current;
  // nieuwe ronde → staat resetten
  if(app.searchRound!==g.round){
    app.searchRound=g.round; app.searchText=''; app.searchResults=[]; app.searchPick=null;
    app.searchBusy=false; app.sel=null; app.searchOpen=false; app.myStage=null; app.textAns='';
    app.reguess=false; app.forFun=false; app.confirmPass=false;
    app.wrongGuesses[g.round]=[]; app.lastSubmitLabel=null;
  }

  // gepast?
  if(app.passed[g.round]) return playerPassed();

  // ---- INZET: stap 1 — inzetten ----
  if(r.betting && g.betStep==='bet'){
    if(app.bet[g.round]==null){
      const base = r.points ?? 100;
      const spot = `<div class="spotlight"><div class="qmeta">${base} punten × je inzet</div><div class="qtext">${esc(r.question||'')}</div></div>`;
      const bets = (r.betMultipliers||[]).map((m,i)=>`<button class="betopt" data-bet="${i}"><span>Hint ${i+1}</span><span class="mult">×${m}</span></button>`).join('');
      el.innerHTML = `
        <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill">inzet</span></div>
        ${spot}
        ${metaHTML(r)}${factsHTML(r, false)}
        <div class="pointsbig">Deze vraag is <b>${base}</b> punten waard <span>× je inzet</span></div>
        <div class="card stack" style="gap:8px">
          <b>Hints die je gaat krijgen</b>
          ${hintLabelsHTML(r.hintLabels)}
        </div>
        <div class="card stack" style="gap:10px">
          <b>Bij welke hint denk je het uiterlijk te weten?</b>
          <p class="muted" style="margin:0;font-size:13px">Zet in op wanneer jij denkt het antwoord te weten. Hoe meer risico je neemt, hoe hoger de beloning. Maar let op: heb je het niet uiterlijk bij die hint goed? Dan krijg je 0 punten voor deze vraag!</p>
          <div class="bets">${bets}</div>
        </div>
        ${passBtnHTML}${passModalHTML()}`;
      el.querySelectorAll('[data-bet]').forEach(b=> b.onclick=()=> playerBet(parseInt(b.dataset.bet,10)));
      wirePass();
      return;
    }
    const m=(r.betMultipliers||[])[app.bet[g.round]];
    return playerHold('betwait', `Je inzet: hint ${app.bet[g.round]+1} (×${m}) — wachten tot iedereen heeft ingezet`);
  }
  // ---- INZET: stap 2 — inzetten van iedereen tonen ----
  if(r.betting && g.betStep==='reveal'){
    const entries = Object.keys(g.names||{}).map(pid=>({ name:g.names[pid], bet:(g.bets&&g.bets[pid]!=null)?g.bets[pid]:null }));
    el.innerHTML = `
      <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill ok">inzetten</span></div>
      <div class="spotlight"><div class="qmeta">${esc(r.question||'')}</div><div class="qtext" style="font-size:22px">De inzetten</div></div>
      ${betOverviewHTML(entries, r.betMultipliers)}
      <p class="footnote">Wachten tot de host de vraag start <span class="waiting-dots"></span></p>`;
    return;
  }

  // ---- SPELEN: al iets ingestuurd? ----
  if(app.submittedRound===g.round){
    if(!r.staged) return playerWaiting();
    const advanced = (g.stage||0) > (app.myStage||0);
    if(!advanced){
      if(!g.checked) return playerHold('hold');                 // wacht op 'controleer antwoorden'
      const verdict = g.judged ? g.judged[app.pid] : undefined;
      if(verdict===true) return playerHold('correct', winNote(r,g));
      const pi = pointsInfo(r, false, app.myStage, app.bet[g.round], g.stage);
      return pi.kind==='bust' ? playerHold('bust') : playerHold('wronghint');
    }
    // nieuwe hint: goed = vergrendeld blijven, fout = opnieuw raden
    const verdict = g.judged ? g.judged[app.pid] : undefined;
    if(verdict===true) return playerHold('correct', winNote(r,g));
    // fout + nieuwe hint → opnieuw raden; pas 'voor de lol' als de hint voorbij je inzet is
    const bet = app.bet[g.round];
    const busted = r.betting && bet!=null && (g.stage > bet);
    if(app.lastSubmitLabel){ app.wrongGuesses[g.round]=app.wrongGuesses[g.round]||[]; app.wrongGuesses[g.round].push(app.lastSubmitLabel); app.lastSubmitLabel=null; }
    app.submittedRound=-1; app.sel=null; app.searchPick=null; app.searchText=''; app.textAns='';
    app.searchResults=[]; app.searchOpen=false; app.reguess=true; app.forFun=busted;
  }

  // ---- antwoord-UI ----
  let spot, pill;
  if(r.staged){
    if(r.betting){
      const bi = app.bet[g.round];
      const m = bi!=null ? (r.betMultipliers||[])[bi] : null;
      const betTxt = bi!=null ? `inzet uiterlijk hint ${bi+1} (×${m})` : 'geen inzet';
      spot = `<div class="spotlight"><div class="qmeta">${esc(r.question||'')} · ${betTxt}</div>${playerStagesHTML(r)}</div>`;
      pill = bi!=null ? `×${m}` : 'voor de lol';
    } else {
      spot = `<div class="spotlight"><div class="qmeta">${esc(r.question||'')} · nu ${r.points} punten</div>${playerStagesHTML(r)}</div>`;
      pill = `${r.points} punten`;
    }
  } else {
    spot = `<div class="spotlight">${imgHTML(r.image)}${videoHTML(r.video)}<div class="qtext">${esc(r.question)}</div></div>`;
    pill = `${r.points} punten`;
  }
  const wrongs = (app.wrongGuesses&&app.wrongGuesses[g.round])||[];
  const funBanner = app.forFun
    ? `<div class="card funbanner"><b>Je speelt voor de lol 🎈</b> <span class="muted">Je inzet is verlopen, dit levert geen punten meer op — maar raad gerust mee!</span></div>`
    : (wrongs.length ? `<div class="wronglist"><span class="wl-h">Foute gokken:</span> ${wrongs.map(w=>`<span class="wl-chip">${esc(w)}</span>`).join('')}</div>` : '');
  const lockReady = r.optionsMode==='list' ? app.sel!=null : r.optionsMode==='text' ? !!(app.textAns&&app.textAns.trim()) : app.searchPick!=null;
  const btn = r.staged ? 'Antwoord vergrendelen' : 'Antwoord bevestigen';
  el.innerHTML = `
    <div class="statusbar"><span class="pill">${pRoundLbl()}</span><span class="pill">${pill}</span></div>
    ${spot}
    ${metaHTML(r)}${factsHTML(r, false)}
    ${funBanner}
    ${answerAreaHTML(r)}
    <button class="btn big" id="b-submit" ${lockReady?'':'disabled'}>${btn}</button>
    ${passBtnHTML}${passModalHTML()}`;
  wireAnswerArea(r);
  $('#b-submit').onclick = playerSubmit;
  wirePass();
}

  const pi = pointsInfo(r, true, app.myStage, app.bet[g.round], g.stage);
  return pi.kind==='win' ? `${pi.text} punten — wachten op de host` : 'Maar 0 punten (te laat voor je inzet) — voor de lol meegespeeld';

function playerWaiting(){

function playerHold(kind, note){
  const g=app.game;
  let head, sub, color='';
  if(kind==='correct'){ head='Goed geraden! ✓'; color='var(--groen)'; sub=note||'Wachten op de host'; }
  else if(kind==='wronghint'){ head='Helaas, fout'; color='var(--rood)'; sub='Wacht op de volgende hint.'; }
  else if(kind==='bust'){ head='Helaas, fout'; color='var(--rood)'; sub='0 punten — je inzet is verlopen. Je mag straks nog voor de lol meeraden.'; }
  else if(kind==='betwait'){ head='Je inzet staat ✓'; sub=note||'Wachten tot iedereen heeft gewed'; }
  else { head='Antwoord binnen ✓'; sub='Wachten op de controle'; }
  const hStyle = color?` style="color:${color}"`:'';
  el.innerHTML = `<div class="center stack"><div class="qmeta">${pRoundLbl()}</div>
    <h1${hStyle}>${head}</h1><p class="muted">${esc(sub)} <span class="waiting-dots"></span></p></div>`;
}
function allGuessesHTML(){
  const g=app.game; const res=g.results||{}; const names=g.names||{};
  const ids=Object.keys(res).filter(pid=> res[pid] && res[pid].answer!=null && !res[pid].passed);
  if(!ids.length) return '';
  ids.sort((a,b)=> (res[b].correct?1:0)-(res[a].correct?1:0));
  const rows=ids.map(pid=>{
    const rr=res[pid]; const me=pid===app.pid?' me':'';
    return `<div class="reviewrow${me}"><span class="rnm">${esc(names[pid]||'?')}</span>
      <span class="rguess">${esc(rr.label||'—')}</span>
      <span class="stbadge ${rr.correct?'good':'bad'}">${rr.correct?'goed ✓':'fout ✗'}</span></div>`;
  }).join('');
  return `<div class="card stack" style="gap:8px"><b>Alle gokken</b>${rows}</div>`;
}
function playerReveal(){
  const g=app.game, c=g.current, res = g.results && g.results[app.pid];
  const correct = res && res.correct;
